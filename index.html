function editKid(id){let c=id?state.children.find(x=>x.id===id):{id:'kid_'+Date.now(),firstName:'',lastName:'',fullName:'',age:'',gender:'',group:'Needs Age',color:'',primaryContact:'',phone:'',email:'',emergencyContact:'',medicalNotes:'',shirtSize:'',photoRelease:'',status:'Active',source:'Manual entry',notes:'',manualGroupOverride:false};let body=`<div class="form-grid"><label>First name<input id="kfirst" value="${esc(c.firstName)}"></label><label>Last name<input id="klast" value="${esc(c.lastName)}"></label><label>Age<input id="kage" type="number" min="0" value="${esc(c.age)}"></label><label>Group<select id="kgroup"><option value="Auto assign by age">Auto assign by age</option>${groupOptions(c.group)}</select></label><label>Shirt Size<input id="kshirt" value="${esc(c.shirtSize)}"></label><label>Primary Contact<input id="kcontact" value="${esc(c.primaryContact)}"></label><label>Phone<input id="kphone" value="${esc(c.phone)}"></label><label class="full">Email<input id="kemail" value="${esc(c.email)}"></label><label class="full">Allergy / Medical<textarea id="kmedical">${esc(c.medicalNotes)}</textarea></label></div><div class="notice" style="margin-top:12px">Choose <b>Auto assign by age</b> to place the child by age, or choose a team manually to override. Manual moves are preserved on future roster uploads.</div><div class="actions" style="margin-top:14px"><button onclick="saveKid('${c.id}','${id?'edit':'new'}')">Save Kid</button></div>`;openModal(id?'Edit Child':'Add Child',body)}
function saveKid(id,mode){let group=formVal('kgroup'); let age=formVal('kage'); let manualGroupOverride=group!=='Auto assign by age'; if(group==='Auto assign by age') group=assignGroup(age); let c={id,firstName:formVal('kfirst'),lastName:formVal('klast'),fullName:(formVal('kfirst')+' '+formVal('klast')).trim(),age,gender:'',group,color:groupObj(group)?.color||'',shirtSize:formVal('kshirt'),primaryContact:formVal('kcontact'),phone:formVal('kphone'),email:formVal('kemail'),medicalNotes:formVal('kmedical'),manualGroupOverride,notes:''}; if(mode==='new')state.children.push(c); else Object.assign(state.children.find(x=>x.id===id),c); closeModal(); save()}
function moveKid(id,group){let c=state.children.find(x=>x.id===id); if(!c)return; c.group=group; c.color=groupObj(group)?.color||''; c.manualGroupOverride=true; save()}
function editVolunteer(id){let v=id?state.volunteers.find(x=>x.id===id):{id:'vol_'+Date.now(),name:'',station:'Unassigned',phone:'',email:'',role:'Volunteer'};let body=`<div class="form-grid"><label>Name<input id="vname" value="${esc(v.name)}"></label><label>Role<input id="vrole" value="${esc(v.role)}"></label><label>Station<select id="vstation">${stationOptions(v.station)}</select></label><label>Phone<input id="vphone" value="${esc(v.phone)}"></label><label class="full">Email<input id="vemail" value="${esc(v.email)}"></label></div><div class="actions" style="margin-top:14px"><button onclick="saveVolunteer('${v.id}','${id?'edit':'new'}')">Save Volunteer</button></div>`;openModal(id?'Edit Volunteer':'Add Volunteer',body)}
function saveVolunteer(id,mode){let v={id,name:formVal('vname'),station:formVal('vstation'),phone:formVal('vphone'),email:formVal('vemail'),role:formVal('vrole')};if(mode==='new')state.volunteers.push(v);else state.volunteers=state.volunteers.map(x=>x.id===id?v:x);closeModal();save()}
function removeVolunteer(id){if(confirm('Remove this volunteer?')){state.volunteers=state.volunteers.filter(v=>v.id!==id);save()}}
function editStation(id){let s=id?state.stations.find(x=>x.id===id):{id:'station_'+Date.now(),name:'',needed:1,location:'',notes:''};let body=`<div class="form-grid"><label>Name<input id="sname" value="${esc(s.name)}"></label><label>Needed<input id="sneeded" type="number" value="${esc(s.needed)}"></label><label class="full">Location<input id="slocation" value="${esc(s.location||'')}"></label><label class="full">Notes<textarea id="snotes">${esc(s.notes||'')}</textarea></label></div><div class="actions" style="margin-top:14px"><button onclick="saveStation('${s.id}','${id?'edit':'new'}')">Save Station</button></div>`;openModal(id?'Edit Station':'Add Station',body)}
function saveStation(id,mode){let old=state.stations.find(x=>x.id===id);let s={id,name:formVal('sname'),needed:formVal('sneeded'),location:formVal('slocation'),notes:formVal('snotes')};if(mode==='new')state.stations.push(s);else{state.stations=state.stations.map(x=>x.id===id?s:x);if(old&&old.name!==s.name)state.volunteers.forEach(v=>{if(v.station===old.name)v.station=s.name})}closeModal();save()}
function removeStation(id){let s=state.stations.find(x=>x.id===id);if(!s)return;if(confirm('Remove this station? Volunteers assigned here will become unassigned.')){state.volunteers.forEach(v=>{if(v.station===s.name)v.station='Unassigned'});state.stations=state.stations.filter(x=>x.id!==id);save()}}
function editGroup(name){let g=state.groups.find(x=>x.name===name);let body=`<div class="form-grid"><label>Name<input id="gname" value="${esc(g.name)}"></label><label>Age Range<input id="gage" value="${esc(g.ageRange)}"></label><label>Color Name<input id="gcolor" value="${esc(g.color)}"></label><label>Hex Color<input id="ghex" value="${esc(g.hex)}"></label><label class="full">Leaders, comma separated<input id="gleaders" value="${esc((g.leaders||[]).join(', '))}"></label><label class="full">Team notes<textarea id="gnotes">${esc(g.capacityNotes)}</textarea></label></div><div class="actions" style="margin-top:14px"><button onclick="saveGroup('${esc(g.name)}')">Save Team</button></div>`;openModal('Edit Team',body)}
function saveGroup(oldName){let g=state.groups.find(x=>x.name===oldName);let newName=formVal('gname');Object.assign(g,{name:newName,ageRange:formVal('gage'),color:formVal('gcolor'),hex:formVal('ghex'),leaders:formVal('gleaders').split(',').map(x=>x.trim()).filter(Boolean),capacityNotes:formVal('gnotes')});if(oldName!==newName)state.children.forEach(c=>{if(c.group===oldName)c.group=newName});closeModal();save()}
function editSchedule(i){let r=Number.isInteger(i)?state.schedule[i]:{time:'',title:'',location:'',owner:'',notes:''};let idx=Number.isInteger(i)?i:-1;let body=`<div class="form-grid"><label>Time<input id="rtime" value="${esc(r.time)}"></label><label>Part of Day<input id="rtitle" value="${esc(r.title)}"></label><label>Location<input id="rlocation" value="${esc(r.location)}"></label><label>Lead<input id="rowner" value="${esc(r.owner)}"></label><label class="full">Flow Notes<textarea id="rnotes">${esc(r.notes)}</textarea></label></div><div class="actions" style="margin-top:14px"><button onclick="saveSchedule(${idx})">Save Schedule Item</button>${idx>=0?`<button class="warn" onclick="deleteSchedule(${idx})">Delete</button>`:''}</div>`;openModal(idx>=0?'Edit Schedule Item':'Add Schedule Item',body)}
function saveSchedule(idx){let r={time:formVal('rtime'),title:formVal('rtitle'),location:formVal('rlocation'),owner:formVal('rowner'),notes:formVal('rnotes')};if(idx>=0)state.schedule[idx]=r;else state.schedule.push(r);closeModal();save()}
function deleteSchedule(idx){if(confirm('Delete this schedule item?')){state.schedule.splice(idx,1);closeModal();save()}}
function parseCSV(text){
  const rows=[]; let row=[]; let cell=''; let q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], nx=text[i+1];
    if(ch==='"' && q && nx==='"'){ cell+='"'; i++; }
    else if(ch==='"'){ q=!q; }
    else if(ch===',' && !q){ row.push(cell); cell=''; }
    else if((ch==='\n' || ch==='\r') && !q){
      if(ch==='\r' && nx==='\n') i++;
      row.push(cell);
      if(row.some(x=>String(x).trim())) rows.push(row);
      row=[]; cell='';
    } else cell+=ch;
  }
  row.push(cell);
  if(row.some(x=>String(x).trim())) rows.push(row);
  const head=rows.shift()||[];
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[String(h).trim(),r[i]||''])));
}
function pick(obj,names){for(let n of names){let k=Object.keys(obj).find(x=>x.toLowerCase().includes(n.toLowerCase()));if(k&&obj[k])return obj[k]}return ''}
function normalizeNameForImport(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
function splitFullName(full){full=String(full||'').trim();let p=full.split(/\s+/).filter(Boolean);return {first:p[0]||'',last:p.slice(1).join(' '),full}}
function rowFullName(r){let direct=pick(r,['final name','full name','child name','participant','attendee name','name']);let first=pick(r,['first name','firstname','child first']);let last=pick(r,['last name','lastname','child last']);return String(direct || ((first+' '+last).trim())).trim()}
function handleFile(kind,input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=e=>{let rows=parseCSV(e.target.result);let added=0,updated=0,removed=0;let byName=Object.fromEntries(state.children.map(c=>[normalizeNameForImport(c.fullName),c]));let imported=[];rows.forEach(r=>{let full=rowFullName(r);if(!full)return;if(normalizeNameForImport(full)==='calebkim')return;let age=pick(r,['age']);let birthdate=pick(r,['birthdate','birth date','dob']);let existing=byName[normalizeNameForImport(full)]||null;let names=splitFullName(full);let autoGroup=assignGroup(age||existing?.age);let group=existing?.manualGroupOverride&&existing?.group ? existing.group : autoGroup;let kid={...(existing||{}),id:existing?.id||'kid_'+Date.now()+'_'+Math.random().toString(36).slice(2),firstName:names.first||existing?.firstName||'',lastName:names.last||existing?.lastName||'',fullName:full||existing?.fullName||'',age:age||existing?.age||'',birthdate:birthdate||existing?.birthdate||'',gender:'',group,color:groupObj(group)?.color||'',primaryContact:pick(r,['registration contact first name','parent','guardian','primary contact','contact'])||existing?.primaryContact||'',phone:pick(r,['registration contact phone','mobile phone','phone','mobile'])||existing?.phone||'',email:pick(r,['registration contact home email','home email','email'])||existing?.email||'',emergencyContact:pick(r,['emergency contact'])||existing?.emergencyContact||'',medicalNotes:pick(r,['allergy','medical','special needs','accommodations','notes'])||existing?.medicalNotes||'',shirtSize:pick(r,['shirt'])||existing?.shirtSize||'',photoRelease:existing?.photoRelease||pick(r,['photo'])||'',status:'Active',source:kind==='roster'?'Name + Age Roster CSV':'Imported Registration CSV',manualGroupOverride:!!existing?.manualGroupOverride,notes:existing?.notes||''};imported.push(kid);if(existing){Object.assign(existing,kid);updated++}else{state.children.push(kid);added++}});if(kind==='roster'){let keep=new Set(imported.map(k=>k.id));let before=state.children.length;state.children=state.children.filter(c=>keep.has(c.id));removed=before-state.children.length}alert(`Import finished. Added ${added}, updated ${updated}${kind==='roster'?`, removed ${removed}`:''}. Groups updated by age, with manual moves preserved.`);save()};reader.readAsText(file)}
function exportJSON(){download('vbs_final_dashboard_backup.json',JSON.stringify(state,null,2),'application/json')}
function importJSONPrompt(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=()=>{let r=new FileReader();r.onload=e=>{state=JSON.parse(e.target.result);save()};r.readAsText(input.files[0])};input.click()}
function exportKidsCSV(){
  const cols=['firstName','lastName','age','group','color','primaryContact','phone','email','emergencyContact','medicalNotes','shirtSize','photoRelease'];
  const csv=[cols.join(',')].concat(state.children.map(c=>cols.map(k=>'"'+String(c[k]??'').replace(/"/g,'""')+'"').join(','))).join('\n');
  download('vbs_kids_export.csv',csv,'text/csv');
}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printBySelector(selector){document.querySelectorAll('.print-selected').forEach(e=>e.classList.remove('print-selected'));document.querySelectorAll(selector).forEach(e=>e.classList.add('print-selected'));document.body.classList.add('printing-section');window.print();setTimeout(()=>{document.body.classList.remove('printing-section');document.querySelectorAll('.print-selected').forEach(e=>e.classList.remove('print-selected'))},300)}

function printStations(){activeTab='stations';render();setTimeout(()=>printBySelector('#stationsPrint'),50)}

function documentForStations(){return `<h2>Station Needs and Locations</h2><table><thead><tr><th>Station</th><th>Location</th><th>Needed</th><th>Assigned</th><th>Notes</th></tr></thead><tbody>${state.stations.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.location||'')}</td><td>${esc(s.needed)}</td><td>${stationVols(s.name).map(v=>esc(v.name)).join(', ')}</td><td>${esc(s.notes||'')}</td></tr>`).join('')}</tbody></table>`}
function resetData(){if(confirm('Reset to the built-in final dashboard data? This clears local browser edits.')){localStorage.removeItem(STORAGE_KEY);state=clone(INITIAL_DATA);save()}}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
normalizeData(false); render();
</script></body></html>
