value, and the shared response: &lt;strong&gt;Wow,

&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tuesday, Day
Two&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;God is
love&lt;/td&gt;&lt;td&gt;Jesus dies and comes back to life, Luke 22:39
to 24:12&lt;/td&gt;&lt;td&gt;Psalm 136:1&lt;/td&gt;&lt;td&gt;Speak with
warmth. Keep the cross and resurrection clear, simple, and not
graphic.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Wednesday, Day
Three&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;God is
forever&lt;/td&gt;&lt;td&gt;John sees God’s forever home, Revelation
7:17 and 21 to 22&lt;/td&gt;&lt;td&gt;Psalm
115:18&lt;/td&gt;&lt;td&gt;Teach hope with care. Be sensitive to grief,
heaven, death, and sadness questions.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Thursday, Fun Day + Family
BBQ&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Week
recap&lt;/td&gt;&lt;td&gt;God made us, loves us, and is with us
forever&lt;/td&gt;&lt;td&gt;Week recap&lt;/td&gt;&lt;td&gt;Welcome
parents, keep kids grouped, maintain pickup verification, and finish
with joy.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt; &lt;div
class="card"&gt;&lt;h3&gt;Daily schedule volunteers should
know&lt;/h3&gt;&lt;ol class="flow"&gt; &lt;li&gt;&lt;strong&gt;8:30 to
9:00&lt;/strong&gt; - Volunteer arrival, 8:40 pre-brief, setup. Monday
check-in also runs outside.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;9:00 to
9:50&lt;/strong&gt; - Opening worship, Bible point, memory verse, Buddy,
God Sightings, optional skit or extra songs, and group
release.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;9:55 to 12:00&lt;/strong&gt;
- Five station blocks. Station leaders stay put. Group leaders move with
kids.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;12:05 to 1:00&lt;/strong&gt; -
Lunch, Canopy Closing, recap, prayer, and verified pickup.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;After pickup&lt;/strong&gt; - Reset rooms,
return walkies, stage supplies, and report issues to Jake or
Annie.&lt;/li&gt; &lt;/ol&gt;&lt;div class="callout
info"&gt;&lt;h4&gt;Thursday format&lt;/h4&gt;&lt;p&gt;Thursday keeps the
same safety and pickup rules, but replaces normal rotations with worship
recap, outside games, face paint, final celebration, and Family
BBQ.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt; &lt;div class="grid
two"&gt;&lt;div class="card"&gt;&lt;h3&gt;Station leads&lt;/h3&gt;&lt;ul
class="clean"&gt;&lt;li&gt;Know the day’s Bible point and connect it
naturally to your activity.&lt;/li&gt;&lt;li&gt;Start and end on time,
even if the activity is not perfect.&lt;/li&gt;&lt;li&gt;Give one clear
direction at a time.&lt;/li&gt;&lt;li&gt;Reset your station as soon as
each group leaves.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div
class="card"&gt;&lt;h3&gt;Group leaders&lt;/h3&gt;&lt;ul
class="clean"&gt;&lt;li&gt;Know your group color, names, allergies, and
next location.&lt;/li&gt;&lt;li&gt;Stay with your kids from drop-off
through pickup.&lt;/li&gt;&lt;li&gt;Head count before and after every
transition.&lt;/li&gt;&lt;li&gt;Participate at every station so kids
follow your lead.&lt;/li&gt;&lt;li&gt;Never release a child without
pickup verification.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt; &lt;!-- ============ VOLUNTEER TRAINING: CHECK-IN
PICKUP SAFETY ============ --&gt; &lt;section
id="checkin-pickup-safety"&gt; &lt;div class="section-head"&gt;&lt;span
class="num"&gt;3&lt;/span&gt;&lt;h2 class="title"&gt;Check-in, Pickup,
and Safety Procedures&lt;/h2&gt;&lt;/div&gt; &lt;p
class="lead"&gt;&lt;strong&gt;Used for:&lt;/strong&gt; Sunday volunteer
walk-through, Monday morning check-in setup, daily pre-brief reminders,
and pickup teams.&lt;/p&gt; &lt;div class="card"&gt;&lt;h3&gt;Monday
check-in flow&lt;/h3&gt;&lt;div class="flowchart"&gt; &lt;div
class="flowstep"&gt;&lt;div
class="n"&gt;1&lt;/div&gt;&lt;h4&gt;Welcome&lt;/h4&gt;&lt;p&gt;Greet
family outside at the entrance turf. Confirm child name and
registration.&lt;/p&gt;&lt;/div&gt; &lt;div class="flowstep"&gt;&lt;div
class="n"&gt;2&lt;/div&gt;&lt;h4&gt;Verify&lt;/h4&gt;&lt;p&gt;Confirm
allergies, emergency notes, family contact, and pickup
code.&lt;/p&gt;&lt;/div&gt; &lt;div class="flowstep"&gt;&lt;div
class="n"&gt;3&lt;/div&gt;&lt;h4&gt;Hand out kit&lt;/h4&gt;&lt;p&gt;Give
shirt, lanyard/name tag, wristband, drawstring bag, and group
color.&lt;/p&gt;&lt;/div&gt; &lt;div class="flowstep"&gt;&lt;div
class="n"&gt;4&lt;/div&gt;&lt;h4&gt;Send to
group&lt;/h4&gt;&lt;p&gt;Walk or direct the child to the Sanctuary group
area by color.&lt;/p&gt;&lt;/div&gt; &lt;div class="flowstep"&gt;&lt;div
class="n"&gt;5&lt;/div&gt;&lt;h4&gt;Group leader
receives&lt;/h4&gt;&lt;p&gt;Leader greets child, checks them onto the
group list, and keeps them with the group.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt; &lt;div class="grid two"&gt;&lt;div
class="card"&gt;&lt;h3&gt;Days Two to Four drop-off&lt;/h3&gt;&lt;ol
class="flow"&gt;&lt;li&gt;Family arrives at the
door.&lt;/li&gt;&lt;li&gt;Greeter welcomes them and points child to the
Sanctuary.&lt;/li&gt;&lt;li&gt;Child joins assigned group color
area.&lt;/li&gt;&lt;li&gt;Group leader confirms child is
present.&lt;/li&gt;&lt;li&gt;Any parent question goes to Jake or
Annie.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt; &lt;div
class="card"&gt;&lt;h3&gt;Pickup decision rule&lt;/h3&gt;&lt;div
class="traffic"&gt;&lt;div class="go"&gt;&lt;div class="lbl"&gt;Code
matches&lt;/div&gt;&lt;p&gt;Release the child to the adult, mark pickup
complete, and keep the line moving.&lt;/p&gt;&lt;/div&gt;&lt;div
class="stop"&gt;&lt;div class="lbl"&gt;Code missing or
unclear&lt;/div&gt;&lt;p&gt;Do not release the child. Keep the child
with the group and call Jake or Annie.&lt;/p&gt;&lt;/div&gt;&lt;div
class="stop"&gt;&lt;div class="lbl"&gt;Do not
guess&lt;/div&gt;&lt;p&gt;No exceptions because someone is in a hurry,
knows the child, or is present at
BBQ.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt; &lt;div
class="card"&gt;&lt;h3&gt;Safety procedures every volunteer
follows&lt;/h3&gt;&lt;div
class="tbl-wrap"&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Required
procedure&lt;/th&gt;&lt;th&gt;Escalate
to&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Head counts&lt;/td&gt;&lt;td&gt;Count before leaving
a room, after arriving, before lunch, before closing, and before
pickup.&lt;/td&gt;&lt;td&gt;Group leader, then Jake or Annie if a child
is missing.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Allergies&lt;/td&gt;&lt;td&gt;Check allergy notes
before snack, lunch, face paint, and BBQ. Do not guess on
ingredients.&lt;/td&gt;&lt;td&gt;Snack lead, Jake, or
Annie.&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td&gt;Bathroom
trips&lt;/td&gt;&lt;td&gt;Use the buddy/leader system. A group should
never be left without adult coverage.&lt;/td&gt;&lt;td&gt;Group leader
or floater.&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td&gt;Injury or
illness&lt;/td&gt;&lt;td&gt;Bring child to first aid or call for help.
Keep calm and document what happened.&lt;/td&gt;&lt;td&gt;Jake or
Annie.&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td&gt;Behavior
concerns&lt;/td&gt;&lt;td&gt;Use calm, clear language. Keep the child
and group safe. Do not shame or argue.&lt;/td&gt;&lt;td&gt;Jake or Annie
if behavior continues or safety is affected.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Parent access&lt;/td&gt;&lt;td&gt;Parents stay
outside child areas unless directed by Jake or Annie. Thursday parent
presence does not change pickup rules.&lt;/td&gt;&lt;td&gt;Jake or
Annie.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Walkies&lt;/td&gt;&lt;td&gt;Keep messages short:
who, where, what is needed. Return and charge at end of
day.&lt;/td&gt;&lt;td&gt;Jake or Annie.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt; &lt;/section&gt;
&lt;section id="groups"&gt; &lt;div class="section-head"&gt;&lt;span
class="num"&gt;5&lt;/span&gt;&lt;h2 class="title"&gt;Kids, groups,
leaders &amp;amp; colors&lt;/h2&gt;&lt;/div&gt; &lt;p
class="lead"&gt;Kids are divided into &lt;strong&gt;five
groups&lt;/strong&gt; by age band, each with a name, a
&lt;strong&gt;lanyard color&lt;/strong&gt;, and assigned
&lt;strong&gt;group leaders&lt;/strong&gt;. Groups stay together (aim
for about 8 to 12 kids each) and travel through every station as a unit,
so all five stations run full every block.&lt;/p&gt; &lt;h3
style="margin-top:24px;"&gt;The 5 groups, colors &amp;amp;
leaders&lt;/h3&gt; &lt;div class="grouprow"&gt; &lt;span
class="gchip"&gt;&lt;span class="sw"
style="background:var(--g-treefrog)"&gt;&lt;/span&gt;Tree Frogs · 3-4 ·
Red&lt;/span&gt; &lt;span class="gchip"&gt;&lt;span class="sw"
style="background:var(--g-toucan)"&gt;&lt;/span&gt;Toucans · 5 ·
Orange&lt;/span&gt; &lt;span class="gchip"&gt;&lt;span class="sw"
style="background:var(--g-monkey)"&gt;&lt;/span&gt;Monkeys · 6-7 ·
Yellow&lt;/span&gt; &lt;span class="gchip"&gt;&lt;span class="sw"
style="background:var(--g-parrot)"&gt;&lt;/span&gt;Parrots · 8-9 ·
Green&lt;/span&gt; &lt;span class="gchip"&gt;&lt;span class="sw"
style="background:var(--g-tiger)"&gt;&lt;/span&gt;Tigers · 10-12 ·
Blue&lt;/span&gt; &lt;span class="gchip"&gt;&lt;span class="sw"
style="background:var(--g-leader)"&gt;&lt;/span&gt;Station Leaders ·
Purple&lt;/span&gt; &lt;/div&gt; &lt;h3
style="margin-top:22px;"&gt;Group detail&lt;/h3&gt; &lt;div
class="tbl-wrap"&gt; &lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Group&lt;/th&gt;&lt;th&gt;Color&lt;/th&gt;&lt;th&gt;Ages&lt;/th&gt;&lt;th&gt;Group
leaders&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt; &lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class="k"&gt;Tree
Frogs&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class="gtag"
style="background:var(--g-treefrog);color:#fff"&gt;Red&lt;/span&gt;&lt;/td&gt;&lt;td&gt;3-4&lt;/td&gt;&lt;td&gt;Gabriela
Kish&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td&gt;&lt;span
class="k"&gt;Toucans&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span
class="gtag"
style="background:var(--g-toucan);color:#3a2606"&gt;Orange&lt;/span&gt;&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;JoLayne
E. &amp;amp; Kimberly&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td&gt;&lt;span
class="k"&gt;Monkeys&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span
class="gtag"
style="background:var(--g-monkey);color:#3a2606"&gt;Yellow&lt;/span&gt;&lt;/td&gt;&lt;td&gt;6-7&lt;/td&gt;&lt;td&gt;Grace
K. &amp;amp; Eva&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td&gt;&lt;span
class="k"&gt;Parrots&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span
class="gtag"
style="background:var(--g-parrot);color:#fff"&gt;Green&lt;/span&gt;&lt;/td&gt;&lt;td&gt;8-9&lt;/td&gt;&lt;td&gt;Hailey
S. &amp;amp; Stacy G.&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td&gt;&lt;span
class="k"&gt;Tigers&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span
class="gtag"
style="background:var(--g-tiger);color:#fff"&gt;Blue&lt;/span&gt;&lt;/td&gt;&lt;td&gt;10-12&lt;/td&gt;&lt;td&gt;Elisabeth
M.&lt;/td&gt;&lt;/tr&gt; &lt;/tbody&gt; &lt;/table&gt; &lt;/div&gt;
&lt;div class="callout info"&gt; &lt;h4&gt;Lanyard colors at a
glance&lt;/h4&gt; &lt;p&gt;&lt;strong&gt;Red&lt;/strong&gt; = Tree
Frogs, &lt;strong&gt;Orange&lt;/strong&gt; = Toucans,
&lt;strong&gt;Yellow&lt;/strong&gt; = Monkeys,
&lt;strong&gt;Green&lt;/strong&gt; = Parrots,
&lt;strong&gt;Blue&lt;/strong&gt; = Tigers, and
&lt;strong&gt;Purple&lt;/strong&gt; = Station Leaders. A child's lanyard
color tells any volunteer at a glance which group they belong
to.&lt;/p&gt; &lt;/div&gt; &lt;/section&gt; &lt;!-- ============ WHO
DOES WHAT ============ --&gt; &lt;section id="roles"&gt; &lt;div
class="section-head"&gt;&lt;span class="num"&gt;6&lt;/span&gt;&lt;h2
class="title"&gt;Who does what&lt;/h2&gt;&lt;/div&gt; &lt;p
class="lead"&gt;Four roles make the day run. Most volunteers are
&lt;strong&gt;group leaders&lt;/strong&gt; or &lt;strong&gt;station
leads&lt;/strong&gt;. Know your lane.&lt;/p&gt; &lt;div
class="roles"&gt; &lt;div class="role-card"&gt; &lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--canopy)"&gt;&lt;/span&gt;Team leads /
Directors&lt;/div&gt; &lt;p&gt;&lt;strong&gt;Jake &amp;amp;
Annie&lt;/strong&gt; run the day. They open and close, set the day focus
in the 8:30 briefing, handle escalations, allergies, security, and
pickup decisions, and answer any "I am not sure" question. Find them in
the Sanctuary or Briefing Room.&lt;/p&gt; &lt;/div&gt; &lt;div
class="role-card"&gt; &lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--lagoon)"&gt;&lt;/span&gt;Station
leads&lt;/div&gt; &lt;p&gt;Own one room all week. Set up before kids
arrive, lead the activity, keep the rotation on time, and reset between
groups. They teach the content; group leaders manage the kids.&lt;/p&gt;
&lt;/div&gt; &lt;div class="role-card"&gt; &lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--leaf)"&gt;&lt;/span&gt;Group / Crew
leaders&lt;/div&gt; &lt;p&gt;Shepherd one group through the
&lt;em&gt;whole&lt;/em&gt; morning. Stay with your kids at every
station, learn names, help them participate, keep them together and
safe, and handle bathroom trips per policy. You are the constant;
stations change around you.&lt;/p&gt; &lt;/div&gt; &lt;div
class="role-card"&gt; &lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--mango)"&gt;&lt;/span&gt;Floaters &amp;amp;
support&lt;/div&gt; &lt;p&gt;Fill gaps: extra hands at busy stations,
bathroom escorts, supply runs, line control, covering breaks. Staged
from the Briefing Room; the directors deploy them where
needed.&lt;/p&gt; &lt;/div&gt; &lt;div class="role-card"&gt; &lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--twilight)"&gt;&lt;/span&gt;Content / station
support - Drea&lt;/div&gt; &lt;p&gt;Roves between stations to keep the
daily content and age-level notes on track and helps any team that falls
behind.&lt;/p&gt; &lt;/div&gt; &lt;div class="role-card"&gt; &lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--bark)"&gt;&lt;/span&gt;Production -
Ian&lt;/div&gt; &lt;p&gt;Runs sound, media, slides, and the Spotlight
show for opening and closing. Your go-to for any tech or A/V
need.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="callout
watch"&gt; &lt;h4&gt;The golden rule of transitions&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Group leaders move with their kids; station leads
stay put.&lt;/strong&gt; When a rotation ends, the station lead thanks
the group and points them to the next room - the group leader walks them
there and checks in with the next lead. Kids are never between rooms
without their group leader.&lt;/p&gt; &lt;/div&gt; &lt;div
class="callout info"&gt; &lt;h4&gt;Staying on time&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Station leaders use countdown
clocks&lt;/strong&gt; at their station so every block ends on time.
&lt;strong&gt;Group leaders keep a timer on their phone&lt;/strong&gt;
as a backup and to pace bathroom trips. &lt;strong&gt;Jake and Annie
float all morning&lt;/strong&gt; to keep transitions crisp - if a
hallway is jamming up or a room is running long, they will help move it
along.&lt;/p&gt; &lt;/div&gt; &lt;div class="card"
style="background:var(--paper-2);"&gt; &lt;h3
style="margin-bottom:6px;"&gt;Jump to a section&lt;/h3&gt; &lt;div
class="tocgrid"&gt; &lt;a href="#daily-flow"&gt;&lt;span&gt;&lt;span
class="n"&gt;04&lt;/span&gt;  Daily flow &amp;amp; rules

&lt;/section&gt; &lt;!-- ============ DAILY FLOW &amp; RULES
============ --&gt; &lt;section class="pagebreak" id="daily-flow"&gt;
&lt;div class="section-head"&gt;&lt;span
class="num"&gt;7&lt;/span&gt;&lt;h2 class="title"&gt;Daily flow
&amp;amp; the rules everyone follows&lt;/h2&gt;&lt;/div&gt; &lt;p
class="lead"&gt;Whatever station you serve, these are the shared
mechanics. Learn them once and you can plug in anywhere.&lt;/p&gt;
&lt;h3 style="margin-top:24px;"&gt;The standard rotation
block&lt;/h3&gt; &lt;p class="mini"&gt;Each station block runs about 20
to 25 minutes. Station leads aim for this shape so groups arrive and
leave on time.&lt;/p&gt; &lt;div class="grid two"&gt; &lt;div
class="card" style="margin:0;"&gt; &lt;ol class="flow"&gt;
&lt;li&gt;&lt;strong&gt;Receive &amp;amp; welcome&lt;/strong&gt; - greet
the group, confirm which group it is, settle them.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;State the focus&lt;/strong&gt; - say the day's
Bible point; kids respond "Wow, God!"&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Lead the activity&lt;/strong&gt; - the station's
content. Keep it moving.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Connect&lt;/strong&gt; - one question linking
the activity to who God is.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Close
&amp;amp; send&lt;/strong&gt; - repeat the point, thank them, hand off
to the next room.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Reset&lt;/strong&gt; - clear and restock before
the next group arrives.&lt;/li&gt; &lt;/ol&gt; &lt;/div&gt; &lt;div
class="card" style="margin:0;"&gt; &lt;h3
style="font-size:1.05rem;"&gt;The "Wow, God!" response&lt;/h3&gt; &lt;p
class="mini"&gt;Used at every station, all week. Say the Bible point and
the kids fling both hands open like fireworks and shout
&lt;strong&gt;"Wow, God!"&lt;/strong&gt; It is our response to the day's
truth about God's nature.&lt;/p&gt; &lt;h3
style="font-size:1.05rem;margin-top:16px;"&gt;The attention
signal&lt;/h3&gt; &lt;p class="mini"&gt;Adopt one team-wide so it works
in any room. &lt;strong&gt;Suggested:&lt;/strong&gt; a leader calls
&lt;em&gt;"Rainforest..."&lt;/em&gt; and kids answer
&lt;em&gt;"...READY!"&lt;/em&gt;, freeze, eyes up, voices off. Always
wait for full quiet before giving directions.&lt;/p&gt; &lt;/div&gt;
&lt;/div&gt; &lt;h3 style="margin-top:26px;"&gt;Behavior &amp;amp;
safety language&lt;/h3&gt; &lt;div class="grid two"&gt; &lt;div
class="card" style="margin:0;"&gt; &lt;ul class="clean"&gt;
&lt;li&gt;Use &lt;strong&gt;positive&lt;/strong&gt; directions: "Walk
with your group," not "Do not run."&lt;/li&gt; &lt;li&gt;If kids talk
over you, &lt;strong&gt;stop and wait&lt;/strong&gt; for quiet before
continuing.&lt;/li&gt; &lt;li&gt;If a child is upset, the group leader
stays close; offer a calm job or a short reset in the Nursery or
hallway.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Never shame&lt;/strong&gt; a
child for losing, answering differently, needing help, or sitting
out.&lt;/li&gt; &lt;li&gt;Group leaders stay with their kids
&lt;strong&gt;at all times&lt;/strong&gt;, including transitions and
bathrooms.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div class="callout
safety" style="margin:0;"&gt; &lt;h4&gt;Stop &amp;amp; get a director -
do not guess&lt;/h4&gt; &lt;p&gt;For any &lt;strong&gt;bathroom,
allergy, injury, or security&lt;/strong&gt; concern, pause and get Jake,
Annie, or Jake or Annie.&lt;/p&gt; &lt;p&gt;Disclosures of
&lt;strong&gt;harm or abuse&lt;/strong&gt;: thank the child, stay calm,
involve a director now. No secrecy, no investigating.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Faith or salvation questions:&lt;/strong&gt;
affirm them, do not pressure, and loop in a pastoral leader
after.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/section&gt; &lt;!--

down the grid each block (wrapping from Scripture back to Games). You
stay with the kids the whole time; the rooms change around
you.&lt;/p&gt; &lt;/div&gt; &lt;div class="callout watch"
style="margin:0;"&gt; &lt;h4&gt;If you are a station lead&lt;/h4&gt;
&lt;p&gt;Read your row left to right: that is the order of groups you
receive. Tree Frogs are youngest, Tigers are oldest - plan your pacing
and difficulty for whoever is next.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt;

&lt;section class="station" id="checkin"&gt; &lt;div
class="station-banner b-twilight"&gt; &lt;div
class="ico"&gt;CI&lt;/div&gt; &lt;div&gt; &lt;div class="role"&gt;Monday
8:30 to 9:00 · Outdoors at the entrance&lt;/div&gt; &lt;h2&gt;Check-in
&amp;amp; the Monday kit handout&lt;/h2&gt; &lt;div class="tag"&gt;The
very first thing families experience. We run it outside so arrival feels
like a party, get every child signed in for the week, and send them into
the Sanctuary ready to go.&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div
class="glance"&gt; &lt;div&gt;&lt;div
class="lbl"&gt;When&lt;/div&gt;&lt;div class="val"&gt;Monday 8:30-9:00
(outdoors)&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Where&lt;/div&gt;&lt;div class="val"&gt;Building
entrance, smaller turf area&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Led by&lt;/div&gt;&lt;div class="val"&gt;Kendra + 2 to 3
volunteers&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Monday&lt;/div&gt;&lt;div class="val"&gt;Sign in for the
week, hand out bags&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;p
class="lead"&gt;On Monday the building entrance is our check-in. Set up
on the &lt;strong&gt;smaller turf area to the side as you face the
building&lt;/strong&gt;, so the whole arrival happens outdoors and feels
like the start of an adventure. Kendra leads a team of two to three
volunteers at the table. They sign each child in for the entire week,
hand over the child's drawstring bag, and direct families inside. Aim to
have &lt;strong&gt;every child checked in by 9:00&lt;/strong&gt; so
opening can start clean at 9:00 sharp.&lt;/p&gt; &lt;div class="grid
two"&gt; &lt;div class="card" style="margin:0;"&gt; &lt;h3
style="font-size:1.05rem;"&gt;Monday check-in flow&lt;/h3&gt; &lt;ol
class="flow"&gt; &lt;li&gt;Family arrives at the turf-area table by the
entrance.&lt;/li&gt; &lt;li&gt;A volunteer signs the child in for the
week on the roster.&lt;/li&gt; &lt;li&gt;Hand the child their drawstring
bag (laid out on tables in alphabetical order by last name for fast
grab).&lt;/li&gt; &lt;li&gt;Point the family to any handouts and resolve
payment if needed (see below).&lt;/li&gt; &lt;li&gt;A volunteer leads
the kids inside to the Sanctuary to hang out until the day
begins.&lt;/li&gt; &lt;/ol&gt; &lt;/div&gt; &lt;div class="card"
style="margin:0;"&gt; &lt;h3 style="font-size:1.05rem;"&gt;What is in
each drawstring bag&lt;/h3&gt; &lt;p class="mini"
style="margin-top:0;"&gt;Bags are pre-stuffed and pre-sorted
alphabetically so the line never stalls. Each contains:&lt;/p&gt; &lt;ul
class="check"&gt; &lt;li&gt;The child's &lt;strong&gt;lanyard + name
tag&lt;/strong&gt;, in their &lt;strong&gt;group
color&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;Their &lt;strong&gt;Psalm
book&lt;/strong&gt; for the week&lt;/li&gt; &lt;li&gt;Any other
take-home/welcome items&lt;/li&gt; &lt;/ul&gt; &lt;p class="mini"&gt;The
drawstring bag is theirs for the week. Lanyard color = group color, so
any volunteer can tell at a glance where a child belongs.&lt;/p&gt;
&lt;/div&gt; &lt;/div&gt; &lt;div class="callout info"&gt;
&lt;h4&gt;Monday - what every parent leaves with&lt;/h4&gt;
&lt;p&gt;Hand each family &lt;strong&gt;the schedule for the
week&lt;/strong&gt;, an &lt;strong&gt;invitation to the Thursday Family
BBQ&lt;/strong&gt;, and their &lt;strong&gt;custom pickup
code&lt;/strong&gt; (used to verify pickup all week). If a family's
registration is &lt;strong&gt;not paid&lt;/strong&gt;, Kendra or a
director quietly lets them know the amount due and how to pay -
discreetly, away from the child and out of earshot of other families.
Note the family, share it kindly, keep the line moving.&lt;/p&gt;
&lt;/div&gt; &lt;div class="callout tip"&gt; &lt;h4&gt;Keep check-in
high energy&lt;/h4&gt; &lt;p&gt;First impressions set the tone for the
whole week. Have &lt;strong&gt;upbeat worship/theme music&lt;/strong&gt;
playing at the table, greeters calling kids by name with
&lt;strong&gt;high-fives or a quick "welcome tunnel,"&lt;/strong&gt; and
a loud, happy &lt;strong&gt;"Welcome to the rainforest!"&lt;/strong&gt;
for every family. Cheer when a group color shows up ("Reds in the house
- Tree Frogs, let's go!"). Smiles, sunglasses, fun hats - make the turf
feel like the front door of an adventure, not a paperwork
desk.&lt;/p&gt; &lt;/div&gt; &lt;h3&gt;Who does what here&lt;/h3&gt;
&lt;div class="roles"&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--lagoon)"&gt;&lt;/span&gt;Kendra (check-in
lead)&lt;/div&gt;&lt;p&gt;Runs the table, owns the roster and the
alphabetical bag layout, handles payment conversations, and keeps the
line moving so everyone is in by 9:00 and into the
Sanctuary.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--mango)"&gt;&lt;/span&gt;Check-in volunteers
(2-3)&lt;/div&gt;&lt;p&gt;Sign kids in, hand out bags, give parents the
schedule and BBQ invite, and walk kids into the
Sanctuary.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--canopy)"&gt;&lt;/span&gt;Directors (Jake
&amp;amp; Annie)&lt;/div&gt;&lt;p&gt;Available for any payment,
registration, or pickup question Kendra flags - handled
quietly.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--leaf)"&gt;&lt;/span&gt;Group
leaders&lt;/div&gt;&lt;p&gt;Receive kids inside the Sanctuary, gather
your group by its color sign, and keep them together until
opening.&lt;/p&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class="grid two"&gt;
&lt;div class="callout safety" style="margin:0;"&gt;&lt;h4&gt;Drop-off,
pickup &amp;amp; the custom code&lt;/h4&gt; &lt;p&gt;Drop-off and pickup
follow a &lt;strong&gt;Sunday-style check-in flow&lt;/strong&gt;. At
drop-off each family receives a &lt;strong&gt;custom pickup
code&lt;/strong&gt;. At pickup, a child is released
&lt;strong&gt;only&lt;/strong&gt; to an adult who gives the matching
code. Never release a child to anyone without the code - any doubt goes
to a director.&lt;/p&gt; &lt;/div&gt; &lt;div class="callout tip"
style="margin:0;"&gt;&lt;h4&gt;Days 2 to 4 are faster&lt;/h4&gt;
&lt;p&gt;No tables of bags and no packets. Kids are
&lt;strong&gt;dropped off and go straight into the
Sanctuary&lt;/strong&gt; to be with their group. A greeter at the door
keeps it warm and quick; group leaders gather kids inside by
color.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/section&gt; &lt;!--
============ OPENING ============ --&gt; &lt;section class="station"
id="opening"&gt; &lt;div class="station-banner b-twilight"&gt; &lt;div
class="ico"&gt;OP&lt;/div&gt; &lt;div&gt; &lt;div class="role"&gt;9:00
to 9:50 · Everyone together · Led by Jake &amp;amp; Annie&lt;/div&gt;
&lt;h2&gt;Opening - Sing &amp;amp; Play Tune Lagoon&lt;/h2&gt; &lt;div
class="tag"&gt;The whole VBS gathers in the Sanctuary to start the day
with one voice: worship songs, the daily Bible point, the memory verse,
the Bible Memory Buddy, God Sightings, and the optional daily skit -
before groups split off to rotations.&lt;/div&gt; &lt;/div&gt;
&lt;/div&gt; &lt;div class="glance"&gt; &lt;div&gt;&lt;div
class="lbl"&gt;When&lt;/div&gt;&lt;div class="val"&gt;9:00 to 9:50,
daily&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Where&lt;/div&gt;&lt;div class="val"&gt;Sanctuary (Tune
Lagoon set)&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Led by&lt;/div&gt;&lt;div class="val"&gt;Jake &amp;amp;
Annie + worship team + optional skit team&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class="lbl"&gt;Who is there&lt;/div&gt;&lt;div
class="val"&gt;All kids, all leaders&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt; &lt;p class="lead"&gt;All kids and leaders begin in the
Sanctuary for worship songs, daily Bible point, memory verse, Buddy, God
Sightings, optional skit or extra songs, and group release by
color.&lt;/p&gt;&lt;div class="callout info"&gt;&lt;h4&gt;Opening backup
plan&lt;/h4&gt;&lt;p&gt;If the optional skit is not staffed, do not
force it. Continue with worship and dance, add one or two Forest Frank
songs or familiar sing-alongs, then move directly into the Bible point,
verse, Buddy, God Sightings, and group release.&lt;/p&gt;&lt;/div&gt;
&lt;div class="callout tip"&gt;&lt;h4&gt;The room &amp;amp; where things
happen&lt;/h4&gt; &lt;p&gt;The &lt;strong&gt;Sanctuary&lt;/strong&gt; is
set as a rainforest with a waterfall installation by the stage.
&lt;strong&gt;Chairs are pushed to the back all week&lt;/strong&gt; for
open movement space. Each group gathers and is dismissed at its
&lt;strong&gt;color sign&lt;/strong&gt; (Red Tree Frogs, Orange Toucans,
Yellow Monkeys, Green Parrots, Blue Tigers). A &lt;strong&gt;God
Sightings Celebration Spot&lt;/strong&gt; (a marked wall or stage
section) holds the banner and the cutouts groups add each day. The
&lt;strong&gt;day's Bible Point Poster&lt;/strong&gt; stands up front,
and the screen shows the Bible Memory Buddy intro and the closing
Spotlight photos.&lt;/p&gt; &lt;/div&gt; &lt;div class="grid two"&gt;
&lt;div class="card" style="margin:0;"&gt; &lt;h3
style="font-size:1.05rem;"&gt;Before kids arrive (setup)&lt;/h3&gt;
&lt;ul class="check"&gt; &lt;li&gt;Test the microphone, sound system,
screen &amp;amp; music&lt;/li&gt; &lt;li&gt;Set the day's Bible Point
Poster up front&lt;/li&gt; &lt;li&gt;Set up the God Sightings
Celebration Spot + tape&lt;/li&gt; &lt;li&gt;Place each group's color
sign for gathering&lt;/li&gt; &lt;li&gt;Start the music ~30 min early to
set the vibe&lt;/li&gt; &lt;li&gt;5 minutes before: leader huddle
&amp;amp; prayer up front&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div
class="card" style="margin:0;"&gt; &lt;h3
style="font-size:1.05rem;"&gt;Opening flow (9:00 to 9:50)&lt;/h3&gt;
&lt;ol class="flow"&gt; &lt;li&gt;Jake/Annie welcome everyone and name
the day &amp;amp; theme.&lt;/li&gt; &lt;li&gt;Opening prayer + quick
safety/flow reminders.&lt;/li&gt; &lt;li&gt;Worship song(s) with motions
(worship team).&lt;/li&gt; &lt;li&gt;Teach/repeat the Bible point +
"Wow, God!" response.&lt;/li&gt; &lt;li&gt;Introduce and read the day's
Bible verse.&lt;/li&gt; &lt;li&gt;Meet the day's Bible Memory Buddy
(intro video/poster).&lt;/li&gt; &lt;li&gt;God Sightings (Day 2+):
groups share &amp;amp; add cutouts.&lt;/li&gt; &lt;li&gt;A short
whole-group game.&lt;/li&gt; &lt;li&gt;The optional daily skit (&lt;a
href="#scripts"&gt;full scripts here&lt;/a&gt;).&lt;/li&gt;
&lt;li&gt;Announcements, prayer, release groups to Block 1.&lt;/li&gt;
&lt;/ol&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="callout
info"&gt;&lt;h4&gt;The "Wow, God!" response (teach it Day 1)&lt;/h4&gt;
&lt;p&gt;Every time a leader says the day's Bible point, kids
&lt;strong&gt;fling their fingers wide like fireworks&lt;/strong&gt; and
shout &lt;strong&gt;"Wow, God!"&lt;/strong&gt; Teach it slowly on
Monday; it should be automatic by Wednesday. It is used at every
station, all week.&lt;/p&gt; &lt;/div&gt; &lt;h3&gt;Who does what
here&lt;/h3&gt; &lt;div class="roles"&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--canopy)"&gt;&lt;/span&gt;Jake &amp;amp; Annie
(lead)&lt;/div&gt;&lt;p&gt;Host the whole opening: welcome, Bible point,
verse, Buddy intro, God Sightings, announcements, prayer, and the timed
release to stations.&lt;/p&gt;&lt;/div&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--lagoon)"&gt;&lt;/span&gt;Worship team (Grace,
Eva, Mya)&lt;/div&gt;&lt;p&gt;Lead songs and motions from the stage and
the sides; model the energy and the "Wow, God!"
response.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--berry)"&gt;&lt;/span&gt;Optional skit
team&lt;/div&gt;&lt;p&gt;Perform the day's skit (Ranger Rio). See the
scripts section.&lt;/p&gt;&lt;/div&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--leaf)"&gt;&lt;/span&gt;Group
leaders&lt;/div&gt;&lt;p&gt;Sit with your group at its color sign, do
every motion, lead God Sightings sharing, keep kids together, and listen
for your release cue. Kids follow your lead.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt; &lt;h3&gt;Day by day at opening&lt;/h3&gt; &lt;div
class="tbl-wrap"&gt; &lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Day&lt;/th&gt;&lt;th&gt;Bible
point&lt;/th&gt;&lt;th&gt;Verse&lt;/th&gt;&lt;th&gt;Buddy&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt; &lt;tr&gt;&lt;td
class="time"&gt;Mon&lt;/td&gt;&lt;td&gt;&lt;span class="k"&gt;God is our
creator&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Psalm
103:22&lt;/td&gt;&lt;td&gt;Tango&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td
class="time"&gt;Tue&lt;/td&gt;&lt;td&gt;&lt;span class="k"&gt;God is
love&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Psalm
136:1&lt;/td&gt;&lt;td&gt;Tia&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td
class="time"&gt;Wed&lt;/td&gt;&lt;td&gt;&lt;span class="k"&gt;God is
forever&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Psalm
115:18&lt;/td&gt;&lt;td&gt;Howie&lt;/td&gt;&lt;/tr&gt; &lt;tr&gt;&lt;td
class="time"&gt;Thu&lt;/td&gt;&lt;td&gt;&lt;span class="k"&gt;Celebrate
it all&lt;/span&gt; (Fun
Day)&lt;/td&gt;&lt;td&gt;Review&lt;/td&gt;&lt;td&gt;All
three&lt;/td&gt;&lt;/tr&gt; &lt;/tbody&gt; &lt;/table&gt; &lt;/div&gt;
&lt;p class="mini"&gt;Songs come from the Rainforest Falls set ("God
Is," "Majestic," "All Creatures of Our God and King," and more). God
Sightings sharing begins Tuesday; on Monday, opening focuses on teaching
the response and orienting groups.&lt;/p&gt;</p>
<p>&lt;/section&gt; &lt;!-- ============ SKIT LOGISTICS ============
--&gt; &lt;section class="station" id="skit"&gt; &lt;div
class="station-banner b-berry"&gt; &lt;div class="ico"&gt;SK&lt;/div&gt;
&lt;div&gt; &lt;div class="role"&gt;Inside Opening · Daily&lt;/div&gt;
&lt;h2&gt;The optional daily skit - logistics&lt;/h2&gt; &lt;div
class="tag"&gt;A short, recurring-character skit that dramatizes the
day's truth about God and hands the kids a picture they carry into every
station. Full scripts are in the next section.&lt;/div&gt; &lt;/div&gt;
&lt;/div&gt; &lt;div class="glance"&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Where&lt;/div&gt;&lt;div class="val"&gt;Sanctuary
stage&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;When&lt;/div&gt;&lt;div class="val"&gt;~9:42 to 9:50,
daily&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Length&lt;/div&gt;&lt;div class="val"&gt;5 to 8
minutes&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div class="lbl"&gt;Run
by&lt;/div&gt;&lt;div class="val"&gt;Optional skit team (see
below)&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;p class="lead"&gt;The
optional skit is the storytelling heartbeat of opening. The same
characters return each day so kids stay invested across the week, and
each day the characters hit a problem that the day's truth about God
answers. It happens on the main stage during opening, right after the
group game and just before the Bible point, so the optional skit sets up
the point the leaders then say out loud.&lt;/p&gt;&lt;div class="callout
info"&gt;&lt;h4&gt;Skit is optional this year&lt;/h4&gt;&lt;p&gt;Use the
skit only if the volunteer team is staffed and ready. If not, keep
opening simple: worship, the daily Bible point, memory verse, Buddy, God
Sightings, and extra songs. Forest Frank songs or familiar sing-alongs
can fill that time without disrupting the
schedule.&lt;/p&gt;&lt;/div&gt; &lt;h3&gt;The recurring
characters&lt;/h3&gt; &lt;div class="roles"&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--lagoon)"&gt;&lt;/span&gt;GUIDE&lt;/div&gt;&lt;p&gt;The
steady, warm host who frames each scene and lands the day's truth. Off
book, high energy. Same actor all week.&lt;/p&gt;&lt;/div&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--mango)"&gt;&lt;/span&gt;RANGER
RIO&lt;/div&gt;&lt;p&gt;The lovable, over-enthusiastic rainforest ranger
who has the problem or question each day. Big, kid-friendly expressions;
the character the kids root for.&lt;/p&gt;&lt;/div&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--berry)"&gt;&lt;/span&gt;COCO
(optional)&lt;/div&gt;&lt;p&gt;A toucan puppet sidekick for comic
relief, operated by a helper. Lines are optional - cut Coco if you only
have two actors.&lt;/p&gt;&lt;/div&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--canopy)"&gt;&lt;/span&gt;TECH&lt;/div&gt;&lt;p&gt;Mics,
music stings, lights, and props. Cues the start and the
close.&lt;/p&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class="callout
info"&gt; &lt;h4&gt;Assign the optional skit team&lt;/h4&gt;
&lt;p&gt;The optional skit needs the same GUIDE and RANGER RIO (plus
optional COCO and a tech) all four days for continuity. Pull them from
the volunteer roster and confirm at the Monday 8:30 briefing. Actors
rehearse all four short scripts before Day 1 and keep a printed copy at
the sound table.&lt;/p&gt; &lt;/div&gt; &lt;div class="grid two"&gt;
&lt;div class="card" style="margin:0;"&gt;&lt;h3
style="font-size:1.05rem;"&gt;Skit flow each day&lt;/h3&gt; &lt;ol
class="flow"&gt; &lt;li&gt;Tech cue: music sting, Rio enters.&lt;/li&gt;
&lt;li&gt;Set up the problem or question (about 1 min).&lt;/li&gt;
&lt;li&gt;Guide and Rio talk it through (2 to 4 min).&lt;/li&gt;
&lt;li&gt;Land the day's truth in one clear line.&lt;/li&gt;
&lt;li&gt;Hand to the opening leader for the Bible point and "Wow,
God!"&lt;/li&gt; &lt;/ol&gt; &lt;/div&gt; &lt;div class="callout watch"
style="margin:0;"&gt;&lt;h4&gt;Skit guardrails&lt;/h4&gt; &lt;p&gt;Keep
it under 8 minutes. Funny is good; silliness that buries the point is
not. Use gentle language around the cross on Day 2 and no graphic
detail. If a puppet or costume is used, the handler stays with it the
whole scene. If tech fails, the Guide performs it live with no mics -
keep going.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;h3
style="margin-top:8px;"&gt;Props you will need for the optional
skits&lt;/h3&gt; &lt;div class="grid two"&gt; &lt;div class="card"
style="margin:0;"&gt; &lt;h3 style="font-size:1.05rem;"&gt;Recurring
(all week)&lt;/h3&gt; &lt;ul class="clean"&gt; &lt;li&gt;RANGER RIO's
oversized &lt;strong&gt;explorer backpack&lt;/strong&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;COCO the toucan puppet&lt;/strong&gt; (optional
sidekick)&lt;/li&gt; &lt;li&gt;2 wireless
&lt;strong&gt;mics&lt;/strong&gt; (Guide + Rio) and a sound source for
music stings&lt;/li&gt; &lt;li&gt;Rio's &lt;strong&gt;entrance music
sting&lt;/strong&gt; cued the same way every day&lt;/li&gt; &lt;/ul&gt;
&lt;/div&gt; &lt;div class="card" style="margin:0;"&gt; &lt;h3
style="font-size:1.05rem;"&gt;Day by day&lt;/h3&gt; &lt;ul
class="clean"&gt; &lt;li&gt;&lt;strong&gt;Day 1:&lt;/strong&gt; a real
&lt;strong&gt;leaf&lt;/strong&gt; and a &lt;strong&gt;toy
bird&lt;/strong&gt; for the "who made this?" bit&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Day 2:&lt;/strong&gt; a &lt;strong&gt;clipboard
that breaks&lt;/strong&gt; - bring two (one intact, one pre-snapped) or
a safe breakable prop&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Day
3:&lt;/strong&gt; an &lt;strong&gt;empty snack
wrapper&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Day
4:&lt;/strong&gt; a &lt;strong&gt;party streamer or flag&lt;/strong&gt;
for the big send-off&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;/div&gt;
&lt;p class="mini"&gt;Keep the recurring props in a labeled bin at the
sound table so the optional skit team can grab and reset fast between
days.&lt;/p&gt; &lt;/section&gt; &lt;!-- ============ SKIT SCRIPTS
============ --&gt; &lt;section class="pagebreak" id="scripts"&gt;
&lt;div class="section-head"&gt;&lt;span
class="num"&gt;9&lt;/span&gt;&lt;h2 class="title"&gt;Optional daily skit
scripts (Day 1 to 4)&lt;/h2&gt;&lt;/div&gt; &lt;p class="lead"&gt;Full
scripts for the optional skit team. Each runs 5 to 8 minutes on the
Sanctuary stage during opening. Lines are a strong guide, not a cage -
stay in character, keep the energy up, and always land the day's truth
before handing back to the opening leader. Bracketed italics are stage
directions. Cut COCO's lines if you only have two
actors.&lt;/p&gt;&lt;div class="callout info"&gt;&lt;h4&gt;Skit is
optional this year&lt;/h4&gt;&lt;p&gt;Use the skit only if the volunteer
team is staffed and ready. If not, keep opening simple: worship, the
daily Bible point, memory verse, Buddy, God Sightings, and extra songs.
Forest Frank songs or familiar sing-alongs can fill that time without
disrupting the schedule.&lt;/p&gt;&lt;/div&gt; &lt;div class="callout
info"&gt; &lt;h4&gt;Standing setup for all four days&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Cast:&lt;/strong&gt; GUIDE (host), RANGER RIO
(recurring), COCO the toucan puppet (optional), TECH (offstage).
&lt;strong&gt;Set:&lt;/strong&gt; the rainforest stage with the
waterfall backdrop. &lt;strong&gt;Props kept onstage:&lt;/strong&gt;
Rio's oversized explorer backpack and a clipboard.
&lt;strong&gt;Recurring runner:&lt;/strong&gt; Rio always enters from
the same side with the same music sting so kids cheer when they hear it.
End every skit by handing to the opening leader for the Bible point and
the "Wow, God!" response.&lt;/p&gt; &lt;/div&gt; &lt;!-- DAY 1 --&gt;
&lt;div class="script"&gt; &lt;h4&gt;Day 1 - Monday - "Who Made All
This?"&lt;/h4&gt; &lt;div class="meta-row"&gt; &lt;span
class="tagp"&gt;Theme: God is our creator&lt;/span&gt; &lt;span
class="tagp"&gt;Verse: Psalm 103:22&lt;/span&gt; &lt;span
class="tagp"&gt;Runtime: ~6 min&lt;/span&gt; &lt;span
class="tagp"&gt;Props: backpack, leaf, toy bird&lt;/span&gt;
&lt;/div&gt; &lt;div class="dir full"&gt;[Music sting. RANGER RIO bursts
onstage spinning in circles, staring up and around at the rainforest,
mouth wide open. GUIDE walks on calmly.]&lt;/div&gt; &lt;div
class="ln"&gt;&lt;span class="char"&gt;Guide&lt;/span&gt;&lt;span
class="say"&gt;Whoa, whoa - Ranger Rio! You okay, buddy? You are
spinning like a ceiling fan.&lt;/span&gt;&lt;/div&gt; &lt;div
class="ln"&gt;&lt;span class="char"&gt;Rio&lt;/span&gt;&lt;span
class="say"&gt;Guide! Guide! Look at this place! There are green leaves,
and blue water, and a bird that is SO fancy it should pay rent. Where
did all of this even COME from?&lt;/span&gt;&lt;/div&gt; &lt;div
class="ln"&gt;&lt;span class="char"&gt;Guide&lt;/span&gt;&lt;span
class="say"&gt;That is a great question. What do you
think?&lt;/span&gt;&lt;/div&gt; &lt;div class="ln"&gt;&lt;span
class="char"&gt;Rio&lt;/span&gt;&lt;span class="say"&gt;I figure... it
just sort of... happened? Like one day there was nothing, and then - BAM
- rainforest. Maybe a really big sneeze.&lt;/span&gt;&lt;/div&gt;
&lt;div class="dir"&gt;[COCO pops up from the backpack.]&lt;/div&gt;
&lt;div class="ln"&gt;&lt;span class="char"&gt;Coco&lt;/span&gt;&lt;span
class="say"&gt;A sneeze?! Rio, that is the silliest thing I have heard
since you tried to high-five a waterfall.&lt;/span&gt;&lt;/div&gt;
&lt;div class="ln"&gt;&lt;span class="char"&gt;Rio&lt;/span&gt;&lt;span
class="say"&gt;It high-fived me back! It was wet, but it
counted.&lt;/span&gt;&lt;/div&gt; &lt;div class="ln"&gt;&lt;span
class="char"&gt;Guide&lt;/span&gt;&lt;span class="say"&gt;Rio, look
closer. This bird has a pattern. The leaf has tiny veins like little
roads. The water knows exactly where to go. That is not a sneeze - that
is a plan. Somebody designed it.&lt;/span&gt;&lt;/div&gt; &lt;div
class="ln"&gt;&lt;span class="char"&gt;Rio&lt;/span&gt;&lt;span
class="say"&gt;Somebody... made it? On purpose?&lt;/span&gt;&lt;/div&gt;
&lt;div class="ln"&gt;&lt;span
class="char"&gt;Guide&lt;/span&gt;&lt;span class="say"&gt;God did. The
very first page of the Bible says God made the light, the sky, the
water, the plants, the animals - all of it. And he did not stop there.
He made people. He made you.&lt;/span&gt;&lt;/div&gt; &lt;div
class="dir"&gt;[Rio freezes, points slowly at himself.]&lt;/div&gt;
&lt;div class="ln"&gt;&lt;span class="char"&gt;Rio&lt;/span&gt;&lt;span
class="say"&gt;Me? God made... ME? On purpose? Even my weird left
elbow?&lt;/span&gt;&lt;/div&gt; &lt;div class="ln"&gt;&lt;span
class="char"&gt;Guide&lt;/span&gt;&lt;span class="say"&gt;Especially the
elbow. You are not an accident, Rio. You are a creation - made on
purpose, by a God who does not make junk.&lt;/span&gt;&lt;/div&gt;
&lt;div class="ln"&gt;&lt;span class="char"&gt;Coco&lt;/span&gt;&lt;span
class="say"&gt;So the bird, the leaves, the water, AND Rio... same
Maker.&lt;/span&gt;&lt;/div&gt; &lt;div class="ln"&gt;&lt;span
class="char"&gt;Rio&lt;/span&gt;&lt;span class="say"&gt;That makes me
want to say something really loud.&lt;/span&gt;&lt;/div&gt; &lt;div
class="ln"&gt;&lt;span class="char"&gt;Guide&lt;/span&gt;&lt;span
class="say"&gt;Then let's teach everybody. When we remember God made it
all, we throw our hands open like fireworks and say it.
Ready?&lt;/span&gt;&lt;/div&gt; &lt;div class="landing"&gt;GUIDE
&amp;amp; RIO: "God is our creator..." [hands fling open] "WOW,
GOD!"&lt;/div&gt; &lt;div class="dir full"&gt;[Guide hands off to the
opening leader for the Bible point and release to stations.]&lt;/div&gt;
&lt;/div&gt; &lt;!-- DAY 2 --&gt; &lt;div class="script"&gt;
&lt;h4&gt;Day 2 - Tuesday - "I Think I Blew It"&lt;/h4&gt; &lt;div
class="meta-row"&gt; &lt;span class="tagp"&gt;Theme: God is
love&lt;/span&gt; &lt;span class="tagp"&gt;Verse: Psalm
136:1&lt;/span&gt; &lt;span class="tagp"&gt;Runtime: ~6 min&lt;/span&gt;
&lt;span class="tagp"&gt;Props: backpack, a cracked
clipboard&lt;/span&gt; &lt;/div&gt; &lt;div class="dir full"&gt;[Music
sting, but slower. RANGER RIO trudges on, head down, holding a clipboard
that has clearly snapped in half. GUIDE enters.]&lt;/div&gt; &lt;div
class="ln"&gt;&lt;span class="char"&gt;Guide&lt;/span&gt;&lt;span
class="say"&gt;Morning, Rio! Ready for - oh. What happened to the
official ranger clipboard?&lt;/span&gt;&lt;/div&gt; &lt;div
class="ln"&gt;&lt;span class="char"&gt;Rio&lt;/span&gt;&lt;span
class="say"&gt;I broke it. I was supposed to keep it safe, and I tripped

group leaders before food is handed out.&lt;/strong&gt;&lt;/li&gt;
&lt;li&gt;Say the point; connect the snack in a sentence.&lt;/li&gt;
&lt;li&gt;Serve food and water calmly.&lt;/li&gt; &lt;li&gt;Connection
question while kids eat.&lt;/li&gt; &lt;li&gt;Bathroom cue if needed
(group leaders per policy); collect trash, wipe, reset.&lt;/li&gt;
&lt;/ol&gt; &lt;/div&gt; &lt;div class="callout tip"&gt;&lt;h4&gt;Keep
snack warm and upbeat&lt;/h4&gt;&lt;p&gt;Snack is the calmer, settle
station - aim for &lt;strong&gt;warm energy, not wild.&lt;/strong&gt; Do
a fun &lt;strong&gt;snack-name reveal&lt;/strong&gt; ("Today we are
eating... JUNGLE TRAIL MIX!"), a quick table cheer, and friendly leader
conversation. Keep voices up and positive while bodies stay
seated.&lt;/p&gt;&lt;/div&gt; &lt;/section&gt; &lt;!-- ============
BIBLE ============ --&gt; &lt;section class="station" id="bible"&gt;
&lt;div class="station-banner b-bark"&gt; &lt;div
class="ico"&gt;04&lt;/div&gt; &lt;div&gt; &lt;div
class="role"&gt;Rotation Station 4 · Bible Teaching&lt;/div&gt;
&lt;h2&gt;Under the Waterfall&lt;/h2&gt; &lt;div class="tag"&gt;A calm,
captivating room where kids dive into the Bible story and how God's Word
applies to their lives.&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div
class="glance"&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Room&lt;/div&gt;&lt;div class="val"&gt;MPR
Room&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div class="lbl"&gt;Station
leads&lt;/div&gt;&lt;div class="val"&gt;Ray &amp;amp;
Isaias&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Tone&lt;/div&gt;&lt;div class="val"&gt;Reverent,
engaging, gentle&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Win&lt;/div&gt;&lt;div class="val"&gt;Kids notice who God
is&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;p class="lead"&gt;The Bible
teaching station. Kids hear and step into the day's story (creation /
Jesus' death and resurrection / John's vision of heaven) using the Group
content, props, and discussion.&lt;/p&gt; &lt;div class="callout
tip"&gt;&lt;h4&gt;The room&lt;/h4&gt;&lt;p&gt;The hallway entrance feels
like walking beneath a waterfall (hanging tinsel foil curtains). Blue
paper walls, sea animals, coral, rocks, and fishing nets. The goal is
calm and captivating so kids settle and focus.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Who does what here&lt;/h3&gt; &lt;div class="roles"&gt;
&lt;div class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--lagoon)"&gt;&lt;/span&gt;Station leads (Ray
&amp;amp; Isaias)&lt;/div&gt;&lt;p&gt;Know the story cold before kids
arrive, teaches in short scenes, keeps the Bible open and visible, asks
application questions, and manages pacing.&lt;/p&gt;&lt;/div&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--mango)"&gt;&lt;/span&gt;Support
volunteer&lt;/div&gt;&lt;p&gt;Handles props, helps assign acting roles,
manages lights and visuals, and watches the door.&lt;/p&gt;&lt;/div&gt;
&lt;div class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--leaf)"&gt;&lt;/span&gt;Group
leaders&lt;/div&gt;&lt;p&gt;Sit with your group, help kids act safely
and listen, keep it reverent in quiet moments, and draw out
answers.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--canopy)"&gt;&lt;/span&gt;Kids&lt;/div&gt;&lt;p&gt;Listen,
take simple roles, respond to questions, and connect the story to their
own lives.&lt;/p&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class="grid
two"&gt; &lt;div class="card" style="margin:0;"&gt;&lt;h3
style="font-size:1.05rem;"&gt;Rules&lt;/h3&gt; &lt;ul class="clean"&gt;
&lt;li&gt;Know the story in advance; do not read long passages while
kids wait.&lt;/li&gt; &lt;li&gt;Movement and sound, yes; silliness that
buries the truth, no.&lt;/li&gt; &lt;li&gt;Use gentle language for
Jesus' death; no graphic detail.&lt;/li&gt; &lt;li&gt;Faith or salvation
questions: affirm, do not pressure, tell a pastoral leader
after.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div class="card"
style="margin:0;"&gt;&lt;h3 style="font-size:1.05rem;"&gt;Rotation
flow&lt;/h3&gt; &lt;ol class="flow"&gt; &lt;li&gt;Welcome the group into
the story space.&lt;/li&gt; &lt;li&gt;Bible point and
response.&lt;/li&gt; &lt;li&gt;Set the scene in 30 to 60
seconds.&lt;/li&gt; &lt;li&gt;Lead the story in short scenes; pause to
name what to notice about God.&lt;/li&gt; &lt;li&gt;One application
question and prayer.&lt;/li&gt; &lt;li&gt;Send to the next station;
reset props.&lt;/li&gt; &lt;/ol&gt; &lt;/div&gt; &lt;/div&gt; &lt;div
class="callout tip"&gt;&lt;h4&gt;Keep Bible time
captivating&lt;/h4&gt;&lt;p&gt;Reverent does not mean flat. Use a
&lt;strong&gt;storyteller voice&lt;/strong&gt; with suspense and volume
changes, &lt;strong&gt;sound effects&lt;/strong&gt;, and quick
participation ("everybody be the wind... GO!"). Pause on the big
moments. Pull kids in with questions so they lean forward. Captivated
beats calm-and-bored every time.&lt;/p&gt;&lt;/div&gt; &lt;/section&gt;
&lt;!-- ============ SCRIPTURE ============ --&gt; &lt;section
class="station" id="scripture"&gt; &lt;div class="station-banner
b-mango"&gt; &lt;div class="ico"&gt;05&lt;/div&gt; &lt;div&gt; &lt;div
class="role"&gt;Rotation Station 5 · Memory Verse&lt;/div&gt;
&lt;h2&gt;Verse Vines&lt;/h2&gt; &lt;div class="tag"&gt;Kids learn and
lock in the day's memory verse through repetition, movement, and
play.&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="glance"&gt;
&lt;div&gt;&lt;div class="lbl"&gt;Room&lt;/div&gt;&lt;div
class="val"&gt;Tots Room&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Station leads&lt;/div&gt;&lt;div class="val"&gt;Danielle
&amp;amp; Gaby B.&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Method&lt;/div&gt;&lt;div class="val"&gt;Movement-based
verse repetition&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Win&lt;/div&gt;&lt;div class="val"&gt;Kids can say the
verse&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;p class="lead"&gt;A
focused station where kids work the day's memory verse into their heads
with motions, call-and-response, and the Group memory-verse activity.
This is the "Scripture" block on the schedule.&lt;/p&gt; &lt;div
class="callout tip"&gt;&lt;h4&gt;The room&lt;/h4&gt;&lt;p&gt;Existing
animal wall paintings keep decor minimal - hanging vines and greenery
give the Verse Vines feel. Cozy and contained, which is good for
focus.&lt;/p&gt;&lt;/div&gt; &lt;h3&gt;Who does what here&lt;/h3&gt;
&lt;div class="roles"&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--lagoon)"&gt;&lt;/span&gt;Station leads (Danielle
&amp;amp; Gaby B.)&lt;/div&gt;&lt;p&gt;Introduces the verse, leads the
motions, runs the activity, and keeps repetition fun rather than a
drill.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--leaf)"&gt;&lt;/span&gt;Group
leaders&lt;/div&gt;&lt;p&gt;Help non-readers repeat after the leader,
keep turns fair, and prevent the activity from becoming a
competition.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--canopy)"&gt;&lt;/span&gt;Kids&lt;/div&gt;&lt;p&gt;Say
the verse, do the motions, and take turns; non-readers repeat after a
leader.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--mango)"&gt;&lt;/span&gt;Floaters&lt;/div&gt;&lt;p&gt;Step
in when a group needs extra adult support, help with bathroom trips,
transitions, and room flow.&lt;/p&gt;&lt;/div&gt; &lt;/div&gt; &lt;div
class="grid two"&gt; &lt;div class="card" style="margin:0;"&gt;&lt;h3
style="font-size:1.05rem;"&gt;Rules&lt;/h3&gt; &lt;ul class="clean"&gt;
&lt;li&gt;Pair non-readers with a leader or older child; let them repeat
after you.&lt;/li&gt; &lt;li&gt;Keep it active, not a quiz; no one is
put on the spot to "pass."&lt;/li&gt; &lt;li&gt;If a room feels crowded
or a leader needs help, pause the activity and get Jake or
Annie.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;div class="card"
style="margin:0;"&gt;&lt;h3 style="font-size:1.05rem;"&gt;Rotation
flow&lt;/h3&gt; &lt;ol class="flow"&gt; &lt;li&gt;Seat the group; say
the Bible point.&lt;/li&gt; &lt;li&gt;Introduce or review the verse in
kid-friendly words.&lt;/li&gt; &lt;li&gt;Run the verse activity with
motions.&lt;/li&gt; &lt;li&gt;Quick discussion question.&lt;/li&gt;
&lt;li&gt;Close with the point; send on.&lt;/li&gt; &lt;/ol&gt;
&lt;/div&gt; &lt;/div&gt; &lt;div class="callout tip"&gt;&lt;h4&gt;Keep
scripture high energy&lt;/h4&gt;&lt;p&gt;Turn the verse into a
&lt;strong&gt;movement chant&lt;/strong&gt; with a motion for each
phrase. Run &lt;strong&gt;speed rounds&lt;/strong&gt; (say it slow,
medium, super fast), &lt;strong&gt;volume rounds&lt;/strong&gt;
(whisper, then shout), and boy-vs-girl or leader-vs-kids call-backs. Big
celebration when they nail it - make memorizing feel like
winning.&lt;/p&gt;&lt;/div&gt; &lt;/section&gt; &lt;!-- ============
CLOSING / LUNCH ============ --&gt; &lt;section class="station"
id="closing"&gt; &lt;div class="station-banner b-twilight"&gt; &lt;div
class="ico"&gt;PM&lt;/div&gt; &lt;div&gt; &lt;div class="role"&gt;12:05
to 1:00 · Everyone together · Led by Jake &amp;amp; Annie&lt;/div&gt;
&lt;h2&gt;Lunch &amp;amp; Canopy Closing&lt;/h2&gt; &lt;div
class="tag"&gt;After lunch, the whole VBS regathers in the Sanctuary to
celebrate the day, relive it on the Spotlight screen, do the day's big
"wow" experience, lock in the truth about God, and dismiss
safely.&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="glance"&gt;
&lt;div&gt;&lt;div class="lbl"&gt;When&lt;/div&gt;&lt;div
class="val"&gt;12:05 to 1:00, daily&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class="lbl"&gt;Where&lt;/div&gt;&lt;div
class="val"&gt;Sanctuary (+ eating area)&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class="lbl"&gt;Led by&lt;/div&gt;&lt;div
class="val"&gt;Jake &amp;amp; Annie + worship
team&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Critical&lt;/div&gt;&lt;div class="val"&gt;Allergy-safe
lunch, orderly pickup&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;p
class="lead"&gt;The day ends back where it started - in the Sanctuary,
hosted by Jake and Annie. Groups eat lunch together, then gather for
Canopy Closing: a celebration that reviews the day's Bible point, shows
the day's Spotlight photos, runs a hands-on "wow" experience tied to the
theme, shares God Sightings, and sends everyone off on a high before
pickup. Same room as opening, so the worship set, God Sightings
Celebration Spot, and Bible Point Poster are already in place.&lt;/p&gt;
&lt;div class="callout tip"&gt;&lt;h4&gt;The room &amp;amp; where things
happen&lt;/h4&gt; &lt;p&gt;Use the
&lt;strong&gt;Sanctuary&lt;/strong&gt; with chairs still to the back and
groups at their color signs. You will need the
&lt;strong&gt;screen/projector&lt;/strong&gt; for the Spotlight photo
show, the &lt;strong&gt;microphone/sound system&lt;/strong&gt;, the
&lt;strong&gt;God Sightings Celebration Spot&lt;/strong&gt;, and a clear
front-center space (with a tarp) for the daily "wow" experience. Lunch
is served in the &lt;strong&gt;eating area&lt;/strong&gt; just before,
so plan the flow from tables back into the Sanctuary.&lt;/p&gt;
&lt;/div&gt; &lt;div class="grid two"&gt; &lt;div class="card"
style="margin:0;"&gt; &lt;h3&gt;Closing flow (after lunch)&lt;/h3&gt;
&lt;ol class="flow"&gt; &lt;li&gt;Groups finish lunch and gather by
color sign.&lt;/li&gt; &lt;li&gt;Welcome + a worship song (worship
team).&lt;/li&gt; &lt;li&gt;Spotlight show - photos from today on the
screen.&lt;/li&gt; &lt;li&gt;Review the day's Bible point with "Wow,
God!"&lt;/li&gt; &lt;li&gt;The daily "wow" experience (see
below).&lt;/li&gt; &lt;li&gt;God Sightings + (Day 1) hand out Watch for
God wristbands.&lt;/li&gt; &lt;li&gt;Wrap-up: group leaders collect name
badges &amp;amp; Bible Memory Buddies into the group bag.&lt;/li&gt;
&lt;li&gt;Announcements, prayer, dismissal to pickup by
group.&lt;/li&gt; &lt;/ol&gt; &lt;/div&gt; &lt;div class="card"
style="margin:0;"&gt; &lt;h3&gt;Roles at closing&lt;/h3&gt; &lt;div
class="role-card" style="margin-bottom:8px;"&gt;&lt;div
class="who"&gt;&lt;span class="dot"
style="background:var(--canopy)"&gt;&lt;/span&gt;Jake &amp;amp; Annie
(lead)&lt;/div&gt;&lt;p&gt;Host the whole closing: Spotlight, review,
the wow experience, God Sightings, prayer, and the release to
pickup.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"
style="margin-bottom:8px;"&gt;&lt;div class="who"&gt;&lt;span
class="dot" style="background:var(--lagoon)"&gt;&lt;/span&gt;Worship
team&lt;/div&gt;&lt;p&gt;Lead the closing songs and keep energy up
between segments.&lt;/p&gt;&lt;/div&gt; &lt;div class="role-card"
style="margin-bottom:8px;"&gt;&lt;div class="who"&gt;&lt;span
class="dot" style="background:var(--mango)"&gt;&lt;/span&gt;Helpers /
floaters&lt;/div&gt;&lt;p&gt;Run the wow-experience props, manage the
lunch line, and staff the pickup table.&lt;/p&gt;&lt;/div&gt; &lt;div
class="role-card"&gt;&lt;div class="who"&gt;&lt;span class="dot"
style="background:var(--leaf)"&gt;&lt;/span&gt;Group
leaders&lt;/div&gt;&lt;p&gt;Eat with your group, keep them together,
lead God Sightings, collect badges/Buddies into the group bag, and
follow dismissal cues exactly.&lt;/p&gt;&lt;/div&gt; &lt;/div&gt;
&lt;/div&gt; &lt;div class="callout info"&gt;&lt;h4&gt;Lunch transition
&amp;amp; location&lt;/h4&gt; &lt;p&gt;Lunch is served
&lt;strong&gt;downstairs in the elementary area&lt;/strong&gt; (the
Creation Station space flipped for lunch). Jake and Annie lead the
transition &lt;strong&gt;from the Sanctuary&lt;/strong&gt;: groups are
dismissed &lt;strong&gt;by age group&lt;/strong&gt;, and group leaders
line up their kids and walk them downstairs. &lt;strong&gt;Mikai leads
the lunch setup transition&lt;/strong&gt; (Isaac supports), and station
leaders help flip the space. Keep the same allergy rules from snack at
lunch.&lt;/p&gt; &lt;/div&gt; &lt;h3&gt;The daily "wow"
experience&lt;/h3&gt; &lt;p class="mini"&gt;A hands-on object lesson
Jake &amp;amp; Annie run from the front, matched to the day's truth.
Props and full step-by-step are in the Group leader manual; the
summaries below are for planning. Practice each one
beforehand.&lt;/p&gt; &lt;div class="tbl-wrap"&gt; &lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Day &amp;amp;
theme&lt;/th&gt;&lt;th&gt;Experience (in brief)&lt;/th&gt;&lt;th&gt;Main
props&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt; &lt;tbody&gt; &lt;tr&gt;
&lt;td&gt;&lt;span class="k"&gt;Mon - God is our
creator&lt;/span&gt;&lt;/td&gt; &lt;td&gt;A "Creation Catapult" (a leaf
blower fitted with cardboard tubes) launches plush Rainforest Flyers
across the room; with each launch, celebrate a part of God's creation
and shout the point.&lt;/td&gt; &lt;td&gt;Leaf blower, wye joint,
painted mailing tubes, plush flyers, paper plate, duct tape&lt;/td&gt;
&lt;/tr&gt; &lt;tr&gt; &lt;td&gt;&lt;span class="k"&gt;Tue - God is
love&lt;/span&gt;&lt;/td&gt; &lt;td&gt;Groups color a cloth heart and
tell ways they show love, then dip it in water so the marker smudges
(our love is imperfect). The cloths are draped on a cross, and "Jesus"
reveals a clean heart - God's perfect, lasting love.&lt;/td&gt;
&lt;td&gt;Large cross, tarp, bin of water, white sheet cut into hearts,
washable markers, optional Jesus costume&lt;/td&gt; &lt;/tr&gt;
&lt;tr&gt; &lt;td&gt;&lt;span class="k"&gt;Wed - God is
forever&lt;/span&gt;&lt;/td&gt; &lt;td&gt;Rocket Balloons zip along a
fishing-line zip line, going farther each time but always running out of
air - a vivid picture that everything here ends, but only God is
forever.&lt;/td&gt; &lt;td&gt;Rocket Balloons, balloon pumps, fishing
line, drinking straws, tape, clothespins&lt;/td&gt; &lt;/tr&gt;
&lt;tr&gt; &lt;td&gt;&lt;span class="k"&gt;Thu - Fun
Day&lt;/span&gt;&lt;/td&gt; &lt;td&gt;Celebration recap of all three
truths leading into the family BBQ (see the Thursday
section).&lt;/td&gt; &lt;td&gt;See Thursday section&lt;/td&gt;
&lt;/tr&gt; &lt;/tbody&gt; &lt;/table&gt; &lt;/div&gt; &lt;div
class="callout info"&gt;&lt;h4&gt;God Sightings &amp;amp; Watch for God
wristbands&lt;/h4&gt; &lt;p&gt;Kids learn about &lt;strong&gt;God
Sightings&lt;/strong&gt; (everyday evidence of God at work) at Day 1
closing and receive a &lt;strong&gt;Watch for God
wristband&lt;/strong&gt; to wear all week. From Tuesday on, groups share
God Sightings at opening and add cutouts to the Celebration Spot. Group
leaders keep the sharing warm and quick.&lt;/p&gt; &lt;/div&gt; &lt;h3
style="margin-top:24px;"&gt;High-energy closing ideas (pick a few, keep
them thematic)&lt;/h3&gt; &lt;div class="grid two"&gt; &lt;div
class="card" style="margin:0;"&gt; &lt;h3
style="font-size:1.05rem;"&gt;Sound &amp;amp; music&lt;/h3&gt; &lt;ul
class="clean"&gt; &lt;li&gt;Open closing with a &lt;strong&gt;jungle
soundscape&lt;/strong&gt; (birds, rain, drums) fading into an upbeat
worship track.&lt;/li&gt; &lt;li&gt;Use a
&lt;strong&gt;drumroll&lt;/strong&gt; before the Bible point and a
&lt;strong&gt;cheer/air-horn sound&lt;/strong&gt; on "Wow,
God!"&lt;/li&gt; &lt;li&gt;Run a
"&lt;strong&gt;rainstorm&lt;/strong&gt;" body-percussion moment - rub
palms, snap, then stomp to build a storm, tying into "Rainforest
Falls."&lt;/li&gt; &lt;li&gt;End on the day's &lt;strong&gt;theme
song&lt;/strong&gt; at full volume so kids leave singing.&lt;/li&gt;
&lt;/ul&gt; &lt;/div&gt; &lt;div class="card" style="margin:0;"&gt;
&lt;h3 style="font-size:1.05rem;"&gt;Movement &amp;amp; props&lt;/h3&gt;
&lt;ul class="clean"&gt; &lt;li&gt;&lt;strong&gt;Beach balls or
balloons&lt;/strong&gt; batted overhead during the final song (collect
before dismissal).&lt;/li&gt; &lt;li&gt;A "&lt;strong&gt;loudest Wow,
God!&lt;/strong&gt;" contest by group color - Red vs Orange vs Yellow vs
Green vs Blue.&lt;/li&gt; &lt;li&gt;A quick &lt;strong&gt;recap
call-and-response&lt;/strong&gt;: "God is..." and kids fire back creator
/ love / forever.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Streamers,
pom-poms, or color flags&lt;/strong&gt; on the big moments;
&lt;strong&gt;colored stage lights&lt;/strong&gt; if
available.&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;/div&gt; &lt;div
class="callout tip"&gt;&lt;h4&gt;Land it, then bring it
down&lt;/h4&gt;&lt;p&gt;Spike the energy for the celebration, then
deliberately &lt;strong&gt;bring the room down&lt;/strong&gt; for the
Bible-point recap and prayer so the truth lands quietly before the loud
send-off. High, then low, then one last cheer into
dismissal.&lt;/p&gt;&lt;/div&gt; &lt;div class="callout
safety"&gt;&lt;h4&gt;Dismissal &amp;amp; pickup&lt;/h4&gt;
&lt;p&gt;Pickup follows the Sunday-style flow: release each child
&lt;strong&gt;only&lt;/strong&gt; to an adult who gives the family’s
&lt;strong&gt;custom pickup code&lt;/strong&gt;. Give one direction at a
time: "Group leaders stand," then "Groups line up," then "Walk to
pickup." Keep kids with their group leader until the code is verified.
The last five minutes shape parent confidence - end with calm
authority.&lt;/p&gt; &lt;/div&gt; &lt;/section&gt; &lt;!-- ============
THURSDAY ============ --&gt; &lt;section class="station"
id="thursday"&gt; &lt;div class="station-banner b-mango"&gt; &lt;div
class="ico"&gt;D4&lt;/div&gt; &lt;div&gt; &lt;div class="role"&gt;Day 4
· Thursday&lt;/div&gt; &lt;h2&gt;Fun Day + Family BBQ&lt;/h2&gt; &lt;div
class="tag"&gt;A freestyle celebration day: worship, big-group games,
face paint, worship recap, games, and a family-style BBQ. No station
rotation.&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div
class="glance"&gt; &lt;div&gt;&lt;div
class="lbl"&gt;When&lt;/div&gt;&lt;div class="val"&gt;8:30a to
1:00p&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Feel&lt;/div&gt;&lt;div class="val"&gt;Relaxed,
celebratory&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;Big add&lt;/div&gt;&lt;div class="val"&gt;Family BBQ +
parent connection&lt;/div&gt;&lt;/div&gt; &lt;div&gt;&lt;div
class="lbl"&gt;BBQ hosts&lt;/div&gt;&lt;div class="val"&gt;Jake
&amp;amp; Annie&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;p
class="lead"&gt;Thursday breaks the pattern. Instead of timed station
rotations, stations run loose and kids flow between big-group games,
face paint, and building to a closing celebration and a family BBQ
hosted by Jake and Annie. Floaters carry the day - bathroom trips, line
