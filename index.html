  .callout.safety{background:#fbe9e7;border-color:var(--hibiscus);} .callout.safety h4{color:#a8362f;}
  .callout.watch{background:#e6f1f4;border-color:var(--lagoon);} .callout.watch h4{color:var(--lagoon-deep);}
  .callout.info{background:#fdf3df;border-color:var(--toucan);} .callout.info h4{color:#9a6a13;}

  ul.clean{list-style:none;padding:0;margin:10px 0;}
  ul.clean li{position:relative;padding:6px 0 6px 26px;font-size:.96rem;border-bottom:1px solid var(--line);}
  ul.clean li:last-child{border-bottom:none;}
  ul.clean li::before{content:&quot;&quot;;position:absolute;left:4px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--leaf);}
  ul.check{list-style:none;padding:0;margin:10px 0;}
  ul.check li{position:relative;padding:7px 0 7px 34px;border-bottom:1px dashed var(--line);font-size:.95rem;}
  ul.check li:last-child{border-bottom:none;}
  ul.check li::before{content:&quot;&quot;;position:absolute;left:2px;top:9px;width:18px;height:18px;border:2px solid var(--moss);border-radius:5px;background:#fff;}
  ol.flow{list-style:none;counter-reset:f;padding:0;margin:12px 0;}
  ol.flow li{counter-increment:f;position:relative;padding:8px 0 8px 44px;font-size:.95rem;border-bottom:1px solid var(--line);}
  ol.flow li:last-child{border-bottom:none;}
  ol.flow li::before{content:counter(f);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;
    background:var(--paper-2);border:1.5px solid var(--line-strong);color:var(--forest);font-weight:800;font-size:.85rem;
    display:grid;place-items:center;font-family:var(--display);}

  /* station */
  .station{margin-top:54px;}
  .station-banner{border-radius:20px;color:#fff;padding:28px 30px;position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;}
  .station-banner .ico{width:60px;height:60px;flex:none;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem;letter-spacing:.01em;border:1.5px solid rgba(255,255,255,.28);}
  .station-banner .role{font-size:.76rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.85;}
  .station-banner h2{color:#fff;margin:4px 0 0;font-size:clamp(1.5rem,4vw,2.2rem);}
  .station-banner .tag{margin-top:6px;font-size:.95rem;opacity:.95;max-width:56ch;}
  .b-lagoon{background:linear-gradient(135deg,#1d8a9c,#14606e);}
  .b-bark{background:linear-gradient(135deg,#3f8f5e,#5d4326);}
  .b-mango{background:linear-gradient(135deg,#e6862e,#c25a1b);}
  .b-leaf{background:linear-gradient(135deg,#4ca36a,#1f5138);}
  .b-berry{background:linear-gradient(135deg,#d9514a,#9d3a5c);}
  .b-toucan{background:linear-gradient(135deg,#f2b134,#d9821f);}
  .b-twilight{background:linear-gradient(135deg,#2a5d6a,#1b3f3a);}
  .b-stone{background:linear-gradient(135deg,#6c7780,#3f4a52);}
  .b-crew{background:linear-gradient(135deg,#1f5138,#14606e 60%,#e6862e);}

  .glance{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .glance div{padding:13px 15px;border-right:1px solid var(--line);}
  .glance div:last-child{border-right:none;}
  .glance .lbl{font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);}
  .glance .val{font-size:.9rem;font-weight:600;margin-top:3px;color:var(--ink);}

  /* who-does-what */
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
  .role-card{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:#fff;}
  .role-card .who{font-family:var(--display);font-weight:900;font-size:.95rem;color:var(--canopy);display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .role-card .who .dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .role-card p{margin:0;font-size:.89rem;color:var(--ink-soft);}

  .subhd{font-family:var(--display);font-weight:600;font-style:italic;color:var(--lagoon-deep);font-size:1.05rem;margin:18px 0 4px;}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);margin:26px 0;}
  .mini{font-size:.82rem;color:var(--ink-soft);}

  .grouprow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .gchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 13px 6px 8px;font-size:.84rem;font-weight:600;background:#fff;}
  .gchip .sw{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.1);}

  .tocgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;margin-top:14px;}
  .tocgrid a{display:flex;justify-content:space-between;text-decoration:none;color:var(--ink);
    border-bottom:1px dotted var(--line-strong);padding:7px 0;font-weight:600;}
  .tocgrid a:hover{color:var(--lagoon-deep);}
  .tocgrid a .n{color:var(--moss);font-family:var(--display);font-weight:900;}


  .status-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin:18px 0;}
  .status-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px;}
  .status-card.good{border-left:6px solid var(--leaf);}
  .status-card.warn{border-left:6px solid var(--toucan);}
  .traffic{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .traffic .tile{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;text-align:center;}
  .traffic .big{font-family:var(--display);font-weight:900;font-size:2rem;color:var(--canopy);line-height:1;}
  .traffic .lbl{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--leaf);margin-top:4px;}
  .flowchart{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0;}
  .flowchart .stepbox{position:relative;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;min-height:120px;}
  .flowchart .stepbox:after{content:&quot;→&quot;;position:absolute;right:-10px;top:42%;font-weight:900;color:var(--moss);}
  .flowchart .stepbox:last-child:after{content:&quot;&quot;;}
  .flowchart .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;font-weight:900;margin-bottom:8px;}
  .flowchart h4{font-family:var(--body);font-size:.88rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px;color:var(--canopy);}
  .decision{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
  .decision .yes,.decision .no{border-radius:14px;padding:16px;border:1px solid var(--line);background:#fff;}
  .decision .yes{border-left:6px solid var(--leaf);} .decision .no{border-left:6px solid var(--hibiscus);}
  .matrix td:first-child{font-weight:800;color:var(--canopy);}
  @media(max-width:760px){.status-grid,.traffic,.flowchart,.decision{grid-template-columns:1fr}.flowchart .stepbox:after{display:none}}

  @media(max-width:680px){
    .grid.two,.grid.three,.daymap,.glance,.roles{grid-template-columns:1fr;}
    .cover{padding:50px 28px;} .cover .footline{left:28px;right:28px;}
  }
  @media print{
    @page{margin:13mm;}
    body{background:#fff;font-size:12.5pt;}
    .toolbar{display:none !important;}
    .sheet{max-width:none;padding:0;}
    .cover{margin:0;min-height:auto;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .station,.pagebreak{page-break-before:always;}
    .card,.callout,.day,.station-banner,table,.glance,.role-card{break-inside:avoid;}
    thead th,.station-banner,.day,.cover,.sched td,.gchip .sw,.role-card .dot,.cohort{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    section{margin-top:22px;} a{color:var(--ink);}
  }

  /* script formatting */
  .script{background:#fffdf6;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:16px 0;}
  .script .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .script .tagp{font-size:.76rem;font-weight:700;letter-spacing:.04em;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink-soft);}
  .script .ln{margin:9px 0;font-size:.96rem;line-height:1.5;}
  .script .ln .char{font-family:var(--body);font-weight:800;color:var(--canopy);text-transform:uppercase;font-size:.78rem;letter-spacing:.05em;display:inline-block;min-width:96px;vertical-align:top;}
  .script .ln .say{display:inline;}
  .script .dir{font-style:italic;color:var(--lagoon-deep);font-size:.9rem;margin:9px 0;padding-left:96px;}
  .script .dir.full{padding-left:0;}
  .script .beat{border-top:1px dashed var(--line);margin:14px 0;}
  .script h4{font-family:var(--display);font-weight:900;color:var(--canopy);margin:0 0 4px;font-size:1.15rem;}
  .landing{background:#e7f3ec;border-left:5px solid var(--leaf);border-radius:10px;padding:12px 16px;margin:14px 0 2px;font-weight:600;}

  /* Final print controls: every major section starts on its own page, and no text is below 12px. */
  .mini,.sched,.sched .grp,.sched .cohort,.sched .gtag,.script .tagp,.script .ln .char,.traffic .lbl,
  .eyebrow,.cover .kicker,.cover .pill,.cover .footline,thead th,.callout h4,.glance .lbl,
  .day .d,.role-card p,.gchip,.station-banner .role,.flowchart h4{font-size:12px !important;}
  @media print{
    section{break-before:page;page-break-before:always;margin-top:0;}
    .cover{break-after:page;page-break-after:always;}
    .cover + section{break-before:auto;page-break-before:auto;}
    h1,h2,h3,h4,p,li,td,th,span,div{font-size-adjust:none;}
  }

  /* Streamlined final print controls */
  html{font-size:17px;}
  body, p, li, td, th, div, span{font-size:1rem;}
  .mini,.sched,.sched .grp,.sched .cohort,.sched .gtag,.script .tagp,.script .ln .char,.traffic .lbl,
  .eyebrow,.cover .kicker,.cover .pill,.cover .footline,thead th,.callout h4,.glance .lbl,
  .day .d,.role-card p,.gchip,.station-banner .role,.flowchart h4{font-size:12px !important;}
  @media print{
    section{break-before:page;page-break-before:always;margin-top:0;}
    .cover{break-after:page;page-break-after:always;}
    .cover + section{break-before:auto;page-break-before:auto;}
    .card,.callout,.day,.station-banner,table,.glance,.role-card{break-inside:avoid;}
  }

&lt;/style&gt;

&lt;body&gt;
&lt;div class=&quot;toolbar&quot;&gt;&lt;button onclick=&quot;window.print()&quot;&gt; Print / Save as PDF&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;sheet&quot;&gt;
&lt;!-- ============ COVER ============ --&gt;
&lt;div class=&quot;cover&quot;&gt;
&lt;svg class=&quot;cover-foliage&quot; preserveaspectratio=&quot;xMidYMax slice&quot; viewbox=&quot;0 0 920 1000&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;

&lt;div class=&quot;cover-inner&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;HOUSE Kids · Denver · Summer 2026&lt;/div&gt;
&lt;h1&gt;Rainforest&lt;br/&gt;Falls &lt;em&gt;VBS&lt;/em&gt;&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Volunteer Manual&lt;/div&gt;
&lt;div class=&quot;meta&quot;&gt;
&lt;span class=&quot;pill&quot;&gt;Kids 9:00a to 1:00p · Mon to Thu&lt;/span&gt;
&lt;span class=&quot;pill&quot;&gt;Worship + 5-station rotation · 5 groups&lt;/span&gt;
&lt;span class=&quot;pill&quot;&gt;~60 kids · 20-min rotations&lt;/span&gt;
&lt;span class=&quot;pill&quot;&gt;Theme: &lt;strong style=&quot;color:#f2b134&quot;&gt;The nature of God&lt;/strong&gt;&lt;/span&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;footline&quot;&gt;
&lt;span&gt;Find your station, find your time slot, know your kids.&lt;/span&gt;
&lt;span&gt;God is creator · God is love · God is forever&lt;/span&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;!-- ============ AT A GLANCE ============ --&gt;
&lt;section id=&quot;overview&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;The week at a glance&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;This manual is your logistics map and your skit book. The Group handouts cover &lt;em&gt;what&lt;/em&gt; you teach; this covers &lt;em&gt;how the day runs&lt;/em&gt; - where to be, who you are with, and what each role does - plus the full optional daily skit scripts. Read Section 4 (everyone) plus your own station section, and keep this at your post.&lt;/p&gt;
&lt;div class=&quot;callout info&quot;&gt;
&lt;h4&gt;About the theme&lt;/h4&gt;
&lt;p&gt;Our theme this week is &lt;strong&gt;the nature of God&lt;/strong&gt; - who he is. Each day reveals one part of his character: he is our creator, he is love, he is forever. &lt;strong&gt;&quot;Wow, God!&quot;&lt;/strong&gt; is not the theme; it is our shared daily response. Whenever a leader says the day&#x27;s Bible point, the kids fling both hands open like fireworks and shout it back.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;daymap&quot;&gt;
&lt;div class=&quot;day creator&quot;&gt;&lt;div class=&quot;d&quot;&gt;Mon · Day 1&lt;/div&gt;&lt;div class=&quot;pt&quot;&gt;God is our creator&lt;/div&gt;&lt;div class=&quot;vs&quot;&gt;&quot;Praise the Lord, everything he has created...&quot; Ps 103:22&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;day love&quot;&gt;&lt;div class=&quot;d&quot;&gt;Tue · Day 2&lt;/div&gt;&lt;div class=&quot;pt&quot;&gt;God is love&lt;/div&gt;&lt;div class=&quot;vs&quot;&gt;&quot;...his faithful love endures forever.&quot; Ps 136:1&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;day forever&quot;&gt;&lt;div class=&quot;d&quot;&gt;Wed · Day 3&lt;/div&gt;&lt;div class=&quot;pt&quot;&gt;God is forever&lt;/div&gt;&lt;div class=&quot;vs&quot;&gt;&quot;...praise the Lord both now and forever!&quot; Ps 115:18&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;
&lt;h4&gt;Thursday is Fun Day plus Family BBQ&lt;/h4&gt;
&lt;p&gt;Day 4 breaks the rotation: worship, big-group games, face paint, a closing celebration, and a family-style BBQ hosted by Jake and Annie. Full breakdown in the &lt;a href=&quot;#thursday&quot;&gt;Thursday section&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;h3 style=&quot;margin-top:30px;&quot;&gt;The daily shape (Mon to Wed)&lt;/h3&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;What is happening&lt;/th&gt;&lt;th&gt;Where / who&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;8:30-9:00&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Volunteer arrival &amp;amp; briefing&lt;/span&gt; (adults); &lt;strong&gt;Monday:&lt;/strong&gt; family check-in runs outdoors 8:30-9:00&lt;/td&gt;&lt;td&gt;Briefing Room / entrance&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;8:30-9:00&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Monday only: family check-in&lt;/span&gt; - outdoors at the entrance; kit handout&lt;/td&gt;&lt;td&gt;Building entrance turf&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;9:00-9:50&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Opening worship &amp;amp; optional skit&lt;/span&gt; - song (Sing &amp;amp; Play Tune Lagoon), group game, and the optional daily skit&lt;/td&gt;&lt;td&gt;Sanctuary · worship + optional skit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;9:55-12:00&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Station rotations&lt;/span&gt; - 5 blocks; each group rotates through all 5 stations&lt;/td&gt;&lt;td&gt;Station leads + group leaders&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;12:05-1:00&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Lunch &amp;amp; Canopy Closing&lt;/span&gt; - eat, then celebrate, review, daily wow experience, pray, dismiss; led by Jake &amp;amp; Annie&lt;/td&gt;&lt;td&gt;Sanctuary&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;h3 style=&quot;margin-top:26px;&quot;&gt;Worship, the 5 rotation stations, plus support&lt;/h3&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Block&lt;/th&gt;&lt;th&gt;Station&lt;/th&gt;&lt;th&gt;Room&lt;/th&gt;&lt;th&gt;What it is&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;Opening&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Worship&lt;/span&gt; &lt;span class=&quot;mini&quot;&gt;(Sing &amp;amp; Play Tune Lagoon)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Sanctuary&lt;/td&gt;&lt;td&gt;All-group worship, song &amp;amp; motions that open and close every day&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;1&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Games&lt;/span&gt; &lt;span class=&quot;mini&quot;&gt;(Wild About God)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Outside Area&lt;/td&gt;&lt;td&gt;Active, cooperative outdoor games tied to the day&#x27;s point&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;2&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Crafts&lt;/span&gt; &lt;span class=&quot;mini&quot;&gt;(Creation Station)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Elementary Area&lt;/td&gt;&lt;td&gt;Theme craft / take-home project at structured tables&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;3&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Snack&lt;/span&gt; &lt;span class=&quot;mini&quot;&gt;(Snack Shack)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Kitchen + outside&lt;/td&gt;&lt;td&gt;Snack, water, allergy checks, calm reset&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;4&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Bible&lt;/span&gt; &lt;span class=&quot;mini&quot;&gt;(Under the Waterfall)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;MPR Room&lt;/td&gt;&lt;td&gt;Bible teaching - the day&#x27;s story and who God is&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;5&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Scripture&lt;/span&gt; &lt;span class=&quot;mini&quot;&gt;(Verse Vines)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Tots Room&lt;/td&gt;&lt;td&gt;Learn and lock in the day&#x27;s memory verse&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;section class=&quot;pagebreak&quot; id=&quot;operational-notes&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;ON&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;Operational Notes&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;&lt;strong&gt;Used for:&lt;/strong&gt; final director review before Day One.&lt;/p&gt;
&lt;div class=&quot;grid three&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;4&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;VBS days&lt;/strong&gt;&lt;br/&gt;Monday to Thursday, 9:00 AM to 1:00 PM.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;5&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Kid groups&lt;/strong&gt;&lt;br/&gt;Tree Frogs, Toucans, Monkeys, Parrots, Tigers.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;5&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Rotation stations&lt;/strong&gt;&lt;br/&gt;Monday to Wednesday only.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Set for the week&lt;/h3&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Monday to Wednesday structure: volunteer arrival and briefing, opening worship, five rotations, lunch, closing, verified pickup.&lt;/li&gt;&lt;li&gt;Monday to Wednesday rotation grid: every group visits games, crafts, snack, Bible, and Scripture each day.&lt;/li&gt;&lt;li&gt;Daily Bible content: Day One, God is our creator; Day Two, God is love; Day Three, God is forever.&lt;/li&gt;&lt;li&gt;Thursday format: no normal station rotation, Fun Day plus Family Day BBQ, with worship recap, games, face paint, final celebration, and BBQ.&lt;/li&gt;&lt;li&gt;Group structure and lanyard colors: Tree Frogs red, Toucans orange, Monkeys yellow, Parrots green, Tigers blue.&lt;/li&gt;&lt;li&gt;Pickup rule: no child is released without the matching pickup code or Jake/Annie approval.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Confirm before Day One&lt;/h3&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Exact Sanctuary group areas and lunch table/section labels for all five groups.&lt;/li&gt;&lt;li&gt;Walkie count, assigned channel, charging station, and who receives each walkie.&lt;/li&gt;&lt;li&gt;Final check-in volunteer assignments and Monday table roles.&lt;/li&gt;&lt;li&gt;Thursday BBQ food prep zone, allergy label process, cleanup team, and game boundaries.&lt;/li&gt;&lt;li&gt;Production cues with Ian: worship songs, videos, screens, sound, microphones, and daily opening/closing transitions.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/section&gt;&lt;p class=&quot;mini&quot;&gt;&lt;strong&gt;Worship&lt;/strong&gt; (Sing &amp;amp; Play Tune Lagoon) gathers everyone in the Sanctuary at opening and again at closing, led by the worship team. &lt;strong&gt;Support spaces:&lt;/strong&gt; the Nursery for the youngest and for quiet resets, and the Briefing Room for check-in, supplies, and floaters, plus the Face Paint Room and BBQ area on Thursday.&lt;/p&gt;
&lt;/section&gt;
&lt;!-- ============ GROUPS ============ --&gt;
&lt;!-- ============ FINALIZATION STATUS ============ --&gt;

&lt;!-- ============ VOLUNTEER TRAINING: WEEKLY SCHEDULE AND CONTENT ============ --&gt;
&lt;section id=&quot;weekly-schedule&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;Weekly Schedule and Daily Content&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;&lt;strong&gt;Used for:&lt;/strong&gt; Sunday volunteer walk-through and the 8:40 AM daily pre-brief.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;The week in one table&lt;/h3&gt;&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Day&lt;/th&gt;&lt;th&gt;Theme / Bible point&lt;/th&gt;&lt;th&gt;Bible story&lt;/th&gt;&lt;th&gt;Verse&lt;/th&gt;&lt;th&gt;Daily emphasis&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Monday, Day One&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;God is our creator&lt;/td&gt;&lt;td&gt;God creates the world, Genesis 1&lt;/td&gt;&lt;td&gt;Psalm 103:22&lt;/td&gt;&lt;td&gt;Wonder, purpose, value, and the shared response: &lt;strong&gt;Wow, God!&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tuesday, Day Two&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;God is love&lt;/td&gt;&lt;td&gt;Jesus dies and comes back to life, Luke 22:39 to 24:12&lt;/td&gt;&lt;td&gt;Psalm 136:1&lt;/td&gt;&lt;td&gt;Speak with warmth. Keep the cross and resurrection clear, simple, and not graphic.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Wednesday, Day Three&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;God is forever&lt;/td&gt;&lt;td&gt;John sees God’s forever home, Revelation 7:17 and 21 to 22&lt;/td&gt;&lt;td&gt;Psalm 115:18&lt;/td&gt;&lt;td&gt;Teach hope with care. Be sensitive to grief, heaven, death, and sadness questions.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Thursday, Fun Day + Family BBQ&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Week recap&lt;/td&gt;&lt;td&gt;God made us, loves us, and is with us forever&lt;/td&gt;&lt;td&gt;Week recap&lt;/td&gt;&lt;td&gt;Welcome parents, keep kids grouped, maintain pickup verification, and finish with joy.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Daily schedule volunteers should know&lt;/h3&gt;&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;&lt;strong&gt;8:30 to 9:00&lt;/strong&gt; - Volunteer arrival, 8:40 pre-brief, setup. Monday check-in also runs outside.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;9:00 to 9:50&lt;/strong&gt; - Opening worship, Bible point, memory verse, Buddy, God Sightings, optional skit or extra songs, and group release.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;9:55 to 12:00&lt;/strong&gt; - Five station blocks. Station leaders stay put. Group leaders move with kids.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;12:05 to 1:00&lt;/strong&gt; - Lunch, Canopy Closing, recap, prayer, and verified pickup.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;After pickup&lt;/strong&gt; - Reset rooms, return walkies, stage supplies, and report issues to Jake or Annie.&lt;/li&gt;
&lt;/ol&gt;&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;Thursday format&lt;/h4&gt;&lt;p&gt;Thursday keeps the same safety and pickup rules, but replaces normal rotations with worship recap, outside games, face paint, final celebration, and Family BBQ.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Station leads&lt;/h3&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Know the day’s Bible point and connect it naturally to your activity.&lt;/li&gt;&lt;li&gt;Start and end on time, even if the activity is not perfect.&lt;/li&gt;&lt;li&gt;Give one clear direction at a time.&lt;/li&gt;&lt;li&gt;Reset your station as soon as each group leaves.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Group leaders&lt;/h3&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Know your group color, names, allergies, and next location.&lt;/li&gt;&lt;li&gt;Stay with your kids from drop-off through pickup.&lt;/li&gt;&lt;li&gt;Head count before and after every transition.&lt;/li&gt;&lt;li&gt;Participate at every station so kids follow your lead.&lt;/li&gt;&lt;li&gt;Never release a child without pickup verification.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ VOLUNTEER TRAINING: CHECK-IN PICKUP SAFETY ============ --&gt;
&lt;section id=&quot;checkin-pickup-safety&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;Check-in, Pickup, and Safety Procedures&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;&lt;strong&gt;Used for:&lt;/strong&gt; Sunday volunteer walk-through, Monday morning check-in setup, daily pre-brief reminders, and pickup teams.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Monday check-in flow&lt;/h3&gt;&lt;div class=&quot;flowchart&quot;&gt;
&lt;div class=&quot;flowstep&quot;&gt;&lt;div class=&quot;n&quot;&gt;1&lt;/div&gt;&lt;h4&gt;Welcome&lt;/h4&gt;&lt;p&gt;Greet family outside at the entrance turf. Confirm child name and registration.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;flowstep&quot;&gt;&lt;div class=&quot;n&quot;&gt;2&lt;/div&gt;&lt;h4&gt;Verify&lt;/h4&gt;&lt;p&gt;Confirm allergies, emergency notes, family contact, and pickup code.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;flowstep&quot;&gt;&lt;div class=&quot;n&quot;&gt;3&lt;/div&gt;&lt;h4&gt;Hand out kit&lt;/h4&gt;&lt;p&gt;Give shirt, lanyard/name tag, wristband, drawstring bag, and group color.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;flowstep&quot;&gt;&lt;div class=&quot;n&quot;&gt;4&lt;/div&gt;&lt;h4&gt;Send to group&lt;/h4&gt;&lt;p&gt;Walk or direct the child to the Sanctuary group area by color.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;flowstep&quot;&gt;&lt;div class=&quot;n&quot;&gt;5&lt;/div&gt;&lt;h4&gt;Group leader receives&lt;/h4&gt;&lt;p&gt;Leader greets child, checks them onto the group list, and keeps them with the group.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Days Two to Four drop-off&lt;/h3&gt;&lt;ol class=&quot;flow&quot;&gt;&lt;li&gt;Family arrives at the door.&lt;/li&gt;&lt;li&gt;Greeter welcomes them and points child to the Sanctuary.&lt;/li&gt;&lt;li&gt;Child joins assigned group color area.&lt;/li&gt;&lt;li&gt;Group leader confirms child is present.&lt;/li&gt;&lt;li&gt;Any parent question goes to Jake or Annie.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Pickup decision rule&lt;/h3&gt;&lt;div class=&quot;traffic&quot;&gt;&lt;div class=&quot;go&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Code matches&lt;/div&gt;&lt;p&gt;Release the child to the adult, mark pickup complete, and keep the line moving.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;stop&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Code missing or unclear&lt;/div&gt;&lt;p&gt;Do not release the child. Keep the child with the group and call Jake or Annie.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;stop&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Do not guess&lt;/div&gt;&lt;p&gt;No exceptions because someone is in a hurry, knows the child, or is present at BBQ.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Safety procedures every volunteer follows&lt;/h3&gt;&lt;div class=&quot;tbl-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Required procedure&lt;/th&gt;&lt;th&gt;Escalate to&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Head counts&lt;/td&gt;&lt;td&gt;Count before leaving a room, after arriving, before lunch, before closing, and before pickup.&lt;/td&gt;&lt;td&gt;Group leader, then Jake or Annie if a child is missing.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Allergies&lt;/td&gt;&lt;td&gt;Check allergy notes before snack, lunch, face paint, and BBQ. Do not guess on ingredients.&lt;/td&gt;&lt;td&gt;Snack lead, Jake, or Annie.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Bathroom trips&lt;/td&gt;&lt;td&gt;Use the buddy/leader system. A group should never be left without adult coverage.&lt;/td&gt;&lt;td&gt;Group leader or floater.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Injury or illness&lt;/td&gt;&lt;td&gt;Bring child to first aid or call for help. Keep calm and document what happened.&lt;/td&gt;&lt;td&gt;Jake or Annie.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Behavior concerns&lt;/td&gt;&lt;td&gt;Use calm, clear language. Keep the child and group safe. Do not shame or argue.&lt;/td&gt;&lt;td&gt;Jake or Annie if behavior continues or safety is affected.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Parent access&lt;/td&gt;&lt;td&gt;Parents stay outside child areas unless directed by Jake or Annie. Thursday parent presence does not change pickup rules.&lt;/td&gt;&lt;td&gt;Jake or Annie.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Walkies&lt;/td&gt;&lt;td&gt;Keep messages short: who, where, what is needed. Return and charge at end of day.&lt;/td&gt;&lt;td&gt;Jake or Annie.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;groups&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;Kids, groups, leaders &amp;amp; colors&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Kids are divided into &lt;strong&gt;five groups&lt;/strong&gt; by age band, each with a name, a &lt;strong&gt;lanyard color&lt;/strong&gt;, and assigned &lt;strong&gt;group leaders&lt;/strong&gt;. Groups stay together (aim for about 8 to 12 kids each) and travel through every station as a unit, so all five stations run full every block.&lt;/p&gt;
&lt;h3 style=&quot;margin-top:24px;&quot;&gt;The 5 groups, colors &amp;amp; leaders&lt;/h3&gt;
&lt;div class=&quot;grouprow&quot;&gt;
&lt;span class=&quot;gchip&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:var(--g-treefrog)&quot;&gt;&lt;/span&gt;Tree Frogs · 3-4 · Red&lt;/span&gt;
&lt;span class=&quot;gchip&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:var(--g-toucan)&quot;&gt;&lt;/span&gt;Toucans · 5 · Orange&lt;/span&gt;
&lt;span class=&quot;gchip&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:var(--g-monkey)&quot;&gt;&lt;/span&gt;Monkeys · 6-7 · Yellow&lt;/span&gt;
&lt;span class=&quot;gchip&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:var(--g-parrot)&quot;&gt;&lt;/span&gt;Parrots · 8-9 · Green&lt;/span&gt;
&lt;span class=&quot;gchip&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:var(--g-tiger)&quot;&gt;&lt;/span&gt;Tigers · 10-12 · Blue&lt;/span&gt;
&lt;span class=&quot;gchip&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:var(--g-leader)&quot;&gt;&lt;/span&gt;Station Leaders · Purple&lt;/span&gt;
&lt;/div&gt;
&lt;h3 style=&quot;margin-top:22px;&quot;&gt;Group detail&lt;/h3&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Group&lt;/th&gt;&lt;th&gt;Color&lt;/th&gt;&lt;th&gt;Ages&lt;/th&gt;&lt;th&gt;Group leaders&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Tree Frogs&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gtag&quot; style=&quot;background:var(--g-treefrog);color:#fff&quot;&gt;Red&lt;/span&gt;&lt;/td&gt;&lt;td&gt;3-4&lt;/td&gt;&lt;td&gt;Gabriela Kish&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Toucans&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gtag&quot; style=&quot;background:var(--g-toucan);color:#3a2606&quot;&gt;Orange&lt;/span&gt;&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;JoLayne E. &amp;amp; Kimberly&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Monkeys&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gtag&quot; style=&quot;background:var(--g-monkey);color:#3a2606&quot;&gt;Yellow&lt;/span&gt;&lt;/td&gt;&lt;td&gt;6-7&lt;/td&gt;&lt;td&gt;Grace K. &amp;amp; Eva&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Parrots&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gtag&quot; style=&quot;background:var(--g-parrot);color:#fff&quot;&gt;Green&lt;/span&gt;&lt;/td&gt;&lt;td&gt;8-9&lt;/td&gt;&lt;td&gt;Hailey S. &amp;amp; Stacy G.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Tigers&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gtag&quot; style=&quot;background:var(--g-tiger);color:#fff&quot;&gt;Blue&lt;/span&gt;&lt;/td&gt;&lt;td&gt;10-12&lt;/td&gt;&lt;td&gt;Elisabeth M.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;
&lt;h4&gt;Lanyard colors at a glance&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Red&lt;/strong&gt; = Tree Frogs, &lt;strong&gt;Orange&lt;/strong&gt; = Toucans, &lt;strong&gt;Yellow&lt;/strong&gt; = Monkeys, &lt;strong&gt;Green&lt;/strong&gt; = Parrots, &lt;strong&gt;Blue&lt;/strong&gt; = Tigers, and &lt;strong&gt;Purple&lt;/strong&gt; = Station Leaders. A child&#x27;s lanyard color tells any volunteer at a glance which group they belong to.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ WHO DOES WHAT ============ --&gt;
&lt;section id=&quot;roles&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;Who does what&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Four roles make the day run. Most volunteers are &lt;strong&gt;group leaders&lt;/strong&gt; or &lt;strong&gt;station leads&lt;/strong&gt;. Know your lane.&lt;/p&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;
&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Team leads / Directors&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Jake &amp;amp; Annie&lt;/strong&gt; run the day. They open and close, set the day focus in the 8:30 briefing, handle escalations, allergies, security, and pickup decisions, and answer any &quot;I am not sure&quot; question. Find them in the Sanctuary or Briefing Room.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;
&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;Station leads&lt;/div&gt;
&lt;p&gt;Own one room all week. Set up before kids arrive, lead the activity, keep the rotation on time, and reset between groups. They teach the content; group leaders manage the kids.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;
&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group / Crew leaders&lt;/div&gt;
&lt;p&gt;Shepherd one group through the &lt;em&gt;whole&lt;/em&gt; morning. Stay with your kids at every station, learn names, help them participate, keep them together and safe, and handle bathroom trips per policy. You are the constant; stations change around you.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;
&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Floaters &amp;amp; support&lt;/div&gt;
&lt;p&gt;Fill gaps: extra hands at busy stations, bathroom escorts, supply runs, line control, covering breaks. Staged from the Briefing Room; the directors deploy them where needed.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;
&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--twilight)&quot;&gt;&lt;/span&gt;Content / station support - Drea&lt;/div&gt;
&lt;p&gt;Roves between stations to keep the daily content and age-level notes on track and helps any team that falls behind.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;
&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--bark)&quot;&gt;&lt;/span&gt;Production - Ian&lt;/div&gt;
&lt;p&gt;Runs sound, media, slides, and the Spotlight show for opening and closing. Your go-to for any tech or A/V need.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout watch&quot;&gt;
&lt;h4&gt;The golden rule of transitions&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Group leaders move with their kids; station leads stay put.&lt;/strong&gt; When a rotation ends, the station lead thanks the group and points them to the next room - the group leader walks them there and checks in with the next lead. Kids are never between rooms without their group leader.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;
&lt;h4&gt;Staying on time&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Station leaders use countdown clocks&lt;/strong&gt; at their station so every block ends on time. &lt;strong&gt;Group leaders keep a timer on their phone&lt;/strong&gt; as a backup and to pace bathroom trips. &lt;strong&gt;Jake and Annie float all morning&lt;/strong&gt; to keep transitions crisp - if a hallway is jamming up or a room is running long, they will help move it along.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--paper-2);&quot;&gt;
&lt;h3 style=&quot;margin-bottom:6px;&quot;&gt;Jump to a section&lt;/h3&gt;
&lt;div class=&quot;tocgrid&quot;&gt;
&lt;a href=&quot;#daily-flow&quot;&gt;&lt;span&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;  Daily flow &amp;amp; rules (everyone)&lt;/span&gt;&lt;span class=&quot;n&quot;&gt;→&lt;/span&gt;&lt;/a&gt;
&lt;a href=&quot;#schedule&quot;&gt;&lt;span&gt;&lt;span class=&quot;n&quot;&gt;05&lt;/span&gt;  The rotation schedule grid&lt;/span&gt;&lt;span class=&quot;n&quot;&gt;→&lt;/span&gt;&lt;/a&gt;
&lt;a href=&quot;#checkin&quot;&gt;&lt;span&gt;&lt;span class=&quot;n&quot;&gt;06&lt;/span&gt;  Check-in, pickup &amp;amp; the custom code&lt;/span&gt;&lt;span class=&quot;n&quot;&gt;→&lt;/span&gt;&lt;/a&gt;

&lt;!-- ============ DAILY FLOW &amp; RULES ============ --&gt;
&lt;section class=&quot;pagebreak&quot; id=&quot;daily-flow&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;Daily flow &amp;amp; the rules everyone follows&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Whatever station you serve, these are the shared mechanics. Learn them once and you can plug in anywhere.&lt;/p&gt;
&lt;h3 style=&quot;margin-top:24px;&quot;&gt;The standard rotation block&lt;/h3&gt;
&lt;p class=&quot;mini&quot;&gt;Each station block runs about 20 to 25 minutes. Station leads aim for this shape so groups arrive and leave on time.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;&lt;strong&gt;Receive &amp;amp; welcome&lt;/strong&gt; - greet the group, confirm which group it is, settle them.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;State the focus&lt;/strong&gt; - say the day&#x27;s Bible point; kids respond &quot;Wow, God!&quot;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Lead the activity&lt;/strong&gt; - the station&#x27;s content. Keep it moving.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Connect&lt;/strong&gt; - one question linking the activity to who God is.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Close &amp;amp; send&lt;/strong&gt; - repeat the point, thank them, hand off to the next room.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Reset&lt;/strong&gt; - clear and restock before the next group arrives.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;The &quot;Wow, God!&quot; response&lt;/h3&gt;
&lt;p class=&quot;mini&quot;&gt;Used at every station, all week. Say the Bible point and the kids fling both hands open like fireworks and shout &lt;strong&gt;&quot;Wow, God!&quot;&lt;/strong&gt; It is our response to the day&#x27;s truth about God&#x27;s nature.&lt;/p&gt;
&lt;h3 style=&quot;font-size:1.05rem;margin-top:16px;&quot;&gt;The attention signal&lt;/h3&gt;
&lt;p class=&quot;mini&quot;&gt;Adopt one team-wide so it works in any room. &lt;strong&gt;Suggested:&lt;/strong&gt; a leader calls &lt;em&gt;&quot;Rainforest...&quot;&lt;/em&gt; and kids answer &lt;em&gt;&quot;...READY!&quot;&lt;/em&gt;, freeze, eyes up, voices off. Always wait for full quiet before giving directions.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h3 style=&quot;margin-top:26px;&quot;&gt;Behavior &amp;amp; safety language&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;Use &lt;strong&gt;positive&lt;/strong&gt; directions: &quot;Walk with your group,&quot; not &quot;Do not run.&quot;&lt;/li&gt;
&lt;li&gt;If kids talk over you, &lt;strong&gt;stop and wait&lt;/strong&gt; for quiet before continuing.&lt;/li&gt;
&lt;li&gt;If a child is upset, the group leader stays close; offer a calm job or a short reset in the Nursery or hallway.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Never shame&lt;/strong&gt; a child for losing, answering differently, needing help, or sitting out.&lt;/li&gt;
&lt;li&gt;Group leaders stay with their kids &lt;strong&gt;at all times&lt;/strong&gt;, including transitions and bathrooms.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;callout safety&quot; style=&quot;margin:0;&quot;&gt;
&lt;h4&gt;Stop &amp;amp; get a director - do not guess&lt;/h4&gt;
&lt;p&gt;For any &lt;strong&gt;bathroom, allergy, injury, or security&lt;/strong&gt; concern, pause and get Jake, Annie, or Jake or Annie.&lt;/p&gt;
&lt;p&gt;Disclosures of &lt;strong&gt;harm or abuse&lt;/strong&gt;: thank the child, stay calm, involve a director now. No secrecy, no investigating.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Faith or salvation questions:&lt;/strong&gt; affirm them, do not pressure, and loop in a pastoral leader after.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ SCHEDULE GRID ============ --&gt;

&lt;div class=&quot;grid two&quot; style=&quot;margin-top:18px;&quot;&gt;

&lt;h4&gt;If you are a group leader&lt;/h4&gt;
&lt;p&gt;Worship together first, then your group color is your map. At 9:55 go to your Block 1 station, then move one row down the grid each block (wrapping from Scripture back to Games). You stay with the kids the whole time; the rooms change around you.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;callout watch&quot; style=&quot;margin:0;&quot;&gt;
&lt;h4&gt;If you are a station lead&lt;/h4&gt;
&lt;p&gt;Read your row left to right: that is the order of groups you receive. Tree Frogs are youngest, Tigers are oldest - plan your pacing and difficulty for whoever is next.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;ico&quot;&gt;CI&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;Monday 8:30 to 9:00 · Outdoors at the entrance&lt;/div&gt;
&lt;h2&gt;Check-in &amp;amp; the Monday kit handout&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;The very first thing families experience. We run it outside so arrival feels like a party, get every child signed in for the week, and send them into the Sanctuary ready to go.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;When&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Monday 8:30-9:00 (outdoors)&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Where&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Building entrance, smaller turf area&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Led by&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Kendra + 2 to 3 volunteers&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Monday&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Sign in for the week, hand out bags&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;On Monday the building entrance is our check-in. Set up on the &lt;strong&gt;smaller turf area to the side as you face the building&lt;/strong&gt;, so the whole arrival happens outdoors and feels like the start of an adventure. Kendra leads a team of two to three volunteers at the table. They sign each child in for the entire week, hand over the child&#x27;s drawstring bag, and direct families inside. Aim to have &lt;strong&gt;every child checked in by 9:00&lt;/strong&gt; so opening can start clean at 9:00 sharp.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Monday check-in flow&lt;/h3&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;Family arrives at the turf-area table by the entrance.&lt;/li&gt;
&lt;li&gt;A volunteer signs the child in for the week on the roster.&lt;/li&gt;
&lt;li&gt;Hand the child their drawstring bag (laid out on tables in alphabetical order by last name for fast grab).&lt;/li&gt;
&lt;li&gt;Point the family to any handouts and resolve payment if needed (see below).&lt;/li&gt;
&lt;li&gt;A volunteer leads the kids inside to the Sanctuary to hang out until the day begins.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;What is in each drawstring bag&lt;/h3&gt;
&lt;p class=&quot;mini&quot; style=&quot;margin-top:0;&quot;&gt;Bags are pre-stuffed and pre-sorted alphabetically so the line never stalls. Each contains:&lt;/p&gt;
&lt;ul class=&quot;check&quot;&gt;
&lt;li&gt;The child&#x27;s &lt;strong&gt;lanyard + name tag&lt;/strong&gt;, in their &lt;strong&gt;group color&lt;/strong&gt;&lt;/li&gt;
&lt;li&gt;Their &lt;strong&gt;Psalm book&lt;/strong&gt; for the week&lt;/li&gt;
&lt;li&gt;Any other take-home/welcome items&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;mini&quot;&gt;The drawstring bag is theirs for the week. Lanyard color = group color, so any volunteer can tell at a glance where a child belongs.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;
&lt;h4&gt;Monday - what every parent leaves with&lt;/h4&gt;
&lt;p&gt;Hand each family &lt;strong&gt;the schedule for the week&lt;/strong&gt;, an &lt;strong&gt;invitation to the Thursday Family BBQ&lt;/strong&gt;, and their &lt;strong&gt;custom pickup code&lt;/strong&gt; (used to verify pickup all week). If a family&#x27;s registration is &lt;strong&gt;not paid&lt;/strong&gt;, Kendra or a director quietly lets them know the amount due and how to pay - discreetly, away from the child and out of earshot of other families. Note the family, share it kindly, keep the line moving.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;callout tip&quot;&gt;
&lt;h4&gt;Keep check-in high energy&lt;/h4&gt;
&lt;p&gt;First impressions set the tone for the whole week. Have &lt;strong&gt;upbeat worship/theme music&lt;/strong&gt; playing at the table, greeters calling kids by name with &lt;strong&gt;high-fives or a quick &quot;welcome tunnel,&quot;&lt;/strong&gt; and a loud, happy &lt;strong&gt;&quot;Welcome to the rainforest!&quot;&lt;/strong&gt; for every family. Cheer when a group color shows up (&quot;Reds in the house - Tree Frogs, let&#x27;s go!&quot;). Smiles, sunglasses, fun hats - make the turf feel like the front door of an adventure, not a paperwork desk.&lt;/p&gt;
&lt;/div&gt;
&lt;h3&gt;Who does what here&lt;/h3&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;Kendra (check-in lead)&lt;/div&gt;&lt;p&gt;Runs the table, owns the roster and the alphabetical bag layout, handles payment conversations, and keeps the line moving so everyone is in by 9:00 and into the Sanctuary.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Check-in volunteers (2-3)&lt;/div&gt;&lt;p&gt;Sign kids in, hand out bags, give parents the schedule and BBQ invite, and walk kids into the Sanctuary.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Directors (Jake &amp;amp; Annie)&lt;/div&gt;&lt;p&gt;Available for any payment, registration, or pickup question Kendra flags - handled quietly.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Receive kids inside the Sanctuary, gather your group by its color sign, and keep them together until opening.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;callout safety&quot; style=&quot;margin:0;&quot;&gt;&lt;h4&gt;Drop-off, pickup &amp;amp; the custom code&lt;/h4&gt;
&lt;p&gt;Drop-off and pickup follow a &lt;strong&gt;Sunday-style check-in flow&lt;/strong&gt;. At drop-off each family receives a &lt;strong&gt;custom pickup code&lt;/strong&gt;. At pickup, a child is released &lt;strong&gt;only&lt;/strong&gt; to an adult who gives the matching code. Never release a child to anyone without the code - any doubt goes to a director.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;callout tip&quot; style=&quot;margin:0;&quot;&gt;&lt;h4&gt;Days 2 to 4 are faster&lt;/h4&gt;
&lt;p&gt;No tables of bags and no packets. Kids are &lt;strong&gt;dropped off and go straight into the Sanctuary&lt;/strong&gt; to be with their group. A greeter at the door keeps it warm and quick; group leaders gather kids inside by color.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ OPENING ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;opening&quot;&gt;
&lt;div class=&quot;station-banner b-twilight&quot;&gt;
&lt;div class=&quot;ico&quot;&gt;OP&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;9:00 to 9:50 · Everyone together · Led by Jake &amp;amp; Annie&lt;/div&gt;
&lt;h2&gt;Opening - Sing &amp;amp; Play Tune Lagoon&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;The whole VBS gathers in the Sanctuary to start the day with one voice: worship songs, the daily Bible point, the memory verse, the Bible Memory Buddy, God Sightings, and the optional daily skit - before groups split off to rotations.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;When&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;9:00 to 9:50, daily&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Where&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Sanctuary (Tune Lagoon set)&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Led by&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Jake &amp;amp; Annie + worship team + optional skit team&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Who is there&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;All kids, all leaders&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;All kids and leaders begin in the Sanctuary for worship songs, daily Bible point, memory verse, Buddy, God Sightings, optional skit or extra songs, and group release by color.&lt;/p&gt;&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;Opening backup plan&lt;/h4&gt;&lt;p&gt;If the optional skit is not staffed, do not force it. Continue with worship and dance, add one or two Forest Frank songs or familiar sing-alongs, then move directly into the Bible point, verse, Buddy, God Sightings, and group release.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;The room &amp;amp; where things happen&lt;/h4&gt;
&lt;p&gt;The &lt;strong&gt;Sanctuary&lt;/strong&gt; is set as a rainforest with a waterfall installation by the stage. &lt;strong&gt;Chairs are pushed to the back all week&lt;/strong&gt; for open movement space. Each group gathers and is dismissed at its &lt;strong&gt;color sign&lt;/strong&gt; (Red Tree Frogs, Orange Toucans, Yellow Monkeys, Green Parrots, Blue Tigers). A &lt;strong&gt;God Sightings Celebration Spot&lt;/strong&gt; (a marked wall or stage section) holds the banner and the cutouts groups add each day. The &lt;strong&gt;day&#x27;s Bible Point Poster&lt;/strong&gt; stands up front, and the screen shows the Bible Memory Buddy intro and the closing Spotlight photos.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Before kids arrive (setup)&lt;/h3&gt;
&lt;ul class=&quot;check&quot;&gt;
&lt;li&gt;Test the microphone, sound system, screen &amp;amp; music&lt;/li&gt;
&lt;li&gt;Set the day&#x27;s Bible Point Poster up front&lt;/li&gt;
&lt;li&gt;Set up the God Sightings Celebration Spot + tape&lt;/li&gt;
&lt;li&gt;Place each group&#x27;s color sign for gathering&lt;/li&gt;
&lt;li&gt;Start the music ~30 min early to set the vibe&lt;/li&gt;
&lt;li&gt;5 minutes before: leader huddle &amp;amp; prayer up front&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Opening flow (9:00 to 9:50)&lt;/h3&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;Jake/Annie welcome everyone and name the day &amp;amp; theme.&lt;/li&gt;
&lt;li&gt;Opening prayer + quick safety/flow reminders.&lt;/li&gt;
&lt;li&gt;Worship song(s) with motions (worship team).&lt;/li&gt;
&lt;li&gt;Teach/repeat the Bible point + &quot;Wow, God!&quot; response.&lt;/li&gt;
&lt;li&gt;Introduce and read the day&#x27;s Bible verse.&lt;/li&gt;
&lt;li&gt;Meet the day&#x27;s Bible Memory Buddy (intro video/poster).&lt;/li&gt;
&lt;li&gt;God Sightings (Day 2+): groups share &amp;amp; add cutouts.&lt;/li&gt;
&lt;li&gt;A short whole-group game.&lt;/li&gt;
&lt;li&gt;The optional daily skit (&lt;a href=&quot;#scripts&quot;&gt;full scripts here&lt;/a&gt;).&lt;/li&gt;
&lt;li&gt;Announcements, prayer, release groups to Block 1.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;The &quot;Wow, God!&quot; response (teach it Day 1)&lt;/h4&gt;
&lt;p&gt;Every time a leader says the day&#x27;s Bible point, kids &lt;strong&gt;fling their fingers wide like fireworks&lt;/strong&gt; and shout &lt;strong&gt;&quot;Wow, God!&quot;&lt;/strong&gt; Teach it slowly on Monday; it should be automatic by Wednesday. It is used at every station, all week.&lt;/p&gt;
&lt;/div&gt;
&lt;h3&gt;Who does what here&lt;/h3&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Jake &amp;amp; Annie (lead)&lt;/div&gt;&lt;p&gt;Host the whole opening: welcome, Bible point, verse, Buddy intro, God Sightings, announcements, prayer, and the timed release to stations.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;Worship team (Grace, Eva, Mya)&lt;/div&gt;&lt;p&gt;Lead songs and motions from the stage and the sides; model the energy and the &quot;Wow, God!&quot; response.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--berry)&quot;&gt;&lt;/span&gt;Optional skit team&lt;/div&gt;&lt;p&gt;Perform the day&#x27;s skit (Ranger Rio). See the scripts section.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Sit with your group at its color sign, do every motion, lead God Sightings sharing, keep kids together, and listen for your release cue. Kids follow your lead.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Day by day at opening&lt;/h3&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Day&lt;/th&gt;&lt;th&gt;Bible point&lt;/th&gt;&lt;th&gt;Verse&lt;/th&gt;&lt;th&gt;Buddy&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;Mon&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;God is our creator&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Psalm 103:22&lt;/td&gt;&lt;td&gt;Tango&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;Tue&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;God is love&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Psalm 136:1&lt;/td&gt;&lt;td&gt;Tia&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;Wed&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;God is forever&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Psalm 115:18&lt;/td&gt;&lt;td&gt;Howie&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;Thu&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Celebrate it all&lt;/span&gt; (Fun Day)&lt;/td&gt;&lt;td&gt;Review&lt;/td&gt;&lt;td&gt;All three&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;p class=&quot;mini&quot;&gt;Songs come from the Rainforest Falls set (&quot;God Is,&quot; &quot;Majestic,&quot; &quot;All Creatures of Our God and King,&quot; and more). God Sightings sharing begins Tuesday; on Monday, opening focuses on teaching the response and orienting groups.&lt;/p&gt;

&lt;/section&gt;
&lt;!-- ============ SKIT LOGISTICS ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;skit&quot;&gt;
&lt;div class=&quot;station-banner b-berry&quot;&gt;
&lt;div class=&quot;ico&quot;&gt;SK&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;Inside Opening · Daily&lt;/div&gt;
&lt;h2&gt;The optional daily skit - logistics&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;A short, recurring-character skit that dramatizes the day&#x27;s truth about God and hands the kids a picture they carry into every station. Full scripts are in the next section.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Where&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Sanctuary stage&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;When&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;~9:42 to 9:50, daily&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Length&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;5 to 8 minutes&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Run by&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Optional skit team (see below)&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The optional skit is the storytelling heartbeat of opening. The same characters return each day so kids stay invested across the week, and each day the characters hit a problem that the day&#x27;s truth about God answers. It happens on the main stage during opening, right after the group game and just before the Bible point, so the optional skit sets up the point the leaders then say out loud.&lt;/p&gt;&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;Skit is optional this year&lt;/h4&gt;&lt;p&gt;Use the skit only if the volunteer team is staffed and ready. If not, keep opening simple: worship, the daily Bible point, memory verse, Buddy, God Sightings, and extra songs. Forest Frank songs or familiar sing-alongs can fill that time without disrupting the schedule.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;The recurring characters&lt;/h3&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;GUIDE&lt;/div&gt;&lt;p&gt;The steady, warm host who frames each scene and lands the day&#x27;s truth. Off book, high energy. Same actor all week.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;RANGER RIO&lt;/div&gt;&lt;p&gt;The lovable, over-enthusiastic rainforest ranger who has the problem or question each day. Big, kid-friendly expressions; the character the kids root for.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--berry)&quot;&gt;&lt;/span&gt;COCO (optional)&lt;/div&gt;&lt;p&gt;A toucan puppet sidekick for comic relief, operated by a helper. Lines are optional - cut Coco if you only have two actors.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;TECH&lt;/div&gt;&lt;p&gt;Mics, music stings, lights, and props. Cues the start and the close.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;
&lt;h4&gt;Assign the optional skit team&lt;/h4&gt;
&lt;p&gt;The optional skit needs the same GUIDE and RANGER RIO (plus optional COCO and a tech) all four days for continuity. Pull them from the volunteer roster and confirm at the Monday 8:30 briefing. Actors rehearse all four short scripts before Day 1 and keep a printed copy at the sound table.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Skit flow each day&lt;/h3&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;Tech cue: music sting, Rio enters.&lt;/li&gt;
&lt;li&gt;Set up the problem or question (about 1 min).&lt;/li&gt;
&lt;li&gt;Guide and Rio talk it through (2 to 4 min).&lt;/li&gt;
&lt;li&gt;Land the day&#x27;s truth in one clear line.&lt;/li&gt;
&lt;li&gt;Hand to the opening leader for the Bible point and &quot;Wow, God!&quot;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;callout watch&quot; style=&quot;margin:0;&quot;&gt;&lt;h4&gt;Skit guardrails&lt;/h4&gt;
&lt;p&gt;Keep it under 8 minutes. Funny is good; silliness that buries the point is not. Use gentle language around the cross on Day 2 and no graphic detail. If a puppet or costume is used, the handler stays with it the whole scene. If tech fails, the Guide performs it live with no mics - keep going.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h3 style=&quot;margin-top:8px;&quot;&gt;Props you will need for the optional skits&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Recurring (all week)&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;RANGER RIO&#x27;s oversized &lt;strong&gt;explorer backpack&lt;/strong&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;COCO the toucan puppet&lt;/strong&gt; (optional sidekick)&lt;/li&gt;
&lt;li&gt;2 wireless &lt;strong&gt;mics&lt;/strong&gt; (Guide + Rio) and a sound source for music stings&lt;/li&gt;
&lt;li&gt;Rio&#x27;s &lt;strong&gt;entrance music sting&lt;/strong&gt; cued the same way every day&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Day by day&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;&lt;strong&gt;Day 1:&lt;/strong&gt; a real &lt;strong&gt;leaf&lt;/strong&gt; and a &lt;strong&gt;toy bird&lt;/strong&gt; for the &quot;who made this?&quot; bit&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Day 2:&lt;/strong&gt; a &lt;strong&gt;clipboard that breaks&lt;/strong&gt; - bring two (one intact, one pre-snapped) or a safe breakable prop&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Day 3:&lt;/strong&gt; an &lt;strong&gt;empty snack wrapper&lt;/strong&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Day 4:&lt;/strong&gt; a &lt;strong&gt;party streamer or flag&lt;/strong&gt; for the big send-off&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;mini&quot;&gt;Keep the recurring props in a labeled bin at the sound table so the optional skit team can grab and reset fast between days.&lt;/p&gt;
&lt;/section&gt;
&lt;!-- ============ SKIT SCRIPTS ============ --&gt;
&lt;section class=&quot;pagebreak&quot; id=&quot;scripts&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;Optional daily skit scripts (Day 1 to 4)&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Full scripts for the optional skit team. Each runs 5 to 8 minutes on the Sanctuary stage during opening. Lines are a strong guide, not a cage - stay in character, keep the energy up, and always land the day&#x27;s truth before handing back to the opening leader. Bracketed italics are stage directions. Cut COCO&#x27;s lines if you only have two actors.&lt;/p&gt;&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;Skit is optional this year&lt;/h4&gt;&lt;p&gt;Use the skit only if the volunteer team is staffed and ready. If not, keep opening simple: worship, the daily Bible point, memory verse, Buddy, God Sightings, and extra songs. Forest Frank songs or familiar sing-alongs can fill that time without disrupting the schedule.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;
&lt;h4&gt;Standing setup for all four days&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Cast:&lt;/strong&gt; GUIDE (host), RANGER RIO (recurring), COCO the toucan puppet (optional), TECH (offstage). &lt;strong&gt;Set:&lt;/strong&gt; the rainforest stage with the waterfall backdrop. &lt;strong&gt;Props kept onstage:&lt;/strong&gt; Rio&#x27;s oversized explorer backpack and a clipboard. &lt;strong&gt;Recurring runner:&lt;/strong&gt; Rio always enters from the same side with the same music sting so kids cheer when they hear it. End every skit by handing to the opening leader for the Bible point and the &quot;Wow, God!&quot; response.&lt;/p&gt;
&lt;/div&gt;
&lt;!-- DAY 1 --&gt;
&lt;div class=&quot;script&quot;&gt;
&lt;h4&gt;Day 1 - Monday - &quot;Who Made All This?&quot;&lt;/h4&gt;
&lt;div class=&quot;meta-row&quot;&gt;
&lt;span class=&quot;tagp&quot;&gt;Theme: God is our creator&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Verse: Psalm 103:22&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Runtime: ~6 min&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Props: backpack, leaf, toy bird&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;dir full&quot;&gt;[Music sting. RANGER RIO bursts onstage spinning in circles, staring up and around at the rainforest, mouth wide open. GUIDE walks on calmly.]&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Whoa, whoa - Ranger Rio! You okay, buddy? You are spinning like a ceiling fan.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Guide! Guide! Look at this place! There are green leaves, and blue water, and a bird that is SO fancy it should pay rent. Where did all of this even COME from?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;That is a great question. What do you think?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;I figure... it just sort of... happened? Like one day there was nothing, and then - BAM - rainforest. Maybe a really big sneeze.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;dir&quot;&gt;[COCO pops up from the backpack.]&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;A sneeze?! Rio, that is the silliest thing I have heard since you tried to high-five a waterfall.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;It high-fived me back! It was wet, but it counted.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Rio, look closer. This bird has a pattern. The leaf has tiny veins like little roads. The water knows exactly where to go. That is not a sneeze - that is a plan. Somebody designed it.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Somebody... made it? On purpose?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;God did. The very first page of the Bible says God made the light, the sky, the water, the plants, the animals - all of it. And he did not stop there. He made people. He made you.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;dir&quot;&gt;[Rio freezes, points slowly at himself.]&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Me? God made... ME? On purpose? Even my weird left elbow?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Especially the elbow. You are not an accident, Rio. You are a creation - made on purpose, by a God who does not make junk.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;So the bird, the leaves, the water, AND Rio... same Maker.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;That makes me want to say something really loud.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Then let&#x27;s teach everybody. When we remember God made it all, we throw our hands open like fireworks and say it. Ready?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;landing&quot;&gt;GUIDE &amp;amp; RIO: &quot;God is our creator...&quot; [hands fling open] &quot;WOW, GOD!&quot;&lt;/div&gt;
&lt;div class=&quot;dir full&quot;&gt;[Guide hands off to the opening leader for the Bible point and release to stations.]&lt;/div&gt;
&lt;/div&gt;
&lt;!-- DAY 2 --&gt;
&lt;div class=&quot;script&quot;&gt;
&lt;h4&gt;Day 2 - Tuesday - &quot;I Think I Blew It&quot;&lt;/h4&gt;
&lt;div class=&quot;meta-row&quot;&gt;
&lt;span class=&quot;tagp&quot;&gt;Theme: God is love&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Verse: Psalm 136:1&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Runtime: ~6 min&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Props: backpack, a cracked clipboard&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;dir full&quot;&gt;[Music sting, but slower. RANGER RIO trudges on, head down, holding a clipboard that has clearly snapped in half. GUIDE enters.]&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Morning, Rio! Ready for - oh. What happened to the official ranger clipboard?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;I broke it. I was supposed to keep it safe, and I tripped over a root, and... snap. I had ONE job, Guide.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;[peeking out, gently] He feels really bad about it.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;I figure you are going to be done with me now. Why would anybody want a ranger who messes up?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Rio. Look at me. Do you think I stop caring about you because you made a mistake?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;...Isn&#x27;t that how it works? You mess up, people stop loving you?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;That is how a lot of the world feels. But it is not how God&#x27;s love works. God&#x27;s love does not turn off when you mess up. The Bible says his faithful love endures forever - that means it stays. It does not quit.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Forever? Even on a clipboard-snapping, root-tripping kind of day?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Even then. And here is how much: God did not just say he loves us. He showed it. He sent Jesus, who gave himself for us and came back to life, so that nothing we do could keep us away from him.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;So God&#x27;s love is not something Rio has to earn?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Nope. You cannot earn it, and you cannot break it. It is a gift.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;dir&quot;&gt;[Rio slowly lifts his head, a small smile.]&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;A love that stays even on my worst day... that is the best news a clumsy ranger ever heard.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;It is the best news anybody ever heard. Let&#x27;s say it together, big hands.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;landing&quot;&gt;GUIDE &amp;amp; RIO: &quot;God is love...&quot; [hands fling open] &quot;WOW, GOD!&quot;&lt;/div&gt;
&lt;div class=&quot;dir full&quot;&gt;[Guide hands off to the opening leader. Keep the cross gentle and hopeful - no graphic detail.]&lt;/div&gt;
&lt;/div&gt;
&lt;!-- DAY 3 --&gt;
&lt;div class=&quot;script&quot;&gt;
&lt;h4&gt;Day 3 - Wednesday - &quot;Does Everything Good Have to End?&quot;&lt;/h4&gt;
&lt;div class=&quot;meta-row&quot;&gt;
&lt;span class=&quot;tagp&quot;&gt;Theme: God is forever&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Verse: Psalm 115:18&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Runtime: ~6 min&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Props: backpack, empty snack wrapper&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;dir full&quot;&gt;[Music sting. RANGER RIO walks on staring sadly at an empty snack wrapper.]&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Rio, why the long face? You look like your favorite waterfall ran out of water.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;I just finished the best snack of my whole life. And now... it is gone. The bag is empty. And it got me thinking, Guide - everything good ends. Snacks end. Vacations end. Even VBS is going to end soon.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;[sniffles] Now I&#x27;m sad too. Thanks a lot, Rio.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Sorry, Coco. But is there ANYTHING that does not run out?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Yes. One thing. Actually, one Person. God.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;God does not run out?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;God has no last page, no empty bag, no closing time. The Bible says we can praise the Lord both now AND forever. Your snack lasted five minutes. God lasts... forever.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;So even when VBS ends on Thursday...&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;God is still right there with you. His love does not run out. And one day his people get to be with him in a forever home where nothing good ever ends.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;[brightening] A place where the snacks never run out?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;A place better than we can imagine, Coco - because God is there.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Okay, that turned my frown ALL the way around. If God is forever, then I want to praise him now... and keep praising him forever.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Then start right now. Big hands, everybody.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;landing&quot;&gt;GUIDE &amp;amp; RIO: &quot;God is forever...&quot; [hands fling open] &quot;WOW, GOD!&quot;&lt;/div&gt;
&lt;div class=&quot;dir full&quot;&gt;[Guide hands off to the opening leader.]&lt;/div&gt;
&lt;/div&gt;
&lt;!-- DAY 4 --&gt;
&lt;div class=&quot;script&quot;&gt;
&lt;h4&gt;Day 4 - Thursday - &quot;The Big Send-Off&quot; (Fun Day)&lt;/h4&gt;
&lt;div class=&quot;meta-row&quot;&gt;
&lt;span class=&quot;tagp&quot;&gt;Theme: Celebrate the whole week&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Recaps: creator, love, forever&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Runtime: ~4 to 5 min&lt;/span&gt;
&lt;span class=&quot;tagp&quot;&gt;Props: backpack, party flag/streamer&lt;/span&gt;
