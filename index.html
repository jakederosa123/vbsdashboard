&lt;/div&gt;
&lt;div class=&quot;dir full&quot;&gt;[Big celebratory music sting. RANGER RIO charges on waving a streamer, full of energy. GUIDE follows, laughing.]&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;It is FUN DAY! Games! Face paint! A BBQ! Guide, this is the best day ever - and I am not even sad it is the last one!&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Not sad? Rio, on Wednesday you cried over an empty snack bag.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;I know! But I learned some things this week. Coco, help me remember.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Day one: who made the whole rainforest... and made YOU on purpose?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;God is our creator!&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Day two: whose love stays even when you snap the official clipboard?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;God is love!&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Coco&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Day three: what never, ever runs out?&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;God is forever! See, Guide? Even when VBS ends today, the God we learned about does not end. He made me, he loves me, and he is with me forever.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;Rio... that is exactly it. You did not just have fun this week. You got to know who God is.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Rio&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;So let&#x27;s send everybody off the loudest way we know how. Then - BBQ!&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ln&quot;&gt;&lt;span class=&quot;char&quot;&gt;Guide&lt;/span&gt;&lt;span class=&quot;say&quot;&gt;One more time, the biggest hands all week. For everything God is...&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;landing&quot;&gt;EVERYONE: &quot;God is our creator, God is love, God is forever...&quot; [hands fling open] &quot;WOW, GOD!&quot;&lt;/div&gt;
&lt;div class=&quot;dir full&quot;&gt;[Music up. Guide hands off to Jake and Annie for the Fun Day flow and the family BBQ.]&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ GAMES ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;games&quot;&gt;
&lt;div class=&quot;station-banner b-mango&quot;&gt;&lt;div class=&quot;ico&quot;&gt;01&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;role&quot;&gt;Rotation Station 1 · Outdoor Games&lt;/div&gt;&lt;h2&gt;Wild About God Games&lt;/h2&gt;&lt;div class=&quot;tag&quot;&gt;Active outdoor games with clear boundaries, high energy, and simple safety rules.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Room&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Outside Area&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Station leads&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Mikai, Isaac, Selah&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Scoring&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Cooperative, not winners vs losers&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Win&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Everyone included, no one hurt&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Station leads&lt;/div&gt;&lt;p&gt;Set the boundary, pick the activity, explain it in 20 seconds or less, watch for rough play, call water breaks, and adapt to age and weather.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Play alongside kids, keep the group together, hold the boundary line, stop rough play early, and include quieter kids.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--toucan)&quot;&gt;&lt;/span&gt;Kids&lt;/div&gt;&lt;p&gt;Play, cooperate, listen quickly, stay inside the boundary, and follow safety rules.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;Floaters&lt;/div&gt;&lt;p&gt;Extra eyes for boundaries, water, bathroom escorts, and team balancing.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Rules&lt;/h3&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Boundary is visible before kids arrive.&lt;/li&gt;&lt;li&gt;Check the ground for holes, rocks, and slick spots.&lt;/li&gt;&lt;li&gt;No pushing, tackling, grabbing clothing, or rough tag.&lt;/li&gt;&lt;li&gt;Keep races short and build in water breaks.&lt;/li&gt;&lt;li&gt;Use indoor low-movement options if weather is unsafe.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;What is not working?&lt;/h3&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;strong&gt;Too young:&lt;/strong&gt; remove speed and make it a walking challenge.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Too competitive:&lt;/strong&gt; switch to a whole-group goal.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Too rough:&lt;/strong&gt; stop immediately, reset rules, and shrink the game space.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Unsafe weather:&lt;/strong&gt; move to passing, balancing, or circle games inside.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;Keep energy high&lt;/h4&gt;&lt;p&gt;Fast directions, quick rounds, loud encouragement, water breaks, and clear boundaries. Celebrate teamwork more than winning.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ CRAFTS ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;crafts&quot;&gt;
&lt;div class=&quot;station-banner b-leaf&quot;&gt;&lt;div class=&quot;ico&quot;&gt;02&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;role&quot;&gt;Rotation Station 2 · Crafts&lt;/div&gt;&lt;h2&gt;Creation Station&lt;/h2&gt;&lt;div class=&quot;tag&quot;&gt;Hands-on craft space with prepared tables, simple steps, and safe cleanup.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Room&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Elementary Area&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Station leads&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Sarah L. &amp;amp; Kathy L.&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Goal&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Discovery, not perfection&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Win&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Each kid leaves with their project&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Station leads&lt;/div&gt;&lt;p&gt;Prep supplies before kids arrive, show the sample, demo one step at a time, keep supplies controlled, and run cleanup.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Craft support&lt;/div&gt;&lt;p&gt;Distribute and refill supplies, help at tables, manage the cleanup bin, and protect the take-home pile.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Help kids follow steps, encourage kids whose work looks different, and keep take-home items with the group.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--toucan)&quot;&gt;&lt;/span&gt;Kids&lt;/div&gt;&lt;p&gt;Make, experiment, personalize, clean up, and keep supplies safe.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Rules&lt;/h3&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Supplies are set before kids arrive, but not all handed out at once.&lt;/li&gt;&lt;li&gt;Scissors, glue, small pieces, and messy items stay controlled.&lt;/li&gt;&lt;li&gt;Give a two-minute cleanup warning.&lt;/li&gt;&lt;li&gt;Check tables before each group leaves.&lt;/li&gt;&lt;li&gt;Take-home items go with the group or into the marked take-home area.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;What is not working?&lt;/h3&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;&lt;strong&gt;Kids are confused:&lt;/strong&gt; demo one step again and slow the pace.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Tables are chaotic:&lt;/strong&gt; pause supplies, reset directions, and use group leaders at tables.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Project is taking too long:&lt;/strong&gt; simplify the final step and protect the transition time.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Supplies are running low:&lt;/strong&gt; call a floater before the next group arrives.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;Keep the room calm and moving&lt;/h4&gt;&lt;p&gt;Short directions, prepared supplies, quick encouragement, and clear cleanup. Celebrate effort and originality, not neatness.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ SNACK ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;snack&quot;&gt;
&lt;div class=&quot;station-banner b-berry&quot;&gt;
&lt;div class=&quot;ico&quot;&gt;03&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;Rotation Station 3 · Snack &amp;amp; Reset · Cave Room&lt;/div&gt;
&lt;h2&gt;Snack Shack&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;Snack, water, allergy checks, and a calm reset, with a short tie-in to the day&#x27;s point.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Room&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Cave Room&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Staffing&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Savannah E. &amp;amp; Brooke&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Always&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Gloves on, water available&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Win&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Every child fed safely&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The fuel-and-settle station. Kids get a themed snack and water while the team runs strict allergy checks and keeps a calm pace. A short conversation connects the snack to the day&#x27;s point. (This is the mid-morning snack in the Cave Room; the full lunch is downstairs in the elementary area at the end of the day.)&lt;/p&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;The room&lt;/h4&gt;&lt;p&gt;Snack runs in the &lt;strong&gt;Cave Room&lt;/strong&gt; this year, led by Savannah E. and Brooke. The gray cave-themed room is calm and contained, which makes it a good place for kids to sit, refuel, and reset. Prep can stage from the kitchen, but kids eat their snack here. This room also doubles as the quiet reset spot if a child needs a short break.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;callout safety&quot;&gt;&lt;h4&gt;Core allergy &amp;amp; food-safety rules&lt;/h4&gt;
&lt;ul class=&quot;clean&quot; style=&quot;margin-top:6px;&quot;&gt;
&lt;li&gt;Read the allergy and no-food list &lt;strong&gt;before serving anything, every day.&lt;/strong&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Never guess.&lt;/strong&gt; If a child says they cannot have something, stop and ask the snack lead or director.&lt;/li&gt;
&lt;li&gt;Gloves to prep and serve. Allergen alternatives labeled and kept separate.&lt;/li&gt;
&lt;li&gt;Group leaders &lt;strong&gt;confirm allergies before&lt;/strong&gt; a flagged child receives food.&lt;/li&gt;
&lt;li&gt;Water available every block; eating areas wiped between groups.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;h3&gt;Who does what here&lt;/h3&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;Snack leads (Savannah E. &amp;amp; Brooke)&lt;/div&gt;&lt;p&gt;Run the serving line, own the allergy list, plate safely, keep portions and pace steady, and manage cleanup.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Snack support (2)&lt;/div&gt;&lt;p&gt;Refill water, hand out, wipe tables, manage trash, and prep the next group&#x27;s serving.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Confirm each child&#x27;s allergy status before food, keep kids seated, lead the snack conversation, and help with cleanup.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Kids&lt;/div&gt;&lt;p&gt;Sit, eat, hydrate, answer the connection question, and clean up their spot.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Rotation flow&lt;/h3&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;Welcome the group; seat them together.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Confirm allergies with group leaders before food is handed out.&lt;/strong&gt;&lt;/li&gt;
&lt;li&gt;Say the point; connect the snack in a sentence.&lt;/li&gt;
&lt;li&gt;Serve food and water calmly.&lt;/li&gt;
&lt;li&gt;Connection question while kids eat.&lt;/li&gt;
&lt;li&gt;Bathroom cue if needed (group leaders per policy); collect trash, wipe, reset.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;Keep snack warm and upbeat&lt;/h4&gt;&lt;p&gt;Snack is the calmer, settle station - aim for &lt;strong&gt;warm energy, not wild.&lt;/strong&gt; Do a fun &lt;strong&gt;snack-name reveal&lt;/strong&gt; (&quot;Today we are eating... JUNGLE TRAIL MIX!&quot;), a quick table cheer, and friendly leader conversation. Keep voices up and positive while bodies stay seated.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ BIBLE ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;bible&quot;&gt;
&lt;div class=&quot;station-banner b-bark&quot;&gt;
&lt;div class=&quot;ico&quot;&gt;04&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;Rotation Station 4 · Bible Teaching&lt;/div&gt;
&lt;h2&gt;Under the Waterfall&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;A calm, captivating room where kids dive into the Bible story and how God&#x27;s Word applies to their lives.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Room&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;MPR Room&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Station leads&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Ray &amp;amp; Isaias&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Tone&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Reverent, engaging, gentle&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Win&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Kids notice who God is&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The Bible teaching station. Kids hear and step into the day&#x27;s story (creation / Jesus&#x27; death and resurrection / John&#x27;s vision of heaven) using the Group content, props, and discussion.&lt;/p&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;The room&lt;/h4&gt;&lt;p&gt;The hallway entrance feels like walking beneath a waterfall (hanging tinsel foil curtains). Blue paper walls, sea animals, coral, rocks, and fishing nets. The goal is calm and captivating so kids settle and focus.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Who does what here&lt;/h3&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;Station leads (Ray &amp;amp; Isaias)&lt;/div&gt;&lt;p&gt;Know the story cold before kids arrive, teaches in short scenes, keeps the Bible open and visible, asks application questions, and manages pacing.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Support volunteer&lt;/div&gt;&lt;p&gt;Handles props, helps assign acting roles, manages lights and visuals, and watches the door.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Sit with your group, help kids act safely and listen, keep it reverent in quiet moments, and draw out answers.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Kids&lt;/div&gt;&lt;p&gt;Listen, take simple roles, respond to questions, and connect the story to their own lives.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Rules&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;Know the story in advance; do not read long passages while kids wait.&lt;/li&gt;
&lt;li&gt;Movement and sound, yes; silliness that buries the truth, no.&lt;/li&gt;
&lt;li&gt;Use gentle language for Jesus&#x27; death; no graphic detail.&lt;/li&gt;
&lt;li&gt;Faith or salvation questions: affirm, do not pressure, tell a pastoral leader after.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Rotation flow&lt;/h3&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;Welcome the group into the story space.&lt;/li&gt;
&lt;li&gt;Bible point and response.&lt;/li&gt;
&lt;li&gt;Set the scene in 30 to 60 seconds.&lt;/li&gt;
&lt;li&gt;Lead the story in short scenes; pause to name what to notice about God.&lt;/li&gt;
&lt;li&gt;One application question and prayer.&lt;/li&gt;
&lt;li&gt;Send to the next station; reset props.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;Keep Bible time captivating&lt;/h4&gt;&lt;p&gt;Reverent does not mean flat. Use a &lt;strong&gt;storyteller voice&lt;/strong&gt; with suspense and volume changes, &lt;strong&gt;sound effects&lt;/strong&gt;, and quick participation (&quot;everybody be the wind... GO!&quot;). Pause on the big moments. Pull kids in with questions so they lean forward. Captivated beats calm-and-bored every time.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ SCRIPTURE ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;scripture&quot;&gt;
&lt;div class=&quot;station-banner b-mango&quot;&gt;
&lt;div class=&quot;ico&quot;&gt;05&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;Rotation Station 5 · Memory Verse&lt;/div&gt;
&lt;h2&gt;Verse Vines&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;Kids learn and lock in the day&#x27;s memory verse through repetition, movement, and play.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Room&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Tots Room&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Station leads&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Danielle &amp;amp; Gaby B.&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Method&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Movement-based verse repetition&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Win&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Kids can say the verse&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;A focused station where kids work the day&#x27;s memory verse into their heads with motions, call-and-response, and the Group memory-verse activity. This is the &quot;Scripture&quot; block on the schedule.&lt;/p&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;The room&lt;/h4&gt;&lt;p&gt;Existing animal wall paintings keep decor minimal - hanging vines and greenery give the Verse Vines feel. Cozy and contained, which is good for focus.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Who does what here&lt;/h3&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;Station leads (Danielle &amp;amp; Gaby B.)&lt;/div&gt;&lt;p&gt;Introduces the verse, leads the motions, runs the activity, and keeps repetition fun rather than a drill.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Help non-readers repeat after the leader, keep turns fair, and prevent the activity from becoming a competition.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Kids&lt;/div&gt;&lt;p&gt;Say the verse, do the motions, and take turns; non-readers repeat after a leader.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Floaters&lt;/div&gt;&lt;p&gt;Step in when a group needs extra adult support, help with bathroom trips, transitions, and room flow.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Rules&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;Pair non-readers with a leader or older child; let them repeat after you.&lt;/li&gt;
&lt;li&gt;Keep it active, not a quiz; no one is put on the spot to &quot;pass.&quot;&lt;/li&gt;
&lt;li&gt;If a room feels crowded or a leader needs help, pause the activity and get Jake or Annie.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Rotation flow&lt;/h3&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;Seat the group; say the Bible point.&lt;/li&gt;
&lt;li&gt;Introduce or review the verse in kid-friendly words.&lt;/li&gt;
&lt;li&gt;Run the verse activity with motions.&lt;/li&gt;
&lt;li&gt;Quick discussion question.&lt;/li&gt;
&lt;li&gt;Close with the point; send on.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;Keep scripture high energy&lt;/h4&gt;&lt;p&gt;Turn the verse into a &lt;strong&gt;movement chant&lt;/strong&gt; with a motion for each phrase. Run &lt;strong&gt;speed rounds&lt;/strong&gt; (say it slow, medium, super fast), &lt;strong&gt;volume rounds&lt;/strong&gt; (whisper, then shout), and boy-vs-girl or leader-vs-kids call-backs. Big celebration when they nail it - make memorizing feel like winning.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ CLOSING / LUNCH ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;closing&quot;&gt;
&lt;div class=&quot;station-banner b-twilight&quot;&gt;
&lt;div class=&quot;ico&quot;&gt;PM&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;12:05 to 1:00 · Everyone together · Led by Jake &amp;amp; Annie&lt;/div&gt;
&lt;h2&gt;Lunch &amp;amp; Canopy Closing&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;After lunch, the whole VBS regathers in the Sanctuary to celebrate the day, relive it on the Spotlight screen, do the day&#x27;s big &quot;wow&quot; experience, lock in the truth about God, and dismiss safely.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;When&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;12:05 to 1:00, daily&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Where&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Sanctuary (+ eating area)&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Led by&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Jake &amp;amp; Annie + worship team&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Critical&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Allergy-safe lunch, orderly pickup&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The day ends back where it started - in the Sanctuary, hosted by Jake and Annie. Groups eat lunch together, then gather for Canopy Closing: a celebration that reviews the day&#x27;s Bible point, shows the day&#x27;s Spotlight photos, runs a hands-on &quot;wow&quot; experience tied to the theme, shares God Sightings, and sends everyone off on a high before pickup. Same room as opening, so the worship set, God Sightings Celebration Spot, and Bible Point Poster are already in place.&lt;/p&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;The room &amp;amp; where things happen&lt;/h4&gt;
&lt;p&gt;Use the &lt;strong&gt;Sanctuary&lt;/strong&gt; with chairs still to the back and groups at their color signs. You will need the &lt;strong&gt;screen/projector&lt;/strong&gt; for the Spotlight photo show, the &lt;strong&gt;microphone/sound system&lt;/strong&gt;, the &lt;strong&gt;God Sightings Celebration Spot&lt;/strong&gt;, and a clear front-center space (with a tarp) for the daily &quot;wow&quot; experience. Lunch is served in the &lt;strong&gt;eating area&lt;/strong&gt; just before, so plan the flow from tables back into the Sanctuary.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3&gt;Closing flow (after lunch)&lt;/h3&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;Groups finish lunch and gather by color sign.&lt;/li&gt;
&lt;li&gt;Welcome + a worship song (worship team).&lt;/li&gt;
&lt;li&gt;Spotlight show - photos from today on the screen.&lt;/li&gt;
&lt;li&gt;Review the day&#x27;s Bible point with &quot;Wow, God!&quot;&lt;/li&gt;
&lt;li&gt;The daily &quot;wow&quot; experience (see below).&lt;/li&gt;
&lt;li&gt;God Sightings + (Day 1) hand out Watch for God wristbands.&lt;/li&gt;
&lt;li&gt;Wrap-up: group leaders collect name badges &amp;amp; Bible Memory Buddies into the group bag.&lt;/li&gt;
&lt;li&gt;Announcements, prayer, dismissal to pickup by group.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3&gt;Roles at closing&lt;/h3&gt;
&lt;div class=&quot;role-card&quot; style=&quot;margin-bottom:8px;&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Jake &amp;amp; Annie (lead)&lt;/div&gt;&lt;p&gt;Host the whole closing: Spotlight, review, the wow experience, God Sightings, prayer, and the release to pickup.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot; style=&quot;margin-bottom:8px;&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--lagoon)&quot;&gt;&lt;/span&gt;Worship team&lt;/div&gt;&lt;p&gt;Lead the closing songs and keep energy up between segments.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot; style=&quot;margin-bottom:8px;&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Helpers / floaters&lt;/div&gt;&lt;p&gt;Run the wow-experience props, manage the lunch line, and staff the pickup table.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Eat with your group, keep them together, lead God Sightings, collect badges/Buddies into the group bag, and follow dismissal cues exactly.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;Lunch transition &amp;amp; location&lt;/h4&gt;
&lt;p&gt;Lunch is served &lt;strong&gt;downstairs in the elementary area&lt;/strong&gt; (the Creation Station space flipped for lunch). Jake and Annie lead the transition &lt;strong&gt;from the Sanctuary&lt;/strong&gt;: groups are dismissed &lt;strong&gt;by age group&lt;/strong&gt;, and group leaders line up their kids and walk them downstairs. &lt;strong&gt;Mikai leads the lunch setup transition&lt;/strong&gt; (Isaac supports), and station leaders help flip the space. Keep the same allergy rules from snack at lunch.&lt;/p&gt;
&lt;/div&gt;
&lt;h3&gt;The daily &quot;wow&quot; experience&lt;/h3&gt;
&lt;p class=&quot;mini&quot;&gt;A hands-on object lesson Jake &amp;amp; Annie run from the front, matched to the day&#x27;s truth. Props and full step-by-step are in the Group leader manual; the summaries below are for planning. Practice each one beforehand.&lt;/p&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Day &amp;amp; theme&lt;/th&gt;&lt;th&gt;Experience (in brief)&lt;/th&gt;&lt;th&gt;Main props&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Mon - God is our creator&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;A &quot;Creation Catapult&quot; (a leaf blower fitted with cardboard tubes) launches plush Rainforest Flyers across the room; with each launch, celebrate a part of God&#x27;s creation and shout the point.&lt;/td&gt;
&lt;td&gt;Leaf blower, wye joint, painted mailing tubes, plush flyers, paper plate, duct tape&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Tue - God is love&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;Groups color a cloth heart and tell ways they show love, then dip it in water so the marker smudges (our love is imperfect). The cloths are draped on a cross, and &quot;Jesus&quot; reveals a clean heart - God&#x27;s perfect, lasting love.&lt;/td&gt;
&lt;td&gt;Large cross, tarp, bin of water, white sheet cut into hearts, washable markers, optional Jesus costume&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Wed - God is forever&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;Rocket Balloons zip along a fishing-line zip line, going farther each time but always running out of air - a vivid picture that everything here ends, but only God is forever.&lt;/td&gt;
&lt;td&gt;Rocket Balloons, balloon pumps, fishing line, drinking straws, tape, clothespins&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Thu - Fun Day&lt;/span&gt;&lt;/td&gt;
&lt;td&gt;Celebration recap of all three truths leading into the family BBQ (see the Thursday section).&lt;/td&gt;
&lt;td&gt;See Thursday section&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;div class=&quot;callout info&quot;&gt;&lt;h4&gt;God Sightings &amp;amp; Watch for God wristbands&lt;/h4&gt;
&lt;p&gt;Kids learn about &lt;strong&gt;God Sightings&lt;/strong&gt; (everyday evidence of God at work) at Day 1 closing and receive a &lt;strong&gt;Watch for God wristband&lt;/strong&gt; to wear all week. From Tuesday on, groups share God Sightings at opening and add cutouts to the Celebration Spot. Group leaders keep the sharing warm and quick.&lt;/p&gt;
&lt;/div&gt;
&lt;h3 style=&quot;margin-top:24px;&quot;&gt;High-energy closing ideas (pick a few, keep them thematic)&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Sound &amp;amp; music&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;Open closing with a &lt;strong&gt;jungle soundscape&lt;/strong&gt; (birds, rain, drums) fading into an upbeat worship track.&lt;/li&gt;
&lt;li&gt;Use a &lt;strong&gt;drumroll&lt;/strong&gt; before the Bible point and a &lt;strong&gt;cheer/air-horn sound&lt;/strong&gt; on &quot;Wow, God!&quot;&lt;/li&gt;
&lt;li&gt;Run a &quot;&lt;strong&gt;rainstorm&lt;/strong&gt;&quot; body-percussion moment - rub palms, snap, then stomp to build a storm, tying into &quot;Rainforest Falls.&quot;&lt;/li&gt;
&lt;li&gt;End on the day&#x27;s &lt;strong&gt;theme song&lt;/strong&gt; at full volume so kids leave singing.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Movement &amp;amp; props&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;&lt;strong&gt;Beach balls or balloons&lt;/strong&gt; batted overhead during the final song (collect before dismissal).&lt;/li&gt;
&lt;li&gt;A &quot;&lt;strong&gt;loudest Wow, God!&lt;/strong&gt;&quot; contest by group color - Red vs Orange vs Yellow vs Green vs Blue.&lt;/li&gt;
&lt;li&gt;A quick &lt;strong&gt;recap call-and-response&lt;/strong&gt;: &quot;God is...&quot; and kids fire back creator / love / forever.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Streamers, pom-poms, or color flags&lt;/strong&gt; on the big moments; &lt;strong&gt;colored stage lights&lt;/strong&gt; if available.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout tip&quot;&gt;&lt;h4&gt;Land it, then bring it down&lt;/h4&gt;&lt;p&gt;Spike the energy for the celebration, then deliberately &lt;strong&gt;bring the room down&lt;/strong&gt; for the Bible-point recap and prayer so the truth lands quietly before the loud send-off. High, then low, then one last cheer into dismissal.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;callout safety&quot;&gt;&lt;h4&gt;Dismissal &amp;amp; pickup&lt;/h4&gt;
&lt;p&gt;Pickup follows the Sunday-style flow: release each child &lt;strong&gt;only&lt;/strong&gt; to an adult who gives the family’s &lt;strong&gt;custom pickup code&lt;/strong&gt;. Give one direction at a time: &quot;Group leaders stand,&quot; then &quot;Groups line up,&quot; then &quot;Walk to pickup.&quot; Keep kids with their group leader until the code is verified. The last five minutes shape parent confidence - end with calm authority.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ THURSDAY ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;thursday&quot;&gt;
&lt;div class=&quot;station-banner b-mango&quot;&gt;
&lt;div class=&quot;ico&quot;&gt;D4&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;Day 4 · Thursday&lt;/div&gt;
&lt;h2&gt;Fun Day + Family BBQ&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;A freestyle celebration day: worship, big-group games, face paint, worship recap, games, and a family-style BBQ. No station rotation.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;glance&quot;&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;When&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;8:30a to 1:00p&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Feel&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Relaxed, celebratory&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Big add&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Family BBQ + parent connection&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;BBQ hosts&lt;/div&gt;&lt;div class=&quot;val&quot;&gt;Jake &amp;amp; Annie&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Thursday breaks the pattern. Instead of timed station rotations, stations run loose and kids flow between big-group games, face paint, and building to a closing celebration and a family BBQ hosted by Jake and Annie. Floaters carry the day - bathroom trips, line control, face paint, food setup, transitions.&lt;/p&gt;
&lt;h3&gt;Thursday timeline&lt;/h3&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;What is happening&lt;/th&gt;&lt;th&gt;Where / who&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;8:30-9:00&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Setup &amp;amp; BBQ prep meeting&lt;/span&gt; - confirm Fun Day boundaries, BBQ assignments, allergy labels&lt;/td&gt;&lt;td&gt;Briefing Room · all leads + BBQ team&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;9:00-9:25&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Drop-off &amp;amp; gathering&lt;/span&gt; - kids go straight into the Sanctuary by group (no Monday-style check-in)&lt;/td&gt;&lt;td&gt;Sanctuary&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;9:25-9:50&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Fun Day opening&lt;/span&gt; - welcome, prayer, explain the flow and safety boundaries&lt;/td&gt;&lt;td&gt;Sanctuary · Jake, Annie, worship&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;9:55-10:30&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Worship celebration&lt;/span&gt; - high-energy songs, dance, recap of the week&lt;/td&gt;&lt;td&gt;Sanctuary · worship team&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;10:30-11:15&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Big-group games + Face paint&lt;/span&gt; - games outside; face paint as a small rotating line&lt;/td&gt;&lt;td&gt;Outside + Face Paint Room&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;11:15-11:45&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Games, face paint, and open play&lt;/span&gt; - keep kids moving toward lunch and parent connection&lt;/td&gt;&lt;td&gt;Sanctuary / Outside / BBQ area&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;11:45-12:00&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Final celebration + BBQ transition&lt;/span&gt; - final songs, thank volunteers, recap, prayer&lt;/td&gt;&lt;td&gt;Sanctuary; BBQ setup begins&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;time&quot;&gt;12:00-1:00&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Family BBQ&lt;/span&gt; - family lunch, parent connection, pickup flow, cleanup&lt;/td&gt;&lt;td&gt;BBQ / Fellowship Area · all hands&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;h3&gt;Who does what on Thursday&lt;/h3&gt;
&lt;div class=&quot;roles&quot;&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--canopy)&quot;&gt;&lt;/span&gt;Team leads (Jake &amp;amp; Annie)&lt;/div&gt;&lt;p&gt;Run opening and the final celebration, set Fun Day boundaries, and host the family BBQ - serving line, welcome, parent connection, and pickup.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--berry)&quot;&gt;&lt;/span&gt;BBQ &amp;amp; hospitality team&lt;/div&gt;&lt;p&gt;Support Jake and Annie: set the serving line, drinks, allergy labels, trash, and seating; help run family lunch and cleanup.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--leaf)&quot;&gt;&lt;/span&gt;Group leaders&lt;/div&gt;&lt;p&gt;Stay with kids through the looser flow, keep track of your group across open stations, and help at BBQ pickup.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;role-card&quot;&gt;&lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--mango)&quot;&gt;&lt;/span&gt;Floaters &amp;amp; face-paint team&lt;/div&gt;&lt;p&gt;Bathroom trips, line control, face paint (washable, allergy-aware, with a no-paint alternative), food setup, and transitions.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout safety&quot;&gt;&lt;h4&gt;BBQ &amp;amp; pickup notes&lt;/h4&gt;&lt;p&gt;Adults only in the food-prep zone. Keep allergy labels on every dish. Supervised games stay near the eating area. Maintain the same pickup verification as the rotation days - parents arriving for food does not loosen pickup checks.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ GROUP LEADER GUIDE ============ --&gt;
&lt;section class=&quot;station&quot; id=&quot;crew&quot;&gt;
&lt;div class=&quot;station-banner b-crew&quot;&gt;
&lt;div class=&quot;ico&quot;&gt;GL&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;role&quot;&gt;For Group / Crew Leaders&lt;/div&gt;
&lt;h2&gt;Group Leader quick guide&lt;/h2&gt;
&lt;div class=&quot;tag&quot;&gt;You are the constant in a child&#x27;s morning. Stations change; you do not.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3&gt;Your job&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;Arrive by 8:30; get your group list, allergy notes, schedule, and bag.&lt;/li&gt;
&lt;li&gt;Learn names fast; use them kindly.&lt;/li&gt;
&lt;li&gt;Keep your group together &lt;strong&gt;at all times&lt;/strong&gt;, including transitions and bathrooms.&lt;/li&gt;
&lt;li&gt;Know your group and follow its color through the schedule grid.&lt;/li&gt;
&lt;li&gt;Participate in everything; kids follow your lead.&lt;/li&gt;
&lt;li&gt;Confirm allergies before snack and lunch; watch for kids who are left out, tired, or unsafe.&lt;/li&gt;
&lt;li&gt;Report bathroom needs, injuries, allergies, behavior, and disclosures to a director.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3&gt;Moving between stations&lt;/h3&gt;
&lt;ol class=&quot;flow&quot;&gt;
&lt;li&gt;When the lead sends you, gather your full group first.&lt;/li&gt;
&lt;li&gt;Do a quick head count.&lt;/li&gt;
&lt;li&gt;Walk (do not race) to your next station on the grid.&lt;/li&gt;
&lt;li&gt;Check in with the next station lead.&lt;/li&gt;
&lt;li&gt;Head count again before the activity starts.&lt;/li&gt;
&lt;/ol&gt;
&lt;p class=&quot;mini&quot; style=&quot;margin-top:8px;&quot;&gt;Your path moves one station up the grid each block, wrapping from Scripture back to Games. Need to step a child out to reset? Hand the rest of your group to a co-leader or floater first.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout watch&quot;&gt;&lt;h4&gt;Quick &quot;what if&quot;&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Child will not participate:&lt;/strong&gt; stay warm, offer a small job, let them watch. Never shame. &lt;strong&gt;Group too loud:&lt;/strong&gt; move close, lower your voice, give one clear direction. &lt;strong&gt;Kids excluding another:&lt;/strong&gt; re-pair and say &quot;in this group, everyone is included.&quot; &lt;strong&gt;Overly active child:&lt;/strong&gt; stand near, give a helper role, praise good choices. &lt;strong&gt;Disclosure of harm:&lt;/strong&gt; thank them, stay calm, get a director now. &lt;strong&gt;Unsure about anything:&lt;/strong&gt; ask a director; never guess about safety, allergies, or pickup.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ APPENDIX ============ --&gt;
&lt;section class=&quot;pagebreak&quot; id=&quot;appendix&quot;&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;h2 class=&quot;title&quot;&gt;Safety, contacts &amp;amp; prep&lt;/h2&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Print this page and post it at every station.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;&quot;&gt;
&lt;h3&gt;Pre-service checklist (all stations)&lt;/h3&gt;
&lt;ul class=&quot;check&quot;&gt;
&lt;li&gt;Read today&#x27;s Bible point and verse&lt;/li&gt;
&lt;li&gt;Bible point posted and visible&lt;/li&gt;
&lt;li&gt;Supplies set, out of kids&#x27; early reach&lt;/li&gt;
&lt;li&gt;Reset spot ready for trash and used items&lt;/li&gt;
&lt;li&gt;Entrance and pathways clear&lt;/li&gt;
&lt;li&gt;Allergy / no-food list reviewed (if serving food)&lt;/li&gt;
&lt;li&gt;Attention signal and &quot;Wow, God!&quot; ready&lt;/li&gt;
&lt;li&gt;Know where the director and first aid are&lt;/li&gt;
&lt;li&gt;Know which groups you have and in what order&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:0;background:#fbe9e7;border-color:#e7bdb8;&quot;&gt;
&lt;h3 style=&quot;color:#a8362f;&quot;&gt;Safety quick card&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;&lt;strong&gt;Allergy / food doubt&lt;/strong&gt; - stop, ask the snack lead or a director. Never guess.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Injury or illness&lt;/strong&gt; - pause, get first aid or a director.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Bathroom&lt;/strong&gt; - group leader handles per policy; never one-on-one out of sight.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Security concern&lt;/strong&gt; - get a director or Jake or Annie immediately.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Disclosure of harm or abuse&lt;/strong&gt; - thank the child, stay calm, involve a director now. No secrecy, no investigating.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Faith or salvation question&lt;/strong&gt; - affirm, no pressure, loop in a pastoral leader after.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Unsure&lt;/strong&gt; - ask a director.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h3&gt;Key people &amp;amp; spaces&lt;/h3&gt;
&lt;div class=&quot;tbl-wrap&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Role&lt;/th&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;Find them&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Safety leads&lt;/td&gt;&lt;td&gt;Jake &amp;amp; Annie&lt;/td&gt;&lt;td&gt;Primary point people for check-in questions, pickup questions, injuries, parent concerns, and emergency decisions.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Directors / Team leads&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Jake &amp;amp; Annie&lt;/td&gt;&lt;td&gt;Sanctuary or Briefing Room&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Worship / Dance (Opening &amp;amp; Closing)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Grace, Eva, Mya&lt;/td&gt;&lt;td&gt;Sanctuary&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Production / A-V&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Ian&lt;/td&gt;&lt;td&gt;Sanctuary booth&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Content / station support&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Drea&lt;/td&gt;&lt;td&gt;Roving&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Bible - Under the Waterfall&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Ray &amp;amp; Isaias&lt;/td&gt;&lt;td&gt;MPR Room&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Memory Verse - Verse Vines&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Danielle &amp;amp; Gaby B.&lt;/td&gt;&lt;td&gt;Tots Room&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Crafts - Creation Station&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Sarah L. &amp;amp; Kathy L.&lt;/td&gt;&lt;td&gt;Elementary Area&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Games - Wild About God&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Mikai, Isaac, Selah&lt;/td&gt;&lt;td&gt;Outside Area&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Snack&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Savannah E. &amp;amp; Brooke&lt;/td&gt;&lt;td&gt;Cave Room&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Group: Tree Frogs (3-4)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Gabriela Kish &lt;/td&gt;&lt;td&gt;Red lanyards&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Group: Toucans (5)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;JoLayne E. &amp;amp; Kimberly&lt;/td&gt;&lt;td&gt;Orange lanyards&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Group: Monkeys (6-7)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Grace K. &amp;amp; Eva&lt;/td&gt;&lt;td&gt;Yellow lanyards&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Group: Parrots (8-9)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Hailey S. &amp;amp; Stacy G.&lt;/td&gt;&lt;td&gt;Green lanyards&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Group: Tigers (10-12)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Elisabeth M.&lt;/td&gt;&lt;td&gt;Blue lanyards&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Check-in lead&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Kendra (+2-3 volunteers)&lt;/td&gt;&lt;td&gt;Entrance turf (Monday)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;k&quot;&gt;Family BBQ (Thursday)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Jake &amp;amp; Annie&lt;/td&gt;&lt;td&gt;BBQ / Fellowship Area&lt;/td&gt;&lt;/tr&gt;

&lt;div class=&quot;grid two&quot;&gt;

&lt;h3 style=&quot;font-size:1.05rem;&quot;&gt;Safety &amp;amp; volunteer care setup&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
&lt;li&gt;&lt;strong&gt;Central first aid station&lt;/strong&gt; with first aid kits, the AED location posted, water, and emergency info.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Walkie-talkies&lt;/strong&gt; for emergencies - Jake, Annie, and the Jake and Annie each carry one.&lt;/li&gt;
&lt;li&gt;Two &lt;strong&gt;sports coolers&lt;/strong&gt; of water available for kids and volunteers.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Volunteer office area&lt;/strong&gt; stocked with snacks, coffee, water, and extra handouts.&lt;/li&gt;

&lt;ul class=&quot;clean&quot;&gt;

&lt;li&gt;&lt;strong&gt;Game supplies&lt;/strong&gt; live in the &lt;strong&gt;closets&lt;/strong&gt;; return them after each block.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;8:40 AM daily review:&lt;/strong&gt; a one-page content handout is covered at the morning volunteer briefing.&lt;/li&gt;

`;
const STORAGE_KEY='houseKidsVbs2026FinalDashboardV4_cleanNotes';
let state=loadState(); let activeTab='overview'; let filters={q:'',group:'All',medical:'All'};
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{let saved=localStorage.getItem(STORAGE_KEY);return saved?JSON.parse(saved):clone(INITIAL_DATA)}catch(e){return clone(INITIAL_DATA)}}
function applyRequiredUpdates(){
  let tf=state.groups.find(g=>g.name==='Tree Frogs');
  if(tf){tf.leaders=['Gabriela Kish','Gabby B.','Mya V.'];tf.capacityNotes='Gabby B. and Mya V. are assigned to help Gabriela Kish with Tree Frogs.';}
  let st=state.stations.find(s=>s.name==='Tree Frogs Group');
  if(st){st.needed=3;st.notes='Age 3 to 4. Leaders: Gabriela Kish, Gabby B., and Mya V.';st.location='Tots classroom / youngest group area';}
  const needVols=[['vol_30_gabbyb_treefrogs','Gabby B.','Tree Frogs Group','Helping Gabriela Kish with Tree Frogs.'],['vol_31_myav_treefrogs','Mya V.','Tree Frogs Group','Helping Gabriela Kish with Tree Frogs.']];
  needVols.forEach(([id,name,station,notes])=>{let v=state.volunteers.find(x=>x.id===id||x.name===name&&x.station===station); if(v){v.name=name;v.station=station;v.role='Leader';v.notes=notes;} else state.volunteers.push({id,name,station,phone:'',email:'',role:'Leader',notes});});
  state.schedule=clone(INITIAL_DATA.schedule);
}
applyRequiredUpdates();

function save(){normalizeData(false); localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); showSaved(); render()}
function silentSave(){normalizeData(false); localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); showSaved()}
function showSaved(){let el=document.getElementById('saveStatus'); if(!el)return; el.textContent='Saving...'; setTimeout(()=>{el.textContent='Auto-saved '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},120)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function asText(s){return String(s??'').trim()}
function groupObj(name){return state.groups.find(g=>g.name===name)}
function colorForGroup(name){return groupObj(name)?.hex || '#64748b'}
function darkClass(hex){hex=(hex||'#fff').replace('#',''); if(hex.length===3)hex=hex.split('').map(x=>x+x).join(''); let r=parseInt(hex.slice(0,2),16)||255,g=parseInt(hex.slice(2,4),16)||255,b=parseInt(hex.slice(4,6),16)||255; return (0.299*r+0.587*g+0.114*b)<140?'dark':''}
function assignGroup(age){age=Number(age); if(!age)return 'Needs Age'; if(age>=3&&age<=4)return 'Tree Frogs'; if(age===5)return 'Toucans'; if(age>=6&&age<=7)return 'Monkeys'; if(age>=8&&age<=9)return 'Parrots'; if(age>=10&&age<=12)return 'Tigers'; return 'Needs Review'}
function isMissingInfo(c){return !asText(c.age)}
function missingKids(){return state.children.filter(isMissingInfo).sort((a,b)=>String(a.group).localeCompare(String(b.group))||String(a.firstName).localeCompare(String(b.firstName)))}
function normalizeData(autoAssign){state.groups.forEach(g=>{g.leaders=g.leaders||[]}); state.children.forEach(c=>{if(autoAssign){c.manualGroupOverride=false} if(autoAssign || c.group==='Needs Age' || c.group==='Needs Review' || !groupObj(c.group)) c.group=assignGroup(c.age); c.color=groupObj(c.group)?.color||''; if(c.gender===undefined)c.gender='';})}
function autoAssignAll(){normalizeData(true); save(); alert('Kids were reassigned by age. Missing ages were placed in Needs Age, and ages outside 3 to 12 were placed in Needs Review. Manual group moves were cleared.')}
function rosterKids(group){return state.children.filter(c=>c.group===group).sort((a,b)=>String(a.firstName).localeCompare(String(b.firstName)))}
function allergyKids(){return state.children.filter(k=>asText(k.medicalNotes)).sort((a,b)=>String(a.group).localeCompare(String(b.group))||String(a.firstName).localeCompare(String(b.firstName)))}
function stationVols(name){return state.volunteers.filter(v=>v.station===name).sort((a,b)=>String(a.name).localeCompare(String(b.name)))}
function renderStats(){let kids=state.children, allergies=allergyKids().length, miss=missingKids().length; let covered=state.stations.map(s=>stationVols(s.name).length>=Number(s.needed||0)).filter(Boolean).length; let groups=state.groups.filter(g=>!g.name.startsWith('Needs')).length; let html=[['Kids',kids.length],['Missing Age',miss],['Allergies / Medical',allergies],['Volunteers',state.volunteers.length],['Stations Covered',covered+'/'+state.stations.length],['Groups',groups]].map(([l,v])=>`<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');document.getElementById('stats').innerHTML=html}
function renderTabs(){let tabs=[['overview','Overview'],['kids','Kids'],['missing','Needs Info'],['groups','Teams + Rosters'],['volunteers','Volunteers'],['stations','Stations + Locations'],['schedule','Schedule + Flow'],['packets','Mini Packets'],['manual','Volunteer Manual'],['allergies','Allergies'],['merge','CSV Merge'],['print','Print Center']];document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${activeTab===t[0]?'active':''}" onclick="activeTab='${t[0]}';render()">${t[1]}</button>`).join('')}
function shell(left,right){return `<div class="grid"><aside>${left}</aside><section>${right}</section></div>`}
function groupOptions(selected, includeAuto=false){let opts= includeAuto?['Auto assign by age',...state.groups.map(g=>g.name)]:state.groups.map(g=>g.name); return opts.map(g=>`<option value="${esc(g)}" ${selected===g?'selected':''}>${esc(g)}</option>`).join('')}
function stationOptions(selected){let names=['Unassigned',...state.stations.map(s=>s.name)];return names.map(n=>`<option ${selected===n?'selected':''}>${esc(n)}</option>`).join('')}
function filtersCard(){let groups=['All',...state.groups.map(g=>g.name)];return `<div class="card no-print"><h2>Filters</h2><div class="filters"><input placeholder="Search child, parent, volunteer, station" value="${esc(filters.q)}" oninput="filters.q=this.value;render()"><select onchange="filters.group=this.value;render()">${groups.map(g=>`<option ${filters.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select><select onchange="filters.medical=this.value;render()"><option ${filters.medical==='All'?'selected':''}>All</option><option ${filters.medical==='With allergies / medical'?'selected':''}>With allergies / medical</option><option ${filters.medical==='Needs age'?'selected':''}>Needs age</option></select></div></div><div class="card no-print"><h2>Group Tools</h2><div class="actions"><button onclick="autoAssignAll()">Auto-assign all by age</button><button class="soft" onclick="activeTab='missing';render()">Fix missing info</button></div><p class="muted">You can still move any child manually using Edit or the quick group dropdown.</p></div>`}
function filteredKids(){let q=filters.q.toLowerCase();return state.children.filter(c=>{let blob=[c.fullName,c.firstName,c.lastName,c.primaryContact,c.phone,c.email,c.group,c.gender,c.medicalNotes].join(' ').toLowerCase(); if(q&&!blob.includes(q))return false; if(filters.group!=='All'&&c.group!==filters.group)return false; if(filters.medical==='With allergies / medical'&&!asText(c.medicalNotes))return false; if(filters.medical==='Needs age'&&!isMissingInfo(c))return false; return true}).sort((a,b)=>String(a.group).localeCompare(String(b.group))||String(a.firstName).localeCompare(String(b.firstName)))}
function statusPills(c){let bits=[]; if(!asText(c.age))bits.push('<span class="pill red">Missing age</span>'); if(c.manualGroupOverride)bits.push('<span class="pill blue">Manual group</span>'); if(asText(c.medicalNotes))bits.push('<span class="pill red">Allergy / medical</span>'); return bits.join('')}
function kidCard(c){return `<div class="kid"><div class="row-title"><div><b>${esc(c.fullName)}</b><div class="muted">Age ${esc(c.age||'?')} • ${esc(c.group)}${c.manualGroupOverride?' • manual group':''}</div><div>${statusPills(c)}</div></div><button class="soft no-print" onclick="editKid('${c.id}')">Edit</button></div>${asText(c.medicalNotes)?`<div><span class="pill red">Medical</span> ${esc(c.medicalNotes)}</div>`:''}</div>`}
function renderOverview(){let miss=missingKids(); let groupCards=state.groups.map(g=>{let kids=rosterKids(g.name);return `<div class="group-card"><div class="group-head ${darkClass(g.hex)}" style="background:${esc(g.hex)}"><span>${esc(g.name)}</span><span>${kids.length}</span></div><div class="group-body"><div class="muted">Age ${esc(g.ageRange)} • ${esc(g.color)}</div><div style="margin-top:8px">${(g.leaders||[]).map(l=>`<span class="pill">${esc(l)}</span>`).join('')||'<span class="muted">No leaders assigned</span>'}</div><div class="mini-actions no-print" style="margin-top:10px"><button class="soft" onclick="printTeam('${esc(g.name)}')">Print</button><button class="soft" onclick="editGroup('${esc(g.name)}')">Edit team</button></div></div></div>`}).join('');let stationCards=state.stations.map(s=>{let vols=stationVols(s.name);let ok=vols.length>=Number(s.needed||0);return `<div class="station"><b>${esc(s.name)}</b><div class="muted">${esc(s.location||'Location not set')}</div><div class="muted">Need ${esc(s.needed)} • Assigned ${vols.length} ${ok?'✅':'⚠️'}</div><div>${vols.map(v=>`<span class="pill ${ok?'':'yellow'}">${esc(v.name)}</span>`).join('')||'<span class="pill yellow">Needs volunteer</span>'}</div></div>`}).join('');return shell(filtersCard()+`<div class="card"><h2>Warnings</h2>${miss.length?`<div class="notice danger"><b>${miss.length} kids need age filled in.</b><br>Open the Needs Info tab to fix them before printing final rosters.</div>`:'<div class="notice good"><b>All kids have age filled in.</b></div>'}</div>`,`<div class="card"><h2>Team Snapshot</h2><div class="group-grid">${groupCards}</div></div><div class="card"><h2>Station Coverage + Locations</h2><div class="group-grid">${stationCards}</div></div><div class="card"><h2>Quick Medical Snapshot</h2><p class="muted">Teacher rosters only print name and age. Medical details stay here and in the Allergies tab.</p><div class="list">${allergyKids().slice(0,10).map(kidCard).join('')||'<div class="notice">No allergy or medical notes listed.</div>'}</div></div>` )}
function renderKids(){let kids=filteredKids();let table=`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Warnings</th><th>Age</th><th>Team</th><th>Quick Move</th><th>Contact</th><th>Phone</th><th>Allergy / Medical</th><th class="no-print">Edit</th></tr></thead><tbody>${kids.map(c=>`<tr><td><b>${esc(c.fullName)}</b></td><td>${statusPills(c)}</td><td>${esc(c.age||'?')}</td><td><span class="pill" style="background:${colorForGroup(c.group)}22;color:${colorForGroup(c.group)}">${esc(c.group)}</span></td><td class="no-print"><select class="quick-move" onchange="moveKid('${c.id}',this.value)">${groupOptions(c.group)}</select></td><td>${esc(c.primaryContact)}</td><td>${esc(c.phone)}</td><td>${esc(c.medicalNotes||'')}</td><td class="no-print"><button class="soft" onclick="editKid('${c.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`;return shell(filtersCard(),`<div class="card"><div class="section-title"><h2>Kids (${kids.length})</h2><div class="actions no-print"><button class="soft" onclick="editKid()">Add Kid</button><button class="soft" onclick="exportKidsCSV()">Export Kids CSV</button></div></div>${table}</div>`)}
function renderMissing(){let kids=missingKids(); return shell(filtersCard(),`<div class="card"><div class="section-title"><h2>Needs Age (${kids.length})</h2><button class="soft no-print" onclick="autoAssignAll()">Auto-assign by age after fixes</button></div>${kids.length?'<div class="notice danger">Fill in age here. Age changes can automatically place each child in the correct group.</div>':'<div class="notice good">No missing ages.</div>'}<div class="list">${kids.map(kidCard).join('')}</div></div>`)}
function rosterTable(g, cls=''){let kids=rosterKids(g.name);return `<div class="card ${cls} print-page" id="team-${slug(g.name)}"><div class="section-title"><div><h2>${esc(g.name)} · Age ${esc(g.ageRange)}</h2><p class="muted">Leaders: ${(g.leaders||[]).map(esc).join(', ')||'Not assigned'} • Color: ${esc(g.color)}</p></div><button class="soft no-print" onclick="editGroup('${esc(g.name)}')">Edit team</button></div>${g.capacityNotes?`<div class="notice">${esc(g.capacityNotes)}</div>`:''}<table><thead><tr><th>First name</th><th>Last name</th><th>Age</th><th class="no-print">Move / Edit</th></tr></thead><tbody>${kids.map(c=>`<tr><td><b>${esc(c.firstName)}</b></td><td>${esc(c.lastName)}</td><td>${esc(c.age||'?')}</td><td class="no-print"><div class="mini-actions"><select class="quick-move" onchange="moveKid('${c.id}',this.value)">${groupOptions(c.group)}</select><button class="soft" onclick="editKid('${c.id}')">Edit</button></div></td></tr>`).join('')}</tbody></table></div>`}
function renderGroups(){return `<div class="notice no-print">Roster handouts show only first name, last name, and age. Use quick move or Edit to move kids around groups. Manual moves stay in place when you upload a new name + age roster unless you click Auto-assign all by age.</div><div class="actions no-print" style="margin-bottom:12px"><button onclick="printAllTeams()">Print all team handouts</button><button class="soft" onclick="autoAssignAll()">Auto-assign all by age</button></div>${state.groups.map(g=>rosterTable(g)).join('')}`}
function renderVolunteers(){let grouped=state.stations.map(s=>({s,vols:stationVols(s.name)}));return `<div class="card no-print"><button onclick="editVolunteer()">Add Volunteer</button></div><div class="group-grid">${grouped.map(({s,vols})=>`<div class="card"><h2>${esc(s.name)}</h2><p class="muted">Location: ${esc(s.location||'Not set')}</p><p class="muted">Needed: ${esc(s.needed)} • Assigned: ${vols.length}</p><div class="list">${vols.map(v=>`<div class="vol"><div class="row-title"><b>${esc(v.name)}</b><span class="pill">${esc(v.role||'Volunteer')}</span></div><div class="muted">${esc(v.phone)} ${v.email?'• '+esc(v.email):''}</div><div class="mini-actions no-print"><button class="soft" onclick="editVolunteer('${v.id}')">Edit</button><button class="soft" onclick="removeVolunteer('${v.id}')">Remove</button></div></div>`).join('')||'<div class="notice">No volunteers assigned yet.</div>'}</div></div>`).join('')}</div>`}
function renderStations(){return `<div class="card no-print"><button onclick="editStation()">Add Station / Location</button> <button class="soft" onclick="printStations()">Print station handout</button></div><div class="card" id="stationsPrint"><h2>Station Needs, Leaders, and Locations</h2><div class="list">${state.stations.map(s=>{let vols=stationVols(s.name);let ok=vols.length>=Number(s.needed||0);return `<div class="station"><div class="row-title"><div><b>${esc(s.name)}</b><div class="muted">Location: ${esc(s.location||'Not set')}</div><div class="muted">Need ${esc(s.needed)} • Assigned ${vols.length} ${ok?'✅':'⚠️'}</div><div class="muted">${esc(s.notes||'')}</div></div><div class="mini-actions no-print"><button class="soft" onclick="editStation('${s.id}')">Edit</button><button class="soft" onclick="removeStation('${s.id}')">Remove</button></div></div><div>${vols.map(v=>`<span class="pill">${esc(v.name)}</span>`).join('')||'<span class="pill yellow">Needs volunteer</span>'}</div></div>`}).join('')}</div></div>`}
function renderSchedule(){return `<div class="card no-print"><button onclick="editSchedule()">Add Schedule Item</button> <button class="soft" onclick="printSchedule()">Print schedule and flow</button></div><div class="card" id="schedulePrint"><h2>VBS Structure, Schedule, and Flow</h2><p class="muted">Manual schedule source. No map is included here, only times, locations, leads, flow notes, and the route directions in Mini Packets.</p><div class="table-wrap"><table><thead><tr><th>Time</th><th>Part of Day</th><th>Location</th><th>Lead</th><th>Flow Notes</th><th class="no-print">Edit</th></tr></thead><tbody>${(state.schedule||[]).map((r,i)=>`<tr><td><b>${esc(r.time)}</b></td><td>${esc(r.title)}</td><td>${esc(r.location)}</td><td>${esc(r.owner)}</td><td>${esc(r.notes)}</td><td class="no-print"><button class="soft" onclick="editSchedule(${i})">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function renderPackets(){return `<div class="notice no-print">These are the printable mini packets from the group-leader file, kept map-free and fused into this dashboard.</div><div class="actions no-print" style="margin-bottom:12px"><button onclick="printPackets()">Print all mini packets</button></div><div id="packetsPrint" class="route-grid">${Object.entries(PACKET_ROUTES).map(([group,steps])=>{let g=groupObj(group)||{leaders:[],ageRange:''};return `<div class="card print-page"><div class="badge">Print ready</div><h2>${esc(group)} · Age ${esc(g.ageRange)}</h2><p class="muted">Leaders: ${(g.leaders||[]).map(esc).join(', ')||'Not assigned'}</p><div class="list">${steps.map((s,i)=>`<div class="route-step"><b>${i===0?'Start':esc(s.split(':')[0])}</b><div>${esc(i===0?s:s.includes(':')?s.split(':').slice(1).join(':').trim():s)}</div></div>`).join('')}</div></div>`}).join('')}</div>`}
function renderManual(){return `<div class="card"><div class="section-title"><div><h2>Volunteer Manual</h2><p class="muted">Embedded from the uploaded manual so this file stays all-in-one.</p></div><button class="soft no-print" onclick="document.getElementById('manualFrame').contentWindow.print()">Print manual frame</button></div><iframe id="manualFrame" class="manual-frame" srcdoc="${MANUAL_SRCDOC}"></iframe></div>`}

function renderMerge(){return `<div class="card"><h2>Upload Updated Kids Roster</h2><p>Upload any new name + age CSV and the dashboard will update the kids list, refresh ages, add new kids, remove kids not on the roster, and place them into age-based groups. Manual group moves are preserved.</p><div class="group-grid"><label class="filebtn">Upload Name + Age Roster CSV<input type="file" accept=".csv" onchange="handleFile('roster',this)" style="display:none"></label><label class="filebtn">Merge Full Registration CSV<input type="file" accept=".csv" onchange="handleFile('registration',this)" style="display:none"></label></div><div class="notice" style="margin-top:14px"><b>Team rules:</b> ages 3 to 4 Tree Frogs, age 5 Toucans, ages 6 to 7 Monkeys, ages 8 to 9 Parrots, ages 10 to 12 Tigers. Missing age goes to Needs Age. Click Auto-assign all by age to clear manual moves.</div></div><div class="card"><h2>Data Management</h2><p class="muted">Every edit auto-saves in this browser using local storage. Export a backup before switching computers or clearing browser data.</p><div class="actions"><button onclick="exportJSON()">Export Backup JSON</button><button onclick="importJSONPrompt()">Import Backup JSON</button><button onclick="exportKidsCSV()">Export Kids CSV</button></div></div>`}
function renderPrint(){return `<div class="notice no-print">Choose exactly what you need. Team rosters print only names and ages.</div><div class="tools no-print"><div class="tool-card"><h3>Team handouts</h3><p class="muted">One page per team.</p><button onclick="printAllTeams()">Print all teams</button></div><div class="tool-card"><h3>Mini packets</h3><p class="muted">Routes and station order.</p><button onclick="printPackets()">Print mini packets</button></div><div class="tool-card"><h3>Schedule and flow</h3><p class="muted">Times, locations, leads, notes.</p><button onclick="printSchedule()">Print schedule</button></div><div class="tool-card"><h3>Station coverage</h3><p class="muted">Station leaders and needs.</p><button onclick="printStations()">Print stations</button></div><div class="tool-card"><h3>Allergies / medical</h3><p class="muted">Separate first aid and snack list.</p><button onclick="printAllergies()">Print allergy list</button></div></div><div id="printBundle"><h1 class="print-only">VBS Teacher Handouts</h1>${state.groups.map(g=>rosterTable(g,'print-bundle')).join('')}<div class="card print-bundle" id="printScheduleCopy">${documentForSchedule()}</div><div class="card print-bundle" id="printStationsCopy">${documentForStations()}</div></div>`}
function render(){normalizeData(false); renderStats(); renderTabs(); let v=document.getElementById('view'); let map={overview:renderOverview,kids:renderKids,missing:renderMissing,groups:renderGroups,volunteers:renderVolunteers,stations:renderStations,schedule:renderSchedule,packets:renderPackets,manual:renderManual,allergies:renderAllergies,merge:renderMerge,print:renderPrint}; v.innerHTML=(map[activeTab]||renderOverview)()}
function formVal(id){return document.getElementById(id)?.value.trim()||''}
